    if (!constructGroup) return null;
    // Dedicated lifespan range — not gated by the general tactical lifespan
    const min = params.attackVectorMinLife;
    const max = Math.max(min, params.attackVectorMaxLife);
    const life = min + Math.random() * (max - min);

    // Pick a target anchor — reuse the existing vertex-pip picker logic
    // by calling into spawnVertexPip's geometry choice. Inline it for simplicity:
    let localAnchor;
    if (params.construct === 'fortress') {
      const tiers = Math.max(3, Math.floor(5 * params.structureDensity + 2));
      const i = Math.floor(Math.random() * tiers);
      const w = (12 - i * 1.6) / 2;
      const tierY = i * 1.8 - 4;
      const corner = Math.floor(Math.random() * 4);
      const xs = [-w, w, w, -w], zs = [-w, -w, w, w];
      localAnchor = new THREE.Vector3(xs[corner], tierY, zs[corner]);
    } else if (params.construct === 'pyramid') {
      const tiers = Math.max(4, Math.floor(7 * params.structureDensity + 2));
      const i = Math.floor(Math.random() * tiers);
      const ratio = i / Math.max(1, tiers - 1);
      const w = (12 + (2 - 12) * ratio) / 2;
      const y = -4 + i * 1.4;
      const c = Math.floor(Math.random() * 4);
      const xs = [-w, w, w, -w], zs = [-w, -w, w, w];
      localAnchor = new THREE.Vector3(xs[c], y, zs[c]);
    } else {
      // Generic surface point for other shapes
      const theta = Math.random() * Math.PI * 2;
      const phi = (Math.random() - 0.5) * Math.PI * 0.6;
      const r = (params.construct === 'lattice' || params.construct === 'hub' || params.construct === 'gridcube') ? 5 : 3.5;
      localAnchor = new THREE.Vector3(
        Math.cos(theta) * Math.cos(phi) * r,
        2 + Math.sin(phi) * r,
        Math.sin(theta) * Math.cos(phi) * r
      );
    }

    // Resolve current world-space target
    constructGroup.updateMatrixWorld();
    const targetWorld = localAnchor.clone().applyMatrix4(constructGroup.matrixWorld);

    // Pick path style from weighted pool
    const pathStyle = pickWeighted(params.attackVectorPathWeights, 'straight');

    // Frame count from dedicated min/max
    const fmin = Math.max(2, Math.floor(params.attackVectorMinFrames));
    const fmax = Math.max(fmin, Math.floor(params.attackVectorMaxFrames));
    const frameCount = fmin + Math.floor(Math.random() * (fmax - fmin + 1));

    // Path: start point is OUT in space, biased outward from construct center
    const constructCenter = new THREE.Vector3(0, 2, 0).applyMatrix4(constructGroup.matrixWorld);
    const outward = targetWorld.clone().sub(constructCenter).normalize();
    outward.x += (Math.random() - 0.5) * 0.7;
    outward.y += 0.25 + Math.random() * 0.5;
    outward.z += (Math.random() - 0.5) * 0.7;
    outward.normalize();
    const startDistance = 22 + Math.random() * 18;
    const startWorld = targetWorld.clone().add(outward.clone().multiplyScalar(startDistance));

    // For curve/drift, compute a perpendicular offset for the midpoint
    let midOffset = new THREE.Vector3(0, 0, 0);
    if (pathStyle === 'curve' || pathStyle === 'drift') {
      const approachDir = targetWorld.clone().sub(startWorld).normalize();
      const up = new THREE.Vector3(0, 1, 0);
      const side = new THREE.Vector3().crossVectors(approachDir, up).normalize();
      if (side.lengthSq() < 0.01) side.set(1, 0, 0);
      const sign = Math.random() < 0.5 ? -1 : 1;
      const offsetMag = pathStyle === 'curve' ? (6 + Math.random() * 8) : (1.5 + Math.random() * 3);
      const verticalComponent = (Math.random() - 0.3) * offsetMag * 0.6;
      midOffset = side.multiplyScalar(sign * offsetMag).add(new THREE.Vector3(0, verticalComponent, 0));
    }

    const mid = startWorld.clone().lerp(targetWorld, 0.5).add(midOffset);

    function bezierPoint(u) {
      const a = 1 - u;
      const x = a*a * startWorld.x + 2*a*u * mid.x + u*u * targetWorld.x;
      const y = a*a * startWorld.y + 2*a*u * mid.y + u*u * targetWorld.y;
      const z = a*a * startWorld.z + 2*a*u * mid.z + u*u * targetWorld.z;
      return new THREE.Vector3(x, y, z);
    }
    function bezierTangent(u) {
      const a = 1 - u;
      const tn = new THREE.Vector3();
      tn.x = 2 * a * (mid.x - startWorld.x) + 2 * u * (targetWorld.x - mid.x);
      tn.y = 2 * a * (mid.y - startWorld.y) + 2 * u * (targetWorld.y - mid.y);
      tn.z = 2 * a * (mid.z - startWorld.z) + 2 * u * (targetWorld.z - mid.z);
      return tn.normalize();
    }

    // Build the frames
    const frames = [];
    const startSize = 2.5 + Math.random() * 1.5;
    const endSize = 0.4 + Math.random() * 0.4;

    for (let i = 0; i < frameCount; i++) {
      const linearU = (i + 1) / (frameCount + 1);
      const u = Math.pow(linearU, 0.85);
      const pos = bezierPoint(u);
      const tangent = bezierTangent(u);

      const size = startSize + (endSize - startSize) * u;
      const half = size / 2;

      const up = new THREE.Vector3(0, 1, 0);
      const right = new THREE.Vector3().crossVectors(tangent, up);
      if (right.lengthSq() < 0.01) right.set(1, 0, 0);
      right.normalize();
      const frameUp = new THREE.Vector3().crossVectors(right, tangent).normalize();

      const corners = [
        pos.clone().addScaledVector(right, -half).addScaledVector(frameUp, -half),
        pos.clone().addScaledVector(right, half).addScaledVector(frameUp, -half),
        pos.clone().addScaledVector(right, half).addScaledVector(frameUp, half),
        pos.clone().addScaledVector(right, -half).addScaledVector(frameUp, half)
      ];
      const positions = [];
      for (let c = 0; c < 4; c++) {
        const a = corners[c], b = corners[(c + 1) % 4];
        positions.push(a.x, a.y, a.z, b.x, b.y, b.z);
      }

      const isTerminal = i === frameCount - 1;
      if (isTerminal) {
        const innerHalf = half * 0.35;
        const cTop = pos.clone().addScaledVector(frameUp, innerHalf);
        const cBot = pos.clone().addScaledVector(frameUp, -innerHalf);
        const cLeft = pos.clone().addScaledVector(right, -innerHalf);
        const cRight = pos.clone().addScaledVector(right, innerHalf);
        positions.push(cTop.x, cTop.y, cTop.z, cBot.x, cBot.y, cBot.z);
        positions.push(cLeft.x, cLeft.y, cLeft.z, cRight.x, cRight.y, cRight.z);
      }

      const lineGeo = new LineSegmentsGeometry();
      lineGeo.setPositions(positions);
      const lineMat = new LineMaterial({
        color: AMBER.getHex(),
        linewidth: isTerminal ? 2.2 : 1.4,
        transparent: true,
        opacity: 0,
        worldUnits: false,
        alphaToCoverage: true
      });
      lineMat.resolution.set(window.innerWidth, window.innerHeight);
      lineMat.userData.baseOpacity = isTerminal ? 1.0 : 0.85;
      const mesh = new LineSegments2(lineGeo, lineMat);
      tacWorldGroup.add(mesh);

      frames.push({ mesh, mat: lineMat, u, pos, isTerminal });
    }

    // Dedicated attack-vector label pool — distinct from general APPROACH
    const ATTACK_LABELS = [
      'ATTACK VECTOR', 'IMPACT VECTOR', 'PAYLOAD INBOUND', 'TORPEDO LOCK',
      'STRIKE PROFILE', 'KILL VECTOR', 'BOMB RUN', 'TRENCH RUN',
      'DESCENT TRAJECTORY', 'TERMINAL APPROACH', 'IMPACT PROFILE',
      'WARHEAD VECTOR', 'KINETIC INBOUND', 'BUNKER BUSTER'
    ];
    const label = ATTACK_LABELS[Math.floor(Math.random() * ATTACK_LABELS.length)];
    const totalDistance = startWorld.distanceTo(targetWorld);
    const heading = ((Math.atan2(targetWorld.z - startWorld.z, targetWorld.x - startWorld.x) * 180 / Math.PI) + 360) % 360;
    const labelEl = makeLabel(
      `${label}`,
      `${heading.toFixed(1)}° · ${(totalDistance * 0.018).toFixed(3)}kkm`,
      '',
      life
    );

    const ann = {
      type: 'attack_vector',
      isAttackVector: true,
      terminalPos: frames[frames.length - 1].pos,
      frames,
      pathStyle,
      bornT: clock.elapsedTime,
      appearMode: pickWeighted(params.tacticalAppearWeights, 'fade'),
      animateMode: pickWeighted(params.tacticalAnimateWeights, 'steady'),
      life,
      expireT: t + life,
      labelEl,
      labelOffset: null,
      worldObjects: frames.map(f => f.mesh),
      worldMats: frames.map(f => f.mat)
    };
    tacAnnotations.push(ann);
    return ann;
  }

  // Update an attack vector annotation: drives the sequential reveal +
  // terminal lock-pulse, and positions the label at the terminal frame.
  function updateAttackVector(ann, t) {
    const age = t - ann.bornT;
    const remaining = ann.expireT - t;
    // Reveal phase: cursor walks along chain over the first ~30% of life
    const revealPhase = Math.min(0.30, ann.life * 0.35);
    const vanishPhase = Math.min(0.30, ann.life * 0.25);
    const revealP = Math.min(1, age / revealPhase);
    const vanishP = Math.min(1, remaining / vanishPhase);

    // Lit cursor walks 0..1 along the chain during reveal
    const litCursor = Math.pow(revealP, 0.6) * ann.frames.length;

    // Terminal-frame pulse: once all frames lit, the terminal pulses
    const allLit = revealP >= 1;
    const pulsePhase = allLit ? (age - revealPhase) * 3.0 : 0;
    const pulse = 0.5 + 0.5 * Math.sin(pulsePhase * Math.PI * 2);

    for (let i = 0; i < ann.frames.length; i++) {
      const f = ann.frames[i];
      const dist = litCursor - i;
      let frameOp;
      if (dist <= 0) {
        // Not yet reached
        frameOp = 0;
      } else if (dist < 1) {
        // Mid-reveal: ramping up
        frameOp = dist;
      } else {
        // Fully lit
        frameOp = 1;
      }
      // Terminal: once all lit, apply pulse
      if (f.isTerminal && allLit) {
        frameOp = 0.55 + pulse * 0.45;
      }
      // Vanish phase — fade all frames out together at end of life
      frameOp *= vanishP;
      f.mat.opacity = (f.mat.userData.baseOpacity || 0.85) * frameOp;
      f.mesh.visible = frameOp > 0.01;
    }

    // Position label at projected terminal frame
    const projT = project3DToScreen(ann.terminalPos);
    if (!projT.onScreen) {
      ann.labelEl.style.display = 'none';
      return;
    }
    ann.labelEl.style.display = '';

    if (!ann.labelOffset) {
      // Bias label down-right from terminal
      ann.labelOffset = { dx: 30, dy: 30 };
    }

    // Label opacity: track the terminal frame's pulse + reveal
    const termOp = ann.frames[ann.frames.length - 1].mat.opacity;
    ann.labelEl.style.opacity = Math.min(1, termOp * 1.4) * vanishP;
    ann.labelEl.style.left = (projT.x + ann.labelOffset.dx) + 'px';
    ann.labelEl.style.top = (projT.y + ann.labelOffset.dy) + 'px';

    // Update countdown in subtext
    const sub = ann.labelEl.querySelector('.sub');
    if (sub && allLit) {
      const tImpact = remaining;
      // Re-render subtext to add live countdown
      // (Keep existing heading/range, append countdown)
      if (!ann.subBase) ann.subBase = sub.textContent;
      sub.textContent = `${ann.subBase} · LOCK ${tImpact.toFixed(1)}s`;
    }
  }

  // ====================================================================
  // EXTENDED TACTICAL ANIMATIONS
  // ====================================================================
  // All anim spawners attach worldObjects to constructGroup or tacWorldGroup
  // and rely on disposeAnnotation for cleanup. Each returns an annotation
  // pushed onto tacAnnotations.

  // Shared helper: get a representative target point on the construct in
  // local space. Used by several effects.
  function pickConstructLocalPoint() {
    switch (params.construct) {
      case 'fortress': {
        const tiers = Math.max(3, Math.floor(5 * params.structureDensity + 2));
        const i = Math.floor(Math.random() * tiers);
        const w = (12 - i * 1.6) / 2;
        const corner = Math.floor(Math.random() * 4);
        const xs = [-w, w, w, -w], zs = [-w, -w, w, w];
        return new THREE.Vector3(xs[corner], i * 1.8 - 4, zs[corner]);
      }
      case 'pyramid': {
        const tiers = Math.max(4, Math.floor(7 * params.structureDensity + 2));
        const i = Math.floor(Math.random() * tiers);
        const ratio = i / Math.max(1, tiers - 1);
        const w = (12 + (2 - 12) * ratio) / 2;
        const c = Math.floor(Math.random() * 4);
        const xs = [-w, w, w, -w], zs = [-w, -w, w, w];
        return new THREE.Vector3(xs[c], -4 + i * 1.4, zs[c]);
      }
      default: {
        const r = (params.construct === 'lattice' || params.construct === 'hub' || params.construct === 'gridcube') ? 5 : 3.5;
        const theta = Math.random() * Math.PI * 2;
        const phi = (Math.random() - 0.5) * Math.PI * 0.7;
        return new THREE.Vector3(Math.cos(theta) * Math.cos(phi) * r, 2 + Math.sin(phi) * r, Math.sin(theta) * Math.cos(phi) * r);
      }
    }
  }

  // Helper: construct vertical extents and horizontal radius for sweeping effects
  function constructYExtents() {
    switch (params.construct) {
      case 'fortress': {
        const tiers = Math.max(3, Math.floor(5 * params.structureDensity + 2));
        return { yMin: -5, yMax: tiers * 1.8 - 4 + 4.5 };
      }
      case 'lattice': {
        const levels = Math.max(2, Math.floor(4 * params.structureDensity + 1));
        const rMax = 3 + (levels - 1) * 2.5;
        return { yMin: -rMax + 2, yMax: rMax + 2 };
      }
      case 'spire': {
        const segments = Math.max(4, Math.floor(8 * params.structureDensity + 3));
        return { yMin: -4.5, yMax: segments * 2.5 - 2 };
      }
      case 'ringtower': return { yMin: -4, yMax: 16 };
      case 'gridcube': return { yMin: -3, yMax: 7 };
      case 'pyramid': {
        const tiers = Math.max(4, Math.floor(7 * params.structureDensity + 2));
        return { yMin: -4.5, yMax: -4 + tiers * 1.4 + 2.5 };
      }
      case 'hub': return { yMin: -6, yMax: 10 };
      case 'crystal': return { yMin: -4.5, yMax: 10.5 };
      default: return { yMin: -4, yMax: 8 };
    }
  }
  function constructXZRadius() {
    switch (params.construct) {
      case 'fortress': return 7;
      case 'lattice': {
        const levels = Math.max(2, Math.floor(4 * params.structureDensity + 1));
        return (3 + (levels - 1) * 2.5) * 1.1;
      }
      case 'spire': return 5;
      case 'ringtower': return 5;
      case 'gridcube': return 6;
      case 'pyramid': return 7;
      case 'hub': return 7.5;
      case 'crystal': return 5;
      default: return 5;
    }
  }

  // Per-annotation line-material factory, tracked in a local array
  function makeAnimMat(color, weight, opacity, matArray) {
    const m = new LineMaterial({
      color: color,
      linewidth: weight,
      transparent: true,
      opacity: opacity,
      worldUnits: false,
      alphaToCoverage: true
    });
    m.resolution.set(window.innerWidth, window.innerHeight);
    m.userData.baseOpacity = opacity;
    if (matArray) matArray.push(m);
    return m;
  }

  function makeLineSegsFromPositions(positions, mat) {
    const geo = new LineSegmentsGeometry();
    geo.setPositions(positions);
    return new LineSegments2(geo, mat);
  }

  // -------- 1. SCAN SLICE --------
  // A thin horizontal disc passes vertically through the construct.
  // Anchored to constructGroup so it rotates with it.
  function spawnScanSliceAnim(t) {
    if (!constructGroup) return null;
    const life = 3.2 + Math.random() * 2.2;
    const mats = [];
    const { yMin, yMax } = constructYExtents();
    const radius = constructXZRadius() * 1.2;

    const group = new THREE.Group();
    // Build a horizontal circle in XZ plane at y=0 (we'll move it along Y over life)
    const mat = makeAnimMat(AMBER.getHex(), 1.8, 1.0, mats);
    const pts = [];
    const segs = 64;
    for (let i = 0; i < segs; i++) {
      const a1 = (i / segs) * Math.PI * 2;
      const a2 = ((i + 1) / segs) * Math.PI * 2;
      pts.push(Math.cos(a1) * radius, 0, Math.sin(a1) * radius);
      pts.push(Math.cos(a2) * radius, 0, Math.sin(a2) * radius);
    }
    // Add a cross-hair through center
    pts.push(-radius, 0, 0, radius, 0, 0);
    pts.push(0, 0, -radius, 0, 0, radius);
    group.add(makeLineSegsFromPositions(pts, mat));
    // Inner faint ring (smaller circle, fainter material)
    const innerMat = makeAnimMat(AMBER.getHex(), 1.0, 0.6, mats);
    const innerPts = [];
    for (let i = 0; i < 48; i++) {
      const a1 = (i / 48) * Math.PI * 2;
      const a2 = ((i + 1) / 48) * Math.PI * 2;
      innerPts.push(Math.cos(a1) * radius * 0.6, 0, Math.sin(a1) * radius * 0.6);
      innerPts.push(Math.cos(a2) * radius * 0.6, 0, Math.sin(a2) * radius * 0.6);
    }
    group.add(makeLineSegsFromPositions(innerPts, innerMat));

    // Determine direction (up or down)
    const goingUp = Math.random() < 0.5;
    group.position.y = goingUp ? yMin : yMax;
    constructGroup.add(group);

    // Pick a label
    const SLICE_LABELS = ['SCAN PASS', 'CT SLICE', 'LIDAR SWEEP', 'TOMOGRAPHIC', 'SECTION SCAN'];
    const labelText = SLICE_LABELS[Math.floor(Math.random() * SLICE_LABELS.length)];
    const labelEl = makeLabel(labelText, `Y_${(yMin).toFixed(1)}u`, '', life);

    const ann = {
      type: 'scan_slice_anim',
      isAnimEffect: true,
      effectKind: 'scanSlice',
      group, yMin, yMax, goingUp,
      worldObjects: [group],
      worldMats: mats,
      labelEl, labelOffset: null,
      bornT: clock.elapsedTime,
      life,
      expireT: t + life
    };
    tacAnnotations.push(ann);
    return ann;
  }

  // -------- 2. FRAGMENTATION ANALYSIS --------
  // Scatter small bright pips across the construct surface; a single aggregate label.
  function spawnFragmentationAnim(t) {
    if (!constructGroup) return null;
    const life = 2.8 + Math.random() * 2.0;
    const mats = [];
    const pipCount = 12 + Math.floor(Math.random() * 18);

    // Build many small octahedra as pips, all in one geometry for efficiency
    const allPts = [];
    const pipPositions = []; // remember locals for label anchor
    for (let i = 0; i < pipCount; i++) {
      const local = pickConstructLocalPoint();
      pipPositions.push(local.clone());
      const s = 0.18;
      // Cross-shaped pip: 3 short segments
      allPts.push(local.x - s, local.y, local.z, local.x + s, local.y, local.z);
      allPts.push(local.x, local.y - s, local.z, local.x, local.y + s, local.z);
      allPts.push(local.x, local.y, local.z - s, local.x, local.y, local.z + s);
    }
    const mat = makeAnimMat(AMBER.getHex(), 2.5, 1.0, mats);
    const mesh = makeLineSegsFromPositions(allPts, mat);
    constructGroup.add(mesh);

    // Aggregate label hanging near the construct
    const FRAG_LABELS = [
      ['STRUCTURAL ANALYSIS', `${pipCount} NODES`],
      ['ANOMALY SCAN', `${Math.floor(pipCount * 35.7)} SIGS`],
      ['INTEGRITY CHECK', `${(80 + Math.random() * 19).toFixed(1)}%`],
      ['FRAGMENTATION', `${pipCount} POINTS`],
      ['SURFACE MAP', `${pipCount} ANOM`],
      ['SIGNATURE COUNT', `${(pipCount * 7).toString().padStart(3,'0')}_HASH`]
    ];
    const [labelText, subText] = FRAG_LABELS[Math.floor(Math.random() * FRAG_LABELS.length)];
    const labelEl = makeLabel(labelText, subText, '', life);

    // Anchor label projection at construct center
    const anchorLocal = new THREE.Vector3(0, 4, 0);

    const ann = {
      type: 'frag_anim',
      isAnimEffect: true,
      effectKind: 'fragmentation',
      worldObjects: [mesh],
      worldMats: mats,
      labelEl, labelOffset: null,
      labelAnchorLocal: anchorLocal,
      bornT: clock.elapsedTime,
      life,
      expireT: t + life
    };
    tacAnnotations.push(ann);
    return ann;
  }

  // -------- 3. UNWRAP --------
  // Sequentially light up edges of a tier/face perimeter, edge-by-edge.
  function spawnUnwrapAnim(t) {
    if (!constructGroup) return null;
    const life = 4.0 + Math.random() * 2.0;
    const mats = [];

    // Pick a polygonal loop on the construct based on shape
    let loopPoints = []; // array of THREE.Vector3 (local space), closed loop
    if (params.construct === 'fortress') {
      const tiers = Math.max(3, Math.floor(5 * params.structureDensity + 2));
      const i = Math.floor(Math.random() * tiers);
      const w = (12 - i * 1.6) / 2;
      const y = i * 1.8 - 4 + (Math.random() < 0.5 ? -0.7 : 0.7); // top or bottom of tier
      loopPoints = [
        new THREE.Vector3(-w, y, -w),
        new THREE.Vector3(w, y, -w),
        new THREE.Vector3(w, y, w),
        new THREE.Vector3(-w, y, w),
        new THREE.Vector3(-w, y, -w)
      ];
    } else if (params.construct === 'pyramid') {
      const tiers = Math.max(4, Math.floor(7 * params.structureDensity + 2));
      const i = Math.floor(Math.random() * tiers);
      const ratio = i / Math.max(1, tiers - 1);
      const w = (12 + (2 - 12) * ratio) / 2;
      const y = -4 + i * 1.4;
      loopPoints = [
        new THREE.Vector3(-w, y, -w),
        new THREE.Vector3(w, y, -w),
        new THREE.Vector3(w, y, w),
        new THREE.Vector3(-w, y, w),
        new THREE.Vector3(-w, y, -w)
      ];
    } else if (params.construct === 'gridcube') {
      const half = 5;
      const y = 2;
      loopPoints = [
        new THREE.Vector3(-half, y, -half),
        new THREE.Vector3(half, y, -half),
        new THREE.Vector3(half, y, half),
        new THREE.Vector3(-half, y, half),
        new THREE.Vector3(-half, y, -half)
      ];
    } else {
      // Generic — circle perimeter at random Y
      const { yMin, yMax } = constructYExtents();
      const r = constructXZRadius() * 0.95;
      const y = yMin + Math.random() * (yMax - yMin);
      const segs = 12;
      for (let i = 0; i <= segs; i++) {
        const a = (i / segs) * Math.PI * 2;
        loopPoints.push(new THREE.Vector3(Math.cos(a) * r, y, Math.sin(a) * r));
      }
    }

    // Build all edges with one material — opacity will be driven by progress
    const edgeMats = [];
    const edgeMeshes = [];
    for (let i = 0; i < loopPoints.length - 1; i++) {
      const a = loopPoints[i], b = loopPoints[i + 1];
      const m = makeAnimMat(AMBER.getHex(), 2.4, 1.0, mats);
      edgeMats.push(m);
      const mesh = makeLineSegsFromPositions([a.x, a.y, a.z, b.x, b.y, b.z], m);
      constructGroup.add(mesh);
      edgeMeshes.push(mesh);
    }

    const totalLen = loopPoints.reduce((acc, p, i) => {
      if (i === 0) return acc;
      return acc + p.distanceTo(loopPoints[i - 1]);
    }, 0);

    const UNWRAP_LABELS = [
      ['PERIMETER MAP', `${loopPoints.length - 1} EDGES`],
      ['BOUNDARY TRACE', `${totalLen.toFixed(1)}u`],
      ['CONTOUR SCAN', `LOOP_${rand4Hex()}`],
      ['EDGE WALK', `${(loopPoints.length - 1)}_SEG`]
    ];
    const [labelText, subText] = UNWRAP_LABELS[Math.floor(Math.random() * UNWRAP_LABELS.length)];
    const labelEl = makeLabel(labelText, subText, '', life);

    // Anchor label at the midpoint of the loop
    const labelAnchor = new THREE.Vector3();
    loopPoints.slice(0, -1).forEach(p => labelAnchor.add(p));
    labelAnchor.divideScalar(loopPoints.length - 1);

    const ann = {
      type: 'unwrap_anim',
      isAnimEffect: true,
      effectKind: 'unwrap',
      edgeMats,
      worldObjects: edgeMeshes,
      worldMats: mats,
      labelEl, labelOffset: null,
      labelAnchorLocal: labelAnchor,
      bornT: clock.elapsedTime,
      life,
      expireT: t + life
    };
    tacAnnotations.push(ann);
    return ann;
  }

  // -------- 4. VERTEX CONSTELLATION --------
  // Connect 3-5 random vertices of the construct with bright lines; per-vertex tags + aggregate.
  function spawnConstellationAnim(t) {
    if (!constructGroup) return null;
    const life = 3.5 + Math.random() * 3.0;
    const mats = [];
    const n = 3 + Math.floor(Math.random() * 3); // 3..5

    const verts = [];
    for (let i = 0; i < n; i++) verts.push(pickConstructLocalPoint());

    // Build lines between consecutive vertices (closing the polygon)
    const lineMat = makeAnimMat(AMBER.getHex(), 2.0, 1.0, mats);
    const linePts = [];
    for (let i = 0; i < n; i++) {
      const a = verts[i];
      const b = verts[(i + 1) % n];
      linePts.push(a.x, a.y, a.z, b.x, b.y, b.z);
    }
    // Add center-converging spokes too
    const center = new THREE.Vector3();
    verts.forEach(v => center.add(v));
    center.divideScalar(n);
    const spokeMat = makeAnimMat(AMBER.getHex(), 1.0, 0.6, mats);
    const spokePts = [];
    verts.forEach(v => spokePts.push(center.x, center.y, center.z, v.x, v.y, v.z));

    const lineMesh = makeLineSegsFromPositions(linePts, lineMat);
    const spokeMesh = makeLineSegsFromPositions(spokePts, spokeMat);
    constructGroup.add(lineMesh);
    constructGroup.add(spokeMesh);

    // Per-vertex labels — short tags
    const tags = ['COLD', 'HOT', 'CORRUPTED', 'NOMINAL', 'LOCKED', 'STRESS', 'ZERO', 'PEAK'];
    const labelEls = [];
    for (let i = 0; i < n; i++) {
      const tag = tags[Math.floor(Math.random() * tags.length)];
      const el = makeLabel(`V${i + 1}`, tag, '', life);
      labelEls.push({ el, localAnchor: verts[i].clone() });
    }
    // Aggregate center label
    const aggLabels = [
      ['TRIANGULATION', `CONVERGED_${rand4Hex()}`],
      ['CONSTELLATION', `${n}_POINTS`],
      ['PATTERN MATCH', `SIG_${rand4Hex()}`],
      ['GEOMETRIC LOCK', `MESH_${rand4Hex()}`]
    ];
    const [aText, aSub] = aggLabels[Math.floor(Math.random() * aggLabels.length)];
    const aggEl = makeLabel(aText, aSub, '', life);

    const ann = {
      type: 'constellation_anim',
      isAnimEffect: true,
      effectKind: 'constellation',
      worldObjects: [lineMesh, spokeMesh],
      worldMats: mats,
      labelEl: aggEl, // primary label uses standard label-tracking path
      labelOffset: null,
      labelAnchorLocal: center,
      // Additional per-vertex labels — tracked manually in updateAnimEffect
      extraLabels: labelEls,
      bornT: clock.elapsedTime,
      life,
      expireT: t + life
    };
    tacAnnotations.push(ann);
    return ann;
  }

  // -------- 5. DEFENSIVE COUNTERMEASURE --------
  // Outbound attack vector: frames originate at construct point, pierce OUTWARD into space.
  function spawnCountermeasureAnim(t) {
    if (!constructGroup) return null;
    // Build using existing attack-vector machinery but reversed.
    // For simplicity, we'll just construct a fresh chain inline.
    const life = (params.attackVectorMinLife + params.attackVectorMaxLife) / 2 * 0.85;
    const mats = [];

    const localStart = pickConstructLocalPoint();
    constructGroup.updateMatrixWorld();
    const startWorld = localStart.clone().applyMatrix4(constructGroup.matrixWorld);
    // End point goes OUTWARD from construct center
    const center = new THREE.Vector3(0, 2, 0).applyMatrix4(constructGroup.matrixWorld);
    const outward = startWorld.clone().sub(center).normalize();
    outward.x += (Math.random() - 0.5) * 0.4;
    outward.y += 0.2 + Math.random() * 0.3;
    outward.z += (Math.random() - 0.5) * 0.4;
    outward.normalize();
    const endDistance = 18 + Math.random() * 12;
    const endWorld = startWorld.clone().add(outward.multiplyScalar(endDistance));

    const frameCount = params.attackVectorMinFrames + Math.floor(Math.random() * (params.attackVectorMaxFrames - params.attackVectorMinFrames + 1));
    const frames = [];

    for (let i = 0; i < frameCount; i++) {
      const linearU = (i + 1) / (frameCount + 1);
      // Outbound: small size near construct, larger near end (opposite of attack)
      const u = linearU;
      const size = 0.5 + 2.0 * u;
      const pos = startWorld.clone().lerp(endWorld, u);
      const tangent = endWorld.clone().sub(startWorld).normalize();

      const up = new THREE.Vector3(0, 1, 0);
      const right = new THREE.Vector3().crossVectors(tangent, up);
      if (right.lengthSq() < 0.01) right.set(1, 0, 0);
      right.normalize();
      const frameUp = new THREE.Vector3().crossVectors(right, tangent).normalize();
      const half = size / 2;
      const corners = [
        pos.clone().addScaledVector(right, -half).addScaledVector(frameUp, -half),
        pos.clone().addScaledVector(right, half).addScaledVector(frameUp, -half),
        pos.clone().addScaledVector(right, half).addScaledVector(frameUp, half),
        pos.clone().addScaledVector(right, -half).addScaledVector(frameUp, half)
      ];
      const positions = [];
      for (let c = 0; c < 4; c++) {
        const a = corners[c], b = corners[(c + 1) % 4];
        positions.push(a.x, a.y, a.z, b.x, b.y, b.z);
      }

      const isTerminal = i === frameCount - 1;
      const mat = makeAnimMat(AMBER.getHex(), isTerminal ? 2.2 : 1.4, isTerminal ? 1.0 : 0.85, mats);
      const mesh = makeLineSegsFromPositions(positions, mat);
      tacWorldGroup.add(mesh);
      frames.push({ mesh, mat, isTerminal });
    }

    const COUNTER_LABELS = ['COUNTERMEASURE', 'DEFENSIVE FIRE', 'ICE LAUNCH', 'EJECTION', 'INTERDICT', 'COUNTER-LAUNCH'];
    const label = COUNTER_LABELS[Math.floor(Math.random() * COUNTER_LABELS.length)];
    const labelEl = makeLabel(label, `OUTBOUND_${rand4Hex()}`, '', life);

    const ann = {
      type: 'countermeasure_anim',
      isAnimEffect: true,
      effectKind: 'countermeasure',
      frames,
      worldObjects: frames.map(f => f.mesh),
      worldMats: mats,
      labelEl, labelOffset: null,
      labelAnchorWorld: endWorld, // free-world space
      isFreeWorldLabel: true,
      bornT: clock.elapsedTime,
      life,
      expireT: t + life
    };
    tacAnnotations.push(ann);
    return ann;
  }

  // -------- 6. CROSSFIRE --------
  // Two attack vectors fire near-simultaneously toward the same target.
  function spawnCrossfireAnim(t) {
    if (!constructGroup) return null;
    // Spawn one immediately
    const a = spawnAttackVector(t);
    // Schedule second one shortly after, biased to fire from opposite side
    setTimeout(() => {
      if (!params.tacticalEnabled) return;
      spawnAttackVector(clock.elapsedTime);
    }, 200 + Math.random() * 300);
    return a;
  }

  // -------- 7. ESCAPE VECTOR --------
  // Like attack vector but starts ON construct, travels OUTWARD on a curved path,
  // with terminal frame in open space pulsing as "exit point."
  function spawnEscapeAnim(t) {
    if (!constructGroup) return null;
    const life = (params.attackVectorMinLife + params.attackVectorMaxLife) / 2;
    const mats = [];

    const localStart = pickConstructLocalPoint();
    constructGroup.updateMatrixWorld();
    const startWorld = localStart.clone().applyMatrix4(constructGroup.matrixWorld);
    const center = new THREE.Vector3(0, 2, 0).applyMatrix4(constructGroup.matrixWorld);
    const outward = startWorld.clone().sub(center).normalize();
    outward.y += 0.5 + Math.random() * 0.6; // strong upward bias
    outward.normalize();
    const endDistance = 22 + Math.random() * 15;
    const endWorld = startWorld.clone().add(outward.multiplyScalar(endDistance));

    // Curve control point
    const approachDir = endWorld.clone().sub(startWorld).normalize();
    const up = new THREE.Vector3(0, 1, 0);
    const side = new THREE.Vector3().crossVectors(approachDir, up).normalize();
    if (side.lengthSq() < 0.01) side.set(1, 0, 0);
    const sign = Math.random() < 0.5 ? -1 : 1;
    const offsetMag = 4 + Math.random() * 6;
    const midOffset = side.multiplyScalar(sign * offsetMag);
    const mid = startWorld.clone().lerp(endWorld, 0.5).add(midOffset);

    function bezPoint(u) {
      const a = 1 - u;
      return new THREE.Vector3(
        a*a*startWorld.x + 2*a*u*mid.x + u*u*endWorld.x,
        a*a*startWorld.y + 2*a*u*mid.y + u*u*endWorld.y,
        a*a*startWorld.z + 2*a*u*mid.z + u*u*endWorld.z
      );
    }
    function bezTangent(u) {
      const a = 1 - u;
      return new THREE.Vector3(
        2*a*(mid.x - startWorld.x) + 2*u*(endWorld.x - mid.x),
        2*a*(mid.y - startWorld.y) + 2*u*(endWorld.y - mid.y),
        2*a*(mid.z - startWorld.z) + 2*u*(endWorld.z - mid.z)
      ).normalize();
    }

    const frameCount = 5 + Math.floor(Math.random() * 6);
    const frames = [];
    for (let i = 0; i < frameCount; i++) {
      const u = Math.pow((i + 1) / (frameCount + 1), 0.9);
      const pos = bezPoint(u);
      const tangent = bezTangent(u);
      const size = 0.4 + 1.6 * u; // grows outward
      const upV = new THREE.Vector3(0, 1, 0);
      const right = new THREE.Vector3().crossVectors(tangent, upV);
      if (right.lengthSq() < 0.01) right.set(1, 0, 0);
      right.normalize();
      const frameUp = new THREE.Vector3().crossVectors(right, tangent).normalize();
      const half = size / 2;
      const corners = [
        pos.clone().addScaledVector(right, -half).addScaledVector(frameUp, -half),
        pos.clone().addScaledVector(right, half).addScaledVector(frameUp, -half),
        pos.clone().addScaledVector(right, half).addScaledVector(frameUp, half),
        pos.clone().addScaledVector(right, -half).addScaledVector(frameUp, half)
      ];
      const positions = [];
      for (let c = 0; c < 4; c++) {
        const aa = corners[c], bb = corners[(c + 1) % 4];
        positions.push(aa.x, aa.y, aa.z, bb.x, bb.y, bb.z);
      }
      const isTerminal = i === frameCount - 1;
      // Use a phosphor-tinted material for escape (vs amber for attack — distinct)
      const mat = makeAnimMat(PHOSPHOR.getHex(), isTerminal ? 2.4 : 1.4, isTerminal ? 1.0 : 0.85, mats);
      const mesh = makeLineSegsFromPositions(positions, mat);
      tacWorldGroup.add(mesh);
      frames.push({ mesh, mat, pos, isTerminal });
    }

    const ESCAPE_LABELS = ['EXTRACTION', 'EVAC ROUTE', 'ESCAPE VECTOR', 'GHOST EXIT', 'BAILOUT', 'EJECT PATH'];
    const label = ESCAPE_LABELS[Math.floor(Math.random() * ESCAPE_LABELS.length)];
    const labelEl = makeLabel(label, `EXFIL_${rand4Hex()}`, 'phos', life);

    const ann = {
      type: 'escape_anim',
      isAnimEffect: true,
      effectKind: 'escapeVector',
      frames,
      worldObjects: frames.map(f => f.mesh),
      worldMats: mats,
      labelEl, labelOffset: null,
      labelAnchorWorld: endWorld,
      isFreeWorldLabel: true,
      bornT: clock.elapsedTime,
      life,
      expireT: t + life
    };
    tacAnnotations.push(ann);
    return ann;
  }

  // -------- 8. SCAN BEAM --------
  // A single thin long rectangle that sweeps along an axis.
  function spawnScanBeamAnim(t) {
    if (!constructGroup) return null;
    const life = 2.4 + Math.random() * 1.6;
    const mats = [];
    const { yMin, yMax } = constructYExtents();
    const r = constructXZRadius();

    // Beam is a thin horizontal rectangle spanning across the construct's footprint,
    // sweeps along Y from yMin to yMax (or reverse)
    const beamLength = r * 2.6;
    const beamThickness = 0.18;
    const goingUp = Math.random() < 0.5;
    const startY = goingUp ? yMin : yMax;

    const group = new THREE.Group();
    const mat = makeAnimMat(AMBER.getHex(), 2.4, 1.0, mats);
    // Build a rectangle in XZ-plane
    const halfL = beamLength / 2;
    const halfT = beamThickness / 2;
    const pts = [
      -halfL, 0, -halfT,  halfL, 0, -halfT,
      halfL, 0, -halfT,   halfL, 0,  halfT,
      halfL, 0,  halfT,  -halfL, 0,  halfT,
      -halfL, 0,  halfT, -halfL, 0, -halfT,
      // Cross-line through center
      -halfL, 0, 0, halfL, 0, 0
    ];
    group.add(makeLineSegsFromPositions(pts, mat));
    group.position.y = startY;
    constructGroup.add(group);

    const BEAM_LABELS = ['LIDAR BEAM', 'SCAN BEAM', 'LASER SWEEP', 'OPTICAL PASS', 'PHASE SCAN'];
    const label = BEAM_LABELS[Math.floor(Math.random() * BEAM_LABELS.length)];
    const labelEl = makeLabel(label, `λ_${Math.floor(400 + Math.random()*200)}nm`, '', life);

    const ann = {
      type: 'scan_beam_anim',
      isAnimEffect: true,
      effectKind: 'scanBeam',
      group, yMin, yMax, goingUp,
      worldObjects: [group],
      worldMats: mats,
      labelEl, labelOffset: null,
      labelAnchorLocal: new THREE.Vector3(r, 0, 0),
      bornT: clock.elapsedTime,
      life,
      expireT: t + life
    };
    tacAnnotations.push(ann);
    return ann;
  }

  // -------- 9. GRID SCAN OVERLAY --------
  // A 2D grid of small rectangle markers on the construct's "front face" projection,
  // pulsing in a wave pattern. Implemented as 3D mini-rects on a plane.
  function spawnGridScanAnim(t) {
    if (!constructGroup) return null;
    const life = 3.0 + Math.random() * 2.0;
    const mats = [];

    // Pick a side of the construct
    const r = constructXZRadius() * 0.9;
    const { yMin, yMax } = constructYExtents();
    const ySpan = yMax - yMin;

    const cols = 6 + Math.floor(Math.random() * 5);
    const rows = 6 + Math.floor(Math.random() * 5);
    const cellW = (r * 1.5) / cols;
    const cellH = (ySpan * 0.7) / rows;
    const yC = (yMin + yMax) / 2;
    const xC = 0;
    const zFace = r * 1.05; // in front of construct

    // Pick face direction
    const facing = Math.floor(Math.random() * 4); // 0=+Z, 1=-Z, 2=+X, 3=-X
    const cells = []; // each: { mesh, mat, baseOpacity, gridX, gridY }
    for (let gy = 0; gy < rows; gy++) {
      for (let gx = 0; gx < cols; gx++) {
        const xOff = (gx - (cols - 1) / 2) * cellW;
        const yOff = (gy - (rows - 1) / 2) * cellH;
        let cx, cy, cz;
        if (facing === 0) { cx = xC + xOff; cy = yC + yOff; cz = zFace; }
        else if (facing === 1) { cx = xC + xOff; cy = yC + yOff; cz = -zFace; }
        else if (facing === 2) { cx = zFace; cy = yC + yOff; cz = xC + xOff; }
        else { cx = -zFace; cy = yC + yOff; cz = xC + xOff; }

        const w = cellW * 0.6, h = cellH * 0.6;
        const hw = w / 2, hh = h / 2;
        // Build small rect on appropriate plane
        let pts;
        if (facing < 2) {
          pts = [
            cx - hw, cy - hh, cz,  cx + hw, cy - hh, cz,
            cx + hw, cy - hh, cz,  cx + hw, cy + hh, cz,
            cx + hw, cy + hh, cz,  cx - hw, cy + hh, cz,
            cx - hw, cy + hh, cz,  cx - hw, cy - hh, cz
          ];
        } else {
          pts = [
            cx, cy - hh, cz - hw,  cx, cy - hh, cz + hw,
            cx, cy - hh, cz + hw,  cx, cy + hh, cz + hw,
            cx, cy + hh, cz + hw,  cx, cy + hh, cz - hw,
            cx, cy + hh, cz - hw,  cx, cy - hh, cz - hw
          ];
        }
        const mat = makeAnimMat(AMBER.getHex(), 1.4, 0.7, mats);
        const mesh = makeLineSegsFromPositions(pts, mat);
        constructGroup.add(mesh);
        cells.push({ mesh, mat, gridX: gx, gridY: gy });
      }
    }

    const GRID_LABELS = [
      ['SURFACE SCAN', `${cols}x${rows}_CELLS`],
      ['HEAT MAP', `${cols * rows}_PROBES`],
      ['DENSITY SCAN', `RES_${cols * rows}`],
      ['EM SIGNATURE', `${cols}x${rows}_GRID`]
    ];
    const [labelText, subText] = GRID_LABELS[Math.floor(Math.random() * GRID_LABELS.length)];
    const labelEl = makeLabel(labelText, subText, '', life);

    const ann = {
      type: 'grid_scan_anim',
      isAnimEffect: true,
      effectKind: 'gridScan',
      cells, cols, rows,
      worldObjects: cells.map(c => c.mesh),
      worldMats: mats,
      labelEl, labelOffset: null,
      labelAnchorLocal: new THREE.Vector3(0, yC, 0),
      bornT: clock.elapsedTime,
      life,
      expireT: t + life
    };
    tacAnnotations.push(ann);
    return ann;
  }

  // -------- 10. NETWORK TRACE --------
  // Snaking branching lines from one vertex, like roots, each end-tipped with a label.
  function spawnNetworkTraceAnim(t) {
    if (!constructGroup) return null;
    const life = 4.0 + Math.random() * 3.0;
    const mats = [];

    // Start point
    const root = pickConstructLocalPoint();
    // Build a random tree of branches in local space
    const branches = [root.clone()]; // each is endpoint of a branch
    const segments = []; // pairs of [a, b]
    const maxBranches = 6 + Math.floor(Math.random() * 6);
    while (branches.length < maxBranches) {
      // Pick a random existing branch tip and extend
      const src = branches[Math.floor(Math.random() * branches.length)];
      const dir = new THREE.Vector3(
        (Math.random() - 0.5),
        (Math.random() - 0.5),
        (Math.random() - 0.5)
      ).normalize();
      const len = 0.6 + Math.random() * 2.5;
      const tip = src.clone().addScaledVector(dir, len);
      segments.push([src.clone(), tip.clone()]);
      branches.push(tip);
    }
    const allPts = [];
    segments.forEach(([a, b]) => allPts.push(a.x, a.y, a.z, b.x, b.y, b.z));
    const mat = makeAnimMat(AMBER.getHex(), 1.8, 1.0, mats);
    const mesh = makeLineSegsFromPositions(allPts, mat);
    constructGroup.add(mesh);

    // Add a few small terminal pip labels (3-4 of the tips get tagged)
    const tagCount = Math.min(4, branches.length);
    const extraLabels = [];
    const tagPool = ['LEAF', 'NODE', 'TERM', 'EDGE', 'STUB', 'BRANCH'];
    for (let i = 0; i < tagCount; i++) {
      const tipIdx = Math.floor(Math.random() * branches.length);
      const tip = branches[tipIdx];
      const tag = tagPool[Math.floor(Math.random() * tagPool.length)];
      const el = makeLabel(tag, rand4Hex(), '', life);
      extraLabels.push({ el, localAnchor: tip.clone() });
    }

    const TRACE_LABELS = [
      ['NETWORK TRACE', `${segments.length}_HOPS`],
      ['ROUTING MAP', `BFS_${rand4Hex()}`],
      ['TOPOLOGY SCAN', `DEG_${segments.length}`],
      ['DEPENDENCY MAP', `EDGES_${segments.length}`]
    ];
    const [aText, aSub] = TRACE_LABELS[Math.floor(Math.random() * TRACE_LABELS.length)];
    const labelEl = makeLabel(aText, aSub, '', life);

    const ann = {
      type: 'network_trace_anim',
      isAnimEffect: true,
      effectKind: 'networkTrace',
      worldObjects: [mesh],
      worldMats: mats,
      labelEl, labelOffset: null,
      labelAnchorLocal: root.clone(),
      extraLabels,
      bornT: clock.elapsedTime,
      life,
      expireT: t + life
    };
    tacAnnotations.push(ann);
    return ann;
  }

  // -------- 11. ORBIT LOCK --------
  // Long-lived: a big circle around the construct (XZ plane in world space)
  // with a few dots orbiting on it.
  function spawnOrbitLockAnim(t) {
    if (!constructGroup) return null;
    const life = 20 + Math.random() * 30; // long
    const mats = [];

    const radius = constructXZRadius() * 1.4;
    const yC = 2;

    // Outer ring in XZ plane (local to construct)
    const ringMat = makeAnimMat(AMBER.getHex(), 1.4, 0.7, mats);
    const ringPts = [];
    const segs = 96;
    for (let i = 0; i < segs; i++) {
      const a1 = (i / segs) * Math.PI * 2;
      const a2 = ((i + 1) / segs) * Math.PI * 2;
      ringPts.push(Math.cos(a1) * radius, yC, Math.sin(a1) * radius);
      ringPts.push(Math.cos(a2) * radius, yC, Math.sin(a2) * radius);
    }
    const ringMesh = makeLineSegsFromPositions(ringPts, ringMat);
    constructGroup.add(ringMesh);

    // Orbiting "dots" — small + signs, positions updated each frame
    const dotCount = 3 + Math.floor(Math.random() * 3);
    const dots = [];
    for (let i = 0; i < dotCount; i++) {
      const phase = (i / dotCount) * Math.PI * 2 + Math.random() * 0.5;
      const speed = 0.3 + Math.random() * 0.4;
      const dotMat = makeAnimMat(AMBER.getHex(), 2.5, 1.0, mats);
      // Placeholder geometry — we'll update each frame
      const dotPts = [0, 0, 0, 0.01, 0, 0]; // will be replaced
      const mesh = makeLineSegsFromPositions(dotPts, dotMat);
      constructGroup.add(mesh);
      dots.push({ mesh, mat: dotMat, phase, speed });
    }

    const ORBIT_LABELS = [
      ['SURVEILLANCE', `ORBIT_${rand4Hex()}`],
      ['OBSERVATION', `CONTINUOUS`],
      ['LONG WATCH', `T+${Math.floor(Math.random()*9999)}`],
      ['PATROL LOCK', `RING_${rand4Hex()}`]
    ];
    const [aText, aSub] = ORBIT_LABELS[Math.floor(Math.random() * ORBIT_LABELS.length)];
    const labelEl = makeLabel(aText, aSub, '', life);

    const ann = {
      type: 'orbit_lock_anim',
      isAnimEffect: true,
      effectKind: 'orbitLock',
      ringMesh, dots, ringRadius: radius, yC,
      worldObjects: [ringMesh, ...dots.map(d => d.mesh)],
      worldMats: mats,
      labelEl, labelOffset: null,
      labelAnchorLocal: new THREE.Vector3(radius * 0.7, yC, radius * 0.7),
      bornT: clock.elapsedTime,
      life,
      expireT: t + life
    };
    tacAnnotations.push(ann);
    return ann;
  }

  // -------- 12. HOSTILE SIGNATURE --------
  // Jagged red angular bracket — 6-8 sides, pulses red.
  function spawnHostileSignatureAnim(t) {
    if (!constructGroup) return null;
    const life = 2.5 + Math.random() * 2.0;
    const mats = [];

    const sides = 6 + Math.floor(Math.random() * 3);
    const baseRadius = constructXZRadius() * 1.5;
    const yC = 2;

    // Build a closed polygon with irregular radii — in XY plane (faces +Z by default)
    const pts = [];
    const vertices = [];
    for (let i = 0; i < sides; i++) {
      const a = (i / sides) * Math.PI * 2;
      const r = baseRadius * (0.85 + Math.random() * 0.3);
      vertices.push(new THREE.Vector3(Math.cos(a) * r, yC + Math.sin(a) * r * 0.8, 0));
    }
    for (let i = 0; i < sides; i++) {
      const a = vertices[i], b = vertices[(i + 1) % sides];
      pts.push(a.x, a.y, a.z, b.x, b.y, b.z);
    }
    // Use palette red
    const RED_HEX = parseInt(activePalette.red.replace('#', ''), 16);
    const mat = makeAnimMat(RED_HEX, 2.6, 1.0, mats);
    const mesh = makeLineSegsFromPositions(pts, mat);
    constructGroup.add(mesh);

    // Small inner cross-hairs at each vertex
    const tickMat = makeAnimMat(RED_HEX, 1.8, 0.9, mats);
    const tickPts = [];
    vertices.forEach(v => {
      const s = 0.3;
      tickPts.push(v.x - s, v.y, v.z, v.x + s, v.y, v.z);
      tickPts.push(v.x, v.y - s, v.z, v.x, v.y + s, v.z);
    });
    constructGroup.add(makeLineSegsFromPositions(tickPts, tickMat));

    const HOSTILE_LABELS = [
      ['HOSTILE', `THREAT_${rand4Hex()}`],
      ['LETHAL ICE', `KUANG_${rand4Hex()}`],
      ['BLACK ICE', `DANGER_${rand4Hex()}`],
      ['ENEMY SIGNATURE', `SIG_${rand4Hex()}`],
      ['THREAT LEVEL 5', `T5_${rand4Hex()}`]
    ];
    const [aText, aSub] = HOSTILE_LABELS[Math.floor(Math.random() * HOSTILE_LABELS.length)];
    const labelEl = makeLabel(aText, aSub, 'red', life);

    const ann = {
      type: 'hostile_sig_anim',
      isAnimEffect: true,
      effectKind: 'hostileSignature',
      worldObjects: [mesh],
      worldMats: mats,
      labelEl, labelOffset: null,
      labelAnchorLocal: new THREE.Vector3(0, yC, 0),
      bornT: clock.elapsedTime,
      life,
      expireT: t + life
    };
    tacAnnotations.push(ann);
    return ann;
  }

  // === Updater for all animation effects (label tracking + per-effect logic) ===
  function updateAnimEffect(ann, t) {
    const age = t - ann.bornT;
    const remaining = ann.expireT - t;
    const lifeP = age / ann.life; // 0..1

    // Universal opacity envelope — fade in 15%, fade out 25%
    const inP = Math.min(1, age / Math.min(0.5, ann.life * 0.15));
    const outP = Math.min(1, remaining / Math.min(0.7, ann.life * 0.25));
    const envOp = inP * outP;

    // Per-effect logic
    switch (ann.effectKind) {
      case 'scanSlice':
      case 'scanBeam': {
        // Move the group's Y from yMin to yMax (or reverse) over life
        const p = Math.min(1, lifeP);
        const eased = 1 - Math.pow(1 - p, 2);
        const y = ann.goingUp ? ann.yMin + eased * (ann.yMax - ann.yMin) : ann.yMax - eased * (ann.yMax - ann.yMin);
        ann.group.position.y = y;
        ann.worldMats.forEach(m => m.opacity = (m.userData.baseOpacity || 1) * envOp);
        // Update label sub to show Y position
        const sub = ann.labelEl.querySelector('.sub');
        if (sub) {
          if (!ann.subBase) ann.subBase = sub.textContent;
          sub.textContent = `${ann.subBase} · Y_${y.toFixed(1)}u`;
        }
        break;
      }
      case 'fragmentation': {
        // Pips all visible from start; fade together at end
        ann.worldMats.forEach(m => m.opacity = (m.userData.baseOpacity || 1) * envOp);
        break;
      }
      case 'unwrap': {
        // Light up edges sequentially over first 60% of life, then hold, then fade
        const sequenceP = Math.min(1, lifeP / 0.6);
        const totalEdges = ann.edgeMats.length;
        const lit = sequenceP * totalEdges;
        ann.edgeMats.forEach((m, i) => {
          const dist = lit - i;
          let edgeOp;
          if (dist <= 0) edgeOp = 0;
          else if (dist < 1) edgeOp = dist;
          else edgeOp = 1;
          m.opacity = m.userData.baseOpacity * edgeOp * envOp;
        });
        break;
      }
      case 'constellation': {
        ann.worldMats.forEach(m => m.opacity = (m.userData.baseOpacity || 1) * envOp);
        break;
      }
      case 'countermeasure': {
        // Outbound — light up from construct outward
        const seqP = Math.min(1, lifeP / 0.3);
        const lit = Math.pow(seqP, 0.6) * ann.frames.length;
        ann.frames.forEach((f, i) => {
          const dist = lit - i;
          let op;
          if (dist <= 0) op = 0;
          else if (dist < 1) op = dist;
          else op = 1;
          // Terminal pulse
          if (f.isTerminal && lit >= ann.frames.length) {
            op = 0.6 + 0.4 * (0.5 + 0.5 * Math.sin((age - ann.life * 0.3) * 6));
          }
          f.mat.opacity = (f.mat.userData.baseOpacity || 0.85) * op * envOp;
        });
        break;
      }
      case 'escapeVector': {
        // Same as countermeasure but pulse is phosphor-colored (mat already set)
        const seqP = Math.min(1, lifeP / 0.3);
        const lit = Math.pow(seqP, 0.6) * ann.frames.length;
        ann.frames.forEach((f, i) => {
          const dist = lit - i;
          let op;
          if (dist <= 0) op = 0;
          else if (dist < 1) op = dist;
          else op = 1;
          if (f.isTerminal && lit >= ann.frames.length) {
            op = 0.6 + 0.4 * (0.5 + 0.5 * Math.sin((age - ann.life * 0.3) * 4));
          }
          f.mat.opacity = (f.mat.userData.baseOpacity || 0.85) * op * envOp;
        });
        break;
      }
      case 'gridScan': {
        // Wave pulse across the grid
        const waveSpeed = 0.6;
        const wavePhase = age * waveSpeed;
        ann.cells.forEach(c => {
          // Wave moves left to right
          const x = c.gridX / Math.max(1, ann.cols - 1);
          const localPhase = wavePhase - x * 4;
          const pulse = Math.max(0, Math.sin(localPhase));
          const base = c.mat.userData.baseOpacity || 0.7;
          c.mat.opacity = (base * 0.4 + pulse * 0.6) * envOp;
        });
        break;
      }
      case 'networkTrace': {
        ann.worldMats.forEach(m => m.opacity = (m.userData.baseOpacity || 1) * envOp);
        break;
      }
      case 'orbitLock': {
        // Update dot positions on the orbit ring
        const yC = ann.yC;
        const r = ann.ringRadius;
        ann.dots.forEach(d => {
          const a = d.phase + age * d.speed;
          // Rebuild dot geometry as a small + cross at this position
          if (d.mesh.geometry) d.mesh.geometry.dispose();
          const x = Math.cos(a) * r;
          const z = Math.sin(a) * r;
          const s = 0.25;
          const pts = [
            x - s, yC, z, x + s, yC, z,
            x, yC - s, z, x, yC + s, z,
            x, yC, z - s, x, yC, z + s
          ];
          const newGeo = new LineSegmentsGeometry();
          newGeo.setPositions(pts);
          d.mesh.geometry = newGeo;
        });
        ann.worldMats.forEach(m => m.opacity = (m.userData.baseOpacity || 1) * envOp);
        break;
      }
      case 'hostileSignature': {
        // Pulse opacity at ~3 Hz
        const pulse = 0.55 + 0.45 * Math.abs(Math.sin(age * Math.PI * 3));
        ann.worldMats.forEach(m => m.opacity = (m.userData.baseOpacity || 1) * pulse * envOp);
        break;
      }
    }

    // Update label position
    let worldAnchor;
    if (ann.isFreeWorldLabel) {
      worldAnchor = ann.labelAnchorWorld;
    } else if (ann.labelAnchorLocal) {
      constructGroup.updateMatrixWorld();
      worldAnchor = ann.labelAnchorLocal.clone().applyMatrix4(constructGroup.matrixWorld);
    }

    if (worldAnchor) {
      const proj = project3DToScreen(worldAnchor);
      if (!proj.onScreen) {
        ann.labelEl.style.display = 'none';
      } else {
        ann.labelEl.style.display = '';
        ann.labelEl.style.opacity = envOp;
        if (!ann.labelOffset) {
          const w = window.innerWidth, h = window.innerHeight;
          const dx = proj.x - w / 2, dy = proj.y - h / 2;
          const ang = Math.atan2(dy, dx);
          const variation = (Math.random() - 0.5) * 0.5;
          ann.labelOffset = { dx: Math.cos(ang + variation) * 90, dy: Math.sin(ang + variation) * 70 };
        }
        ann.labelEl.style.left = (proj.x + ann.labelOffset.dx) + 'px';
        ann.labelEl.style.top = (proj.y + ann.labelOffset.dy) + 'px';
      }
    }

    // Update extra (per-feature) labels if any
    if (ann.extraLabels) {
      ann.extraLabels.forEach(extra => {
        if (!extra.el.isConnected) tacLayer.appendChild(extra.el);
        constructGroup.updateMatrixWorld();
        const w = extra.localAnchor.clone().applyMatrix4(constructGroup.matrixWorld);
        const p = project3DToScreen(w);
        if (!p.onScreen) {
          extra.el.style.display = 'none';
        } else {
          extra.el.style.display = '';
          extra.el.style.opacity = envOp;
          if (!extra.offset) {
            const dxc = p.x - window.innerWidth / 2, dyc = p.y - window.innerHeight / 2;
            const ang = Math.atan2(dyc, dxc);
            extra.offset = { dx: Math.cos(ang) * 50, dy: Math.sin(ang) * 50 };
          }
          extra.el.style.left = (p.x + extra.offset.dx) + 'px';
          extra.el.style.top = (p.y + extra.offset.dy) + 'px';
        }
      });
    }
  }

  // Master picker — fires a random animation event from weighted pool
  function fireAnimationEvent(t) {
    const kind = pickWeighted(params.tacticalAnimWeights, null);
    if (!kind) return null;
    switch (kind) {
      case 'scanSlice': return spawnScanSliceAnim(t);
      case 'fragmentation': return spawnFragmentationAnim(t);
      case 'unwrap': return spawnUnwrapAnim(t);
      case 'constellation': return spawnConstellationAnim(t);
      case 'countermeasure': return spawnCountermeasureAnim(t);
      case 'crossfire': return spawnCrossfireAnim(t);
      case 'escapeVector': return spawnEscapeAnim(t);
      case 'scanBeam': return spawnScanBeamAnim(t);
      case 'gridScan': return spawnGridScanAnim(t);
      case 'networkTrace': return spawnNetworkTraceAnim(t);
      case 'orbitLock': return spawnOrbitLockAnim(t);
      case 'hostileSignature': return spawnHostileSignatureAnim(t);
    }
    return null;
  }

  // ====================================================================
  // GEOGRAPHIC / TERRAIN LABELS
  // ====================================================================
  // A slow ambient background layer of static strategic/geographic markers
  // anchored to construct geometry. Long lifespans, typewriter character reveal,
  // three-line content (primary + sub + tertiary), low base opacity. Reads as
  // terrain — sectors, quadrants, restricted zones — under the tactical noise.

  // Label content generators

    () => `GRID_${'ABCDEFGHJKLMN'[Math.floor(Math.random()*13)]}-${Math.floor(Math.random()*9)+1}${Math.floor(Math.random()*9)+1}`,

  const TERRAIN_SUB_TEMPLATES = [

    () => `GRID ${'ABCDEFGH'[Math.floor(Math.random()*8)]}${Math.floor(Math.random()*99).toString().padStart(2,'0')}-${Math.floor(Math.random()*99).toString().padStart(2,'0')}`,
    () => `ELEV ${(Math.random()*8848 - 400).toFixed(0)}m · BRG ${Math.floor(Math.random()*360)}°`,

    () => `BLOCK ${Math.floor(Math.random()*99)}/${Math.floor(Math.random()*99)}/${Math.floor(Math.random()*99)}`
  ];
  const TERRAIN_STATUS_TEMPLATES = [
    () => `STATUS · NOMINAL`,
    () => `STATUS · CONTESTED`,
    () => `STATUS · DARK`,
    () => `STATUS · STABLE`,
    () => `STATUS · DEGRADED`,
