    onChange: v => { params.scanlineScope = v; applyScanlineScope(); }
  });
  makeSlider(crtGroup, { label: 'bloom', min: 0, max: 2, step: 0.01, value: params.bloomStrength, onChange: v => { params.bloomStrength = v; postMat.uniforms.uBloom.value = v; }});
  makeSlider(crtGroup, { label: 'curvature', min: 0, max: 1, step: 0.01, value: params.curvature, onChange: v => { params.curvature = v; postMat.uniforms.uCurvature.value = v; }});

  // Apply initial scanline scope now that postMat + overlay exist
  applyScanlineScope();

  const bleedGroup = makeControlSection(controlsEl, 'wetware');
  makeSlider(bleedGroup, { label: 'bleed freq /min', min: 0, max: 4, step: 0.05, value: params.bleedFrequency, onChange: v => params.bleedFrequency = v });
  makeSlider(bleedGroup, { label: 'bleed strength', min: 0, max: 1, step: 0.01, value: params.bleedIntensity, onChange: v => params.bleedIntensity = v });
  makeSlider(bleedGroup, { label: 'bleed displacement', min: 0, max: 1, step: 0.01, value: params.bleedDisplacement, onChange: v => {
    params.bleedDisplacement = v;
    postMat.uniforms.uBleedDisplace.value = v;
  }});

  // --- Animation loop ---
  const clock = new THREE.Clock();
  let alive = true;
  let jackedSec = 0;
  let signalLevel = 0.92;
  let iceLevel = 0.4;
  let latency = 32;

  function update() {
    if (!alive) return;
    requestAnimationFrame(update);
    const dt = clock.getDelta();
    const t = clock.elapsedTime;

    if (!paused) {
      jackedSec += dt;

      // Construct rotation
      if (constructGroup) constructGroup.rotation.y += params.rotationSpeed * 0.2 * dt;

      // Grid drift — scales with approach speed when motion is on, else slow constant drift
      const gridDriftSpeed = params.approachMotion ? (2 + params.approachSpeed * 14) : 2;
      if (gridGroup) gridGroup.position.z = (gridGroup.position.z + dt * gridDriftSpeed) % 5;

      // Approach motion: horizon buildings drift toward camera, recycle when they pass it
      if (params.approachMotion) {
        const approachDelta = dt * params.approachSpeed * 18;
        horizonGroup.children.forEach(child => {
          child.userData.approachZ -= approachDelta;
          if (child.userData.approachZ < APPROACH_NEAR) {
            child.userData.approachZ += (APPROACH_FAR - APPROACH_NEAR);
            // Re-randomize lateral on recycle for variety
            child.userData.approachX = (Math.random() - 0.5) * 80;
          }
          child.position.set(
            child.userData.approachX,
            child.userData.height / 2 - 8,
            child.userData.approachZ
          );
        });
      }

      // Camera: gentle orbit
      const camR = 32;
      camera.position.x = Math.sin(t * 0.04) * 4;
      camera.position.y = 8 + Math.sin(t * 0.03) * 1.5;
      camera.position.z = camR + Math.cos(t * 0.05) * 2;
      camera.lookAt(0, 2, 0);

      // Update cardinals to track construct rotation
      if (params.showHud && params.hudShowCardinals && constructGroup) {
        updateCardinals(-constructGroup.rotation.y);
      }

      // Wander the readouts
      signalLevel += (Math.random() - 0.5) * 0.01;
      signalLevel = Math.max(0.7, Math.min(1, signalLevel));
      iceLevel += (Math.random() - 0.5) * 0.015;
      iceLevel = Math.max(0.1, Math.min(0.95, iceLevel));
      latency += (Math.random() - 0.5) * 2;
      latency = Math.max(18, Math.min(180, latency));

      if (params.showHud && params.hudShowDeck) {
        hudTL.querySelector('[data-bind="jacked"]').textContent = fmtTime(jackedSec).slice(0, 8);
        hudTL.querySelector('[data-bind="latency"]').textContent = `${latency.toFixed(0)} ms`;
        const sigBar = hudTL.querySelector('[data-bar="signal"] > div');
        if (sigBar) sigBar.style.width = (signalLevel * 100).toFixed(0) + '%';
        const iceBar = hudTL.querySelector('[data-bar="ice"] > div');
        if (iceBar) iceBar.style.width = (iceLevel * 100).toFixed(0) + '%';
        const iceBarP = hudTL.querySelector('[data-bar="ice"]');
        if (iceBarP) {
          iceBarP.classList.toggle('warn', iceLevel > 0.6 && iceLevel < 0.85);
          iceBarP.classList.toggle('crit', iceLevel > 0.85);
        }
      }

      if (params.showHud && params.hudShowConstruct) {
        const yaw = constructGroup ? (constructGroup.rotation.y * 180 / Math.PI) % 360 : 0;
        hudTR.querySelector('[data-bind="heading"]').textContent = `${((yaw + 360) % 360).toFixed(1)}°`;
        hudTR.querySelector('[data-bind="construct"]').textContent =
          params.construct === 'fortress' ? 'FORTRESS_α7' :
          params.construct === 'lattice' ? 'LATTICE_Δ3' :
          params.construct === 'spire' ? 'SPIRE_Ω1' :
          params.construct === 'ringtower' ? 'RELAY_β2' :
          params.construct === 'gridcube' ? 'CUBE_Σ_8' :
          params.construct === 'pyramid' ? 'ZIGGURAT_Γ' :
          params.construct === 'hub' ? 'HUB_Φ_∞' :
          params.construct === 'crystal' ? 'LATTICE_Ψ4' : 'UNKNOWN_???';
        const gx = Math.floor(Math.sin(t * 0.04) * 2400);
        const gy = Math.floor(Math.cos(t * 0.05) * 2400);
        hudTR.querySelector('[data-bind="coord"]').textContent =
          `${gx >= 0 ? '+' : ''}${gx.toString().padStart(4, '0')} / ${gy >= 0 ? '+' : ''}${gy.toString().padStart(4, '0')}`;
        hudTR.querySelector('[data-bind="alt"]').textContent = `+${(8 + Math.sin(t * 0.07) * 2).toFixed(0).padStart(4, '0')}m`;
        hudTR.querySelector('[data-bind="trace"]').textContent = iceLevel > 0.75 ? 'DETECTED' : 'NONE';
        hudTR.querySelector('[data-bind="trace"]').className = iceLevel > 0.75 ? 'amber' : 'amber';
      }

      // Event feed — bursty, stochastic rhythm. Instead of a metronomic ping,
      // the feed fires in clusters: a burst of 1-4 lines in quick succession,
      // then a longer quiet gap. This reads like a system reacting to activity.
      if (params.showHud && params.hudShowEventLog) {
        if (logBurstRemaining > 0) {
          // Mid-burst: emit lines rapidly (every 60-220ms)
          if (t - lastLogT > 0.06 + Math.random() * 0.16) {
            lastLogT = t;
            logBurstRemaining--;
            const ev = pickFreshLogEvent();
            pushLogUnique(ev, Math.random() < 0.3 ? 'dim' : '');
          }
        } else if (t > nextBurstT) {
          // Start a new burst. Burst size skews small (mostly 1-2, sometimes 4).
          const r = Math.random();
          const burstSize = r < 0.5 ? 1 : r < 0.8 ? 2 : r < 0.94 ? 3 : 4;
          logBurstRemaining = burstSize;
          // Quiet gap until the burst AFTER this one: 2-7s, occasionally longer
          const gap = 2 + Math.random() * 5 + (Math.random() < 0.15 ? Math.random() * 6 : 0);
          nextBurstT = t + gap;
        }
      }

      // Mycotoxin bleed scheduling
      if (!bleedActive && t > nextBleedT && params.bleedFrequency > 0) {
        triggerBleed(t);
      }
      if (bleedActive && t > bleedEndT) {
        endBleed();
      }
      postMat.uniforms.uBleed.value = bleedActive ? params.bleedIntensity : 0;
      postMat.uniforms.uTime.value = t;

      // Tactical overlays
      tacticalTick(t);
    }

    renderer.setRenderTarget(renderTarget);
    renderer.render(scene, camera);
    renderer.setRenderTarget(null);
    renderer.render(postScene, postCam);
  }
  update();

  function onResize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h);
    renderTarget.setSize(w * Math.min(window.devicePixelRatio, 2), h * Math.min(window.devicePixelRatio, 2));
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    postMat.uniforms.uResolution.value.set(w, h);
    constructLineMats.forEach(m => m.resolution.set(w, h));
    horizonLineMats.forEach(m => m.resolution.set(w, h));
    // Tactical annotation line materials
    tacAnnotations.forEach(ann => {
      if (ann.worldMats) ann.worldMats.forEach(m => m.resolution.set(w, h));
      if (ann.leaderMat3D) ann.leaderMat3D.resolution.set(w, h);
    });
    tacSvg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  }
  window.addEventListener('resize', onResize);

  return {
    randomize() {
      // 1) Randomize the color palette (the one dropdown we DO touch).
      const paletteKeys = Object.keys(palettes);
      params.paletteName = paletteKeys[Math.floor(Math.random() * paletteKeys.length)];
      applyPalette();

      // 1b) Randomize the construct shape (the other dropdown we DO touch).
      const constructs = ['fortress', 'lattice', 'spire', 'ringtower', 'gridcube', 'pyramid', 'hub', 'crystal'];
      params.construct = constructs[Math.floor(Math.random() * constructs.length)];
      buildConstruct(); // HUD designation auto-updates each frame from params.construct

      // 2) Randomize EVERY numeric slider generically: roll within each
      //    slider's own declared min/max/step, set the input, and dispatch its
      //    'input' event so the existing onChange side effects all run. This
      //    automatically covers every current and future slider and respects
      //    each one's range. Toggles and non-palette dropdowns are untouched.
      //    Excluded: HUD presentation sliders (never resize/reglow the HUD) and
      //    line-weight sliders (most values look bad).
      const SKIP_SLIDER_LABELS = new Set([
        'hud scale', 'hud glow', 'cardinal size', 'watermark size',
        'line weight', 'bg weight'
      ]);
      controlsEl.querySelectorAll('input[type=range]').forEach(input => {
        const label = input.closest('.control')?.querySelector('.control-label')?.textContent?.trim();
        if (label && SKIP_SLIDER_LABELS.has(label)) return; // skip excluded sliders
        const min = parseFloat(input.min);
        const max = parseFloat(input.max);
        const step = parseFloat(input.step) || 0.01;
        const steps = Math.max(1, Math.round((max - min) / step));
        const v = min + Math.round(Math.random() * steps) * step;
        // Clamp + fix floating point drift to the step grid
        const clamped = Math.min(max, Math.max(min, parseFloat(v.toFixed(6))));
        input.value = clamped;
        input.dispatchEvent(new Event('input', { bubbles: true }));
      });

      // Any slider that rebuilt geometry (e.g. density) or the shape change
      // above may have left annotations anchored to stale geometry — clear them.
      clearScene();

      // 3) Sync the dropdowns we changed (sliders synced themselves via events).
      controlsEl.querySelectorAll('select').forEach(sel => {
        const label = sel.closest('.control')?.querySelector('.control-label')?.textContent?.trim();
        if (label === 'theme') sel.value = params.paletteName;
        if (label === 'shape') sel.value = params.construct;
      });
    },
    dispose() {
      alive = false;
      window.removeEventListener('resize', onResize);
      stage.classList.remove('neuro-stage');
      styleEl.remove();
      overlay.remove();
      // Tactical cleanup — disposeAnnotation handles world objects, DOM, SVG
      while (tacAnnotations.length) disposeAnnotation(tacAnnotations.pop());
      if (constructGroup) constructGroup.traverse(o => {
        if (o.geometry) o.geometry.dispose();
      });
      constructLineMats.forEach(m => m.dispose());
      constructLineMats.length = 0;
      horizonGroup.traverse(o => {
        if (o.geometry) o.geometry.dispose();
      });
      horizonLineMats.forEach(m => m.dispose());
      horizonLineMats.length = 0;
      renderer.dispose();
      renderTarget.dispose();
    }
  };
});

// --- Panel hide / show + fullscreen, shared by buttons and hotkeys ---
const btnHide = document.getElementById('btn-hide');
const btnShow = document.getElementById('btn-show');
const btnFullscreen = document.getElementById('btn-fullscreen');

function setPanelHidden(hidden) {
  panel.classList.toggle('hidden', hidden);
  fpsEl.classList.toggle('hidden', hidden);
  document.body.classList.toggle('hide-cursor', hidden);
  btnShow.classList.toggle('visible', hidden);
}
function togglePanel() {
  setPanelHidden(!panel.classList.contains('hidden'));
}
function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen();
  }
}

btnHide.addEventListener('click', () => setPanelHidden(true));
btnShow.addEventListener('click', () => setPanelHidden(false));
btnFullscreen.addEventListener('click', toggleFullscreen);

// Reflect actual fullscreen state on the button (e.g. when user hits Esc)
document.addEventListener('fullscreenchange', () => {
  btnFullscreen.classList.toggle('active', !!document.fullscreenElement);
  btnFullscreen.textContent = document.fullscreenElement ? 'exit full' : 'fullscreen';
});

document.getElementById('btn-randomize').addEventListener('click', () => {
  if (currentScene && currentScene.randomize) currentScene.randomize();
});

document.getElementById('btn-reset').addEventListener('click', () => {
  loadScene(currentSceneName);
});

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const k = e.key.toLowerCase();
  if (k === 'h') {
    togglePanel();
  } else if (k === 'f') {
    toggleFullscreen();
  } else if (k === 'r') {
    if (currentScene && currentScene.randomize) currentScene.randomize();
  } else if (k === ' ') {
    e.preventDefault();
    paused = !paused;
  }
});

// FPS counter
let frames = 0, lastFpsT = performance.now();
function fpsLoop() {
  frames++;
  const now = performance.now();
  if (now - lastFpsT >= 500) {
    const fps = Math.round(frames * 1000 / (now - lastFpsT));
    fpsEl.textContent = `${fps} fps`;
    frames = 0; lastFpsT = now;
  }
  requestAnimationFrame(fpsLoop);
}
fpsLoop();

// --- Boot ---
loadScene('neuro');
</script>
