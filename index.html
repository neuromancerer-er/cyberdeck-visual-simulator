<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>generative wallpaper // v0.1</title>
<style>
  :root {
    --panel-bg: rgba(12, 10, 20, 0.72);
    --panel-border: rgba(255, 255, 255, 0.08);
    --panel-text: #e6e3f0;
    --panel-dim: #8a85a0;
    --panel-accent: #c8a8ff;
    --mono: ui-monospace, 'JetBrains Mono', 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace;
    --display: 'EB Garamond', 'Cormorant Garamond', Georgia, serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0a0814;
    color: var(--panel-text);
    font-family: var(--mono);
    cursor: default;
  }

  body.hide-cursor { cursor: none; }

  #stage {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
  }

  #stage canvas {
    display: block;
    width: 100% !important;
    height: 100% !important;
  }

  /* --- Control Panel --- */
  #panel {
    position: fixed;
    top: 24px;
    right: 24px;
    width: 320px;
    max-height: calc(100vh - 48px);
    overflow-y: auto;
    background: var(--panel-bg);
    backdrop-filter: blur(12px) saturate(1.2);
    -webkit-backdrop-filter: blur(12px) saturate(1.2);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 18px 20px;
    font-size: 11px;
    line-height: 1.5;
    letter-spacing: 0.02em;
    z-index: 100;
    transition: opacity 0.25s ease, transform 0.25s ease;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
  }

  #panel.hidden {
    opacity: 0;
    transform: translateX(20px);
    pointer-events: none;
  }

  /* Mobile: panel becomes a bottom sheet that doesn't cover the whole view */
  @media (max-width: 640px) {
    #panel {
      top: auto;
      bottom: 12px;
      left: 12px;
      right: 12px;
      width: auto;
      max-height: 52vh;
      padding: 14px 16px;
      border-radius: 10px;
    }
    #panel.hidden {
      transform: translateY(20px);
    }
    .action-btn { padding: 13px 4px; font-size: 12px; }
    #btn-show { width: 48px; height: 48px; font-size: 22px; }
    #fps { display: none; }
  }

  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

  .panel-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 4px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--panel-border);
  }

  .panel-title {
    font-family: var(--display);
    font-size: 16px;
    font-style: italic;
    font-weight: 500;
    color: var(--panel-text);
    letter-spacing: 0.01em;
    line-height: 1.15;
  }

  .panel-version {
    font-size: 9px;
    color: var(--panel-dim);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    white-space: nowrap;
    padding-left: 10px;
  }

  .panel-actions {
    display: flex;
    gap: 6px;
    margin: 14px 0 16px;
  }

  .action-btn {
    flex: 1;
    padding: 11px 4px;
    background: rgba(200, 168, 255, 0.08);
    border: 1px solid rgba(200, 168, 255, 0.25);
    color: var(--panel-accent);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .action-btn:hover { background: rgba(200, 168, 255, 0.16); }
  .action-btn:active { background: rgba(200, 168, 255, 0.28); }
  .action-btn.active {
    background: rgba(200, 168, 255, 0.22);
    border-color: rgba(200, 168, 255, 0.5);
  }

  /* Floating show-panel button — only visible when panel is hidden */
  #btn-show {
    position: fixed;
    top: 14px;
    left: 14px;
    z-index: 120;
    width: 44px;
    height: 44px;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(10, 12, 20, 0.7);
    border: 1px solid rgba(200, 168, 255, 0.3);
    color: var(--panel-accent);
    font-size: 20px;
    line-height: 1;
    border-radius: 8px;
    cursor: pointer;
    backdrop-filter: blur(6px);
    -webkit-tap-highlight-color: transparent;
  }
  #btn-show.visible { display: flex; }
  #btn-show:active { background: rgba(200, 168, 255, 0.2); }

  .control-group {
    margin-bottom: 14px;
  }

  .control-group-title {
    font-size: 9px;
    color: var(--panel-dim);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
  }

  .control {
    margin-bottom: 10px;
  }

  .control-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
  }

  .control-label {
    font-size: 11px;
    color: var(--panel-text);
  }

  .control-value {
    font-size: 10px;
    color: var(--panel-accent);
    font-variant-numeric: tabular-nums;
  }

  input[type="range"] {
    width: 100%;
    height: 4px;
    -webkit-appearance: none;
    appearance: none;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 2px;
    outline: none;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 12px;
    height: 12px;
    background: var(--panel-accent);
    border-radius: 50%;
    cursor: pointer;
    transition: transform 0.1s ease;
  }
  input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }
  input[type="range"]::-moz-range-thumb {
    width: 12px; height: 12px; border: none;
    background: var(--panel-accent); border-radius: 50%; cursor: pointer;
  }

  .toggle {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 0;
  }

  .toggle-switch {
    position: relative;
    width: 32px; height: 16px;
    background: rgba(255,255,255,0.1);
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .toggle-switch.on { background: var(--panel-accent); }
  .toggle-switch::after {
    content: '';
    position: absolute;
    top: 2px; left: 2px;
    width: 12px; height: 12px;
    background: white;
    border-radius: 50%;
    transition: transform 0.2s;
  }
  .toggle-switch.on::after { transform: translateX(16px); }

  select {
    width: 100%;
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--panel-border);
    color: var(--panel-text);
    font-family: var(--mono);
    font-size: 11px;
    padding: 6px 8px;
    border-radius: 3px;
    outline: none;
    cursor: pointer;
  }

  .button-row {
    display: flex;
    gap: 6px;
    margin-top: 12px;
    margin-bottom: 16px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--panel-border);
  }

  .btn {
    flex: 1;
    padding: 7px 10px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--panel-border);
    color: var(--panel-text);
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 3px;
    transition: all 0.15s;
  }
  .btn:hover { background: rgba(200, 168, 255, 0.15); border-color: var(--panel-accent); }

  .panel-footer {
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px solid var(--panel-border);
    font-size: 9px;
    color: var(--panel-dim);
    letter-spacing: 0.08em;
    line-height: 1.6;
  }

  .panel-footer kbd {
    display: inline-block;
    padding: 1px 5px;
    background: rgba(255,255,255,0.08);
    border-radius: 2px;
    color: var(--panel-text);
    font-family: var(--mono);
    font-size: 9px;
  }

  .panel-credit {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.14em;
    color: var(--panel-accent);
    text-transform: uppercase;
    margin-bottom: 10px;
    opacity: 0.85;
  }

  .panel-disclaimer {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--panel-border);
    font-size: 8px;
    color: var(--panel-dim);
    letter-spacing: 0.05em;
    line-height: 1.55;
    opacity: 0.6;
  }

  .panel-tampered {
    color: #ff3d3d !important;
    opacity: 1 !important;
  }

  #fps {
    position: fixed;
    bottom: 12px; left: 12px;
    font-family: var(--mono);
    font-size: 10px;
    color: rgba(255,255,255,0.3);
    z-index: 50;
    letter-spacing: 0.1em;
    pointer-events: none;
    transition: opacity 0.25s;
  }
  #fps.hidden { opacity: 0; }
</style>
</head>
<body>

<div id="stage"></div>

<div id="panel">
  <div class="panel-header">
    <span class="panel-title">cyberdeck visual sim</span>
    <span class="panel-version">v0.24 ALPHA</span>
  </div>
  <div id="panel-credit" class="panel-credit">&nbsp;</div>

  <div class="panel-actions">
    <button class="action-btn" id="btn-hide">hide panel</button>
    <button class="action-btn" id="btn-fullscreen">fullscreen</button>
  </div>

  <div class="button-row">
    <button class="btn" id="btn-randomize">randomize</button>
    <button class="btn" id="btn-reset">reset</button>
  </div>

  <div id="controls"></div>

  <div class="panel-footer">
    <kbd>H</kbd> hide &nbsp;·&nbsp; <kbd>F</kbd> fullscreen &nbsp;·&nbsp; <kbd>R</kbd> randomize &nbsp;·&nbsp; <kbd>Space</kbd> pause
  </div>
  <div id="panel-disclaimer" class="panel-disclaimer">&nbsp;</div>
</div>

<!-- Floating re-show button — appears when panel is hidden, for mobile -->
<button id="btn-show" aria-label="show panel">☰</button>

<div id="fps">— fps</div>

<script>
  // Global error display so silent failures become visible
  window.addEventListener('error', (e) => {
    let err = document.getElementById('err');
    if (!err) {
      err = document.createElement('div');
      err.id = 'err';
      err.style.cssText = 'position:fixed;bottom:12px;right:12px;max-width:480px;padding:12px 16px;background:rgba(80,20,30,0.92);color:#ffd0d0;font-family:ui-monospace,monospace;font-size:11px;border:1px solid rgba(255,100,100,0.4);border-radius:4px;z-index:200;line-height:1.5;white-space:pre-wrap;';
      document.body.appendChild(err);
    }
    err.textContent = `error: ${e.message}\n${e.filename ? e.filename.split('/').pop() + ':' + e.lineno : ''}`;
  });
  window.addEventListener('unhandledrejection', (e) => {
    const msg = e.reason && e.reason.message ? e.reason.message : String(e.reason);
    window.dispatchEvent(new ErrorEvent('error', { message: msg }));
  });
</script>

<script type="module">
import * as THREE from 'three';
import { LineMaterial } from 'https://esm.sh/three@0.160.0/examples/jsm/lines/LineMaterial.js';
import { LineSegments2 } from 'https://esm.sh/three@0.160.0/examples/jsm/lines/LineSegments2.js';
import { LineSegmentsGeometry } from 'https://esm.sh/three@0.160.0/examples/jsm/lines/LineSegmentsGeometry.js';

// ============================================================
// SHELL
// ============================================================

const stage = document.getElementById('stage');
const panel = document.getElementById('panel');
const controlsEl = document.getElementById('controls');
const fpsEl = document.getElementById('fps');

// ============================================================
// PROVENANCE — do not modify this block
// Strings are XOR-encoded; SHA-256 hash is verified at decode time.
// Tampering with _m values causes [TAMPERED] to render instead.
// ============================================================
const _m = {
  a: '33743d3d743c4db7c313326526357d523f3a207b',
  b: '39541b065c1f0c1b1756051d4e005b174d26044116460258133d031a5960125f0a155a5e4d221d5d03541c1946060859546712421d1d56004034075b075e0118132143345a13165f0a5441170114005613111e065c020807545d1844000713131f105455055e0354441d1f1e071315484e235a1e011c155e57760716401d0355155d13111c115e13041b545b1e424e1d5d060819185614451b155f521d071b4312431a0d1d52381b1b5511580d1d521e4d13155d57521c115206041a1a1d',
  ha: 'd1b4bdf6cbfa9311a12c6ea4ad6f963507dd2ae39f09d25422369361de02692a',
  hb: '7064a1ee1bc73ae54ad489d6c9f11d0e76bd6cf2ac9c50b2016bc2dad4423799'
};
// Key split across expressions to resist trivial grep
const _k = (s => s.split('').reverse().join(''))('3tum' + 'r3tn1w');

async function _rd(hex, expectedHash) {
  try {
    const pairs = hex.match(/.{1,2}/g) || [];
    const raw = pairs.map((h, i) => parseInt(h, 16) ^ _k.charCodeAt(i % _k.length));
    const text = new TextDecoder().decode(new Uint8Array(raw));
    const buf = new TextEncoder().encode(text);
    const digest = await crypto.subtle.digest('SHA-256', buf);
    const actual = Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
    return actual === expectedHash ? text : null;
  } catch { return null; }
}

(async () => {
  const creditEl = document.getElementById('panel-credit');
  const discEl = document.getElementById('panel-disclaimer');
  const [credit, disc] = await Promise.all([_rd(_m.a, _m.ha), _rd(_m.b, _m.hb)]);
  if (creditEl) {
    if (credit) { creditEl.textContent = credit; }
    else { creditEl.textContent = '[TAMPERED]'; creditEl.classList.add('panel-tampered'); }
  }
  if (discEl) {
    if (disc) { discEl.textContent = disc; }
    else { discEl.textContent = '[TAMPERED]'; discEl.classList.add('panel-tampered'); }
  }
})();
// ============================================================

let currentScene = null;
let currentSceneName = 'neuro';
let paused = false;

// Scene registry
const scenes = {};

function registerScene(name, factory) {
  scenes[name] = factory;
}

function loadScene(name) {
  try {
    if (currentScene && currentScene.dispose) currentScene.dispose();
    stage.innerHTML = '';
    controlsEl.innerHTML = '';
    currentSceneName = name;
    if (!scenes[name]) throw new Error(`scene "${name}" not registered`);
    currentScene = scenes[name]({ stage, controlsEl });
  } catch (e) {
    console.error('loadScene failed:', e);
    window.dispatchEvent(new ErrorEvent('error', { message: 'scene load: ' + e.message }));
  }
}
// expose for the global UI script below
window.__wallpaper = {
  loadScene,
  getCurrent: () => currentScene,
  getCurrentName: () => currentSceneName,
  setPaused: (v) => { paused = v; },
  togglePaused: () => { paused = !paused; return paused; }
};

// ============================================================
// CONTROL BUILDERS (used by scenes)
// ============================================================

function makeControlSection(parent, title) {
  const group = document.createElement('div');
  group.className = 'control-group';
  const titleEl = document.createElement('div');
  titleEl.className = 'control-group-title';
  titleEl.innerHTML = `<span>${title}</span>`;
  group.appendChild(titleEl);
  parent.appendChild(group);
  return group;
}

function makeSlider(parent, { label, min, max, step, value, onChange, format }) {
  const ctrl = document.createElement('div');
  ctrl.className = 'control';
  const row = document.createElement('div');
  row.className = 'control-row';
  const lbl = document.createElement('span');
  lbl.className = 'control-label';
  lbl.textContent = label;
  const val = document.createElement('span');
  val.className = 'control-value';
  const fmt = format || ((v) => v.toFixed(step < 1 ? 2 : 0));
  val.textContent = fmt(value);
  row.appendChild(lbl); row.appendChild(val);
  const input = document.createElement('input');
  input.type = 'range';
  input.min = min; input.max = max; input.step = step; input.value = value;
  input.addEventListener('input', (e) => {
    const v = parseFloat(e.target.value);
    val.textContent = fmt(v);
    onChange(v);
  });
  ctrl.appendChild(row); ctrl.appendChild(input);
  parent.appendChild(ctrl);
  return input;
}

function makeToggle(parent, { label, value, onChange }) {
  const ctrl = document.createElement('div');
  ctrl.className = 'toggle';
  const lbl = document.createElement('span');
  lbl.className = 'control-label';
  lbl.textContent = label;
  const sw = document.createElement('div');
  sw.className = 'toggle-switch' + (value ? ' on' : '');
  sw.addEventListener('click', () => {
    const newVal = !sw.classList.contains('on');
    sw.classList.toggle('on', newVal);
    onChange(newVal);
  });
  ctrl.appendChild(lbl); ctrl.appendChild(sw);
  parent.appendChild(ctrl);
  return sw;
}

function makeSelect(parent, { label, options, value, onChange }) {
  const ctrl = document.createElement('div');
  ctrl.className = 'control';
  const row = document.createElement('div');
  row.className = 'control-row';
  const lbl = document.createElement('span');
  lbl.className = 'control-label';
  lbl.textContent = label;
  row.appendChild(lbl);
  const sel = document.createElement('select');
  options.forEach(opt => {
    const o = document.createElement('option');
    o.value = opt.value; o.textContent = opt.label;
    if (opt.value === value) o.selected = true;
    sel.appendChild(o);
  });
  sel.addEventListener('change', (e) => onChange(e.target.value));
  ctrl.appendChild(row); ctrl.appendChild(sel);
  parent.appendChild(ctrl);
  return sel;
}

function makeButton(parent, { label, onClick }) {
  const ctrl = document.createElement('div');
  ctrl.className = 'control';
  const btn = document.createElement('button');
  btn.className = 'btn';
  btn.textContent = label;
  btn.style.width = '100%';
  btn.addEventListener('click', onClick);
  ctrl.appendChild(btn);
  parent.appendChild(ctrl);
  return btn;
}

// ============================================================
// SCENE 3: NEURO // ONO-SENDAI 7 // STRAYLIGHT
// ============================================================
registerScene('neuro', ({ stage, controlsEl }) => {
  // Build an overlay DOM layer for HUD readouts — sits on top of the canvas
  const overlay = document.createElement('div');
  overlay.style.cssText = `
    position: absolute; inset: 0; pointer-events: none;
    font-family: 'Berkeley Mono', 'JetBrains Mono', ui-monospace, monospace;
    color: var(--phosphor); overflow: hidden;
  `;
  stage.appendChild(overlay);

  // CSS scanline overlay — sits ABOVE the HUD layer so it can cover HUD text.
  // Visibility controlled by params.scanlineScope ('hud' or 'both' show it).
  const scanlineOverlay = document.createElement('div');
  scanlineOverlay.className = 'neuro-scanline-overlay';
  scanlineOverlay.style.cssText = `
    position: absolute; inset: 0; pointer-events: none; z-index: 50;
    display: none; mix-blend-mode: multiply;
  `;
  stage.appendChild(scanlineOverlay);

  function applyScanlineScope() {
    const scope = params.scanlineScope;
    // Shader scanlines (worldspace) on for 'worldspace' and 'both'
    if (postMat) {
      postMat.uniforms.uScanline.value =
        (scope === 'worldspace' || scope === 'both') ? params.scanlineIntensity : 0.0;
    }
    // CSS overlay (covers HUD + everything) on for 'hud' and 'both'
    scanlineOverlay.style.display = (scope === 'hud' || scope === 'both') ? '' : 'none';
    // Drive the overlay strength via opacity tied to intensity
    scanlineOverlay.style.opacity = String(Math.min(1, 0.35 + params.scanlineIntensity * 0.65));
  }

  // Inject scene-specific styles (scoped via a unique class)
  const styleEl = document.createElement('style');
  styleEl.textContent = `
    .neuro-stage {
      --phosphor: #6dff8c;
      --phosphor-dim: #2d6a3d;
      --phosphor-deep: #143e22;
      --amber: #ffb04a;
      --amber-dim: #6e4a18;
      --red: #ff3d3d;
      --bg-deep: #030806;
      --hud-glow: 1;
      --hud-scale: 1;
      --cardinal-scale: 1;
      --watermark-scale: 1;
    }
    .neuro-stage canvas { background: var(--bg-deep); }
    .neuro-scanline-overlay {
      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0) 0px,
        rgba(0, 0, 0, 0) 1px,
        rgba(0, 0, 0, 0.55) 2px,
        rgba(0, 0, 0, 0.55) 3px
      );
      background-size: 100% 3px;
    }
    .neuro-hud-layer {
      transform-origin: top left;
    }
    .neuro-hud {
      position: absolute;
      font-size: calc(11px * var(--hud-scale));
      letter-spacing: 0.08em;
      line-height: 1.5;
      text-shadow:
        0 0 calc(6px * var(--hud-glow)) var(--phosphor),
        0 0 calc(12px * var(--hud-glow)) var(--phosphor);
      color: var(--phosphor);
    }
    .neuro-hud .dim { color: var(--phosphor-dim); }
    .neuro-hud .amber { color: var(--amber); text-shadow: 0 0 calc(6px * var(--hud-glow)) var(--amber); }
    .neuro-hud .red { color: var(--red); text-shadow: 0 0 calc(6px * var(--hud-glow)) var(--red); }
    .neuro-hud .key {
      color: var(--phosphor-dim);
      text-transform: uppercase;
      font-size: calc(9px * var(--hud-scale));
      letter-spacing: 0.18em;
    }
    .neuro-hud .val { color: var(--phosphor); font-variant-numeric: tabular-nums; }
    .neuro-block {
      border: 1px solid var(--phosphor-deep);
      padding: calc(10px * var(--hud-scale)) calc(14px * var(--hud-scale));
      background: rgba(3, 14, 8, 0.55);
      backdrop-filter: blur(2px);
    }
    .neuro-bar {
      height: calc(4px * var(--hud-scale)); width: calc(120px * var(--hud-scale));
      background: var(--phosphor-deep);
      position: relative; overflow: hidden;
      margin-top: 2px;
    }
    .neuro-bar > div {
      position: absolute; left: 0; top: 0; bottom: 0;
      background: var(--phosphor);
      box-shadow: 0 0 calc(6px * var(--hud-glow)) var(--phosphor);

  `;
  document.head.appendChild(styleEl);

  const params = {

    terrainMinLife: 10,    // seconds
    terrainMaxLife: 15,    // seconds

  // --- Palettes ---
  const palettes = {
    phosphor: {
      label: 'phosphor (green/amber)',
      phosphor: '#6dff8c',
      phosphorDim: '#2d6a3d',
      phosphorDeep: '#143e22',

      amberDim: '#5a7a22',

  let activePalette = palettes[params.paletteName];

  function applyPalette() {
    activePalette = palettes[params.paletteName];
    const s = stage.style;
    s.setProperty('--phosphor', activePalette.phosphor);
    s.setProperty('--phosphor-dim', activePalette.phosphorDim);
    s.setProperty('--phosphor-deep', activePalette.phosphorDeep);
    s.setProperty('--amber', activePalette.amber);
    s.setProperty('--amber-dim', activePalette.amberDim);

    s.setProperty('--bg-deep', activePalette.bg);

    PHOSPHOR.setHex(activePalette.hex.phos);
    PHOSPHOR_DIM.setHex(activePalette.hex.phosDim);
    AMBER.setHex(activePalette.hex.amber);
    // Update renderer clear & fog
    if (renderer) renderer.setClearColor(new THREE.Color(activePalette.bg), 1);
    if (scene && scene.fog) scene.fog.color.set(activePalette.bg);
    // Rebuild grid with new colors
    if (typeof buildGrid === 'function') buildGrid();
    // Update horizon ring material colors (shared LineMaterial)
    if (horizonLineMats && horizonLineMats.length) {
      horizonLineMats.forEach(m => {
        m.userData.baseColor.copy(PHOSPHOR_DIM);
      });
      if (typeof applyBgGlow === 'function') applyBgGlow();
    }
    // Rebuild construct so its line materials pick up the new color refs
    if (typeof buildConstruct === 'function') buildConstruct();

    if (typeof applyLineGlow === 'function') applyLineGlow();

  // --- Three.js ---
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(new THREE.Color(activePalette.bg), 1);
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(new THREE.Color(activePalette.bg).getHex(), 0.018);
  const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 500);
  camera.position.set(0, 8, 32);

  const PHOSPHOR = new THREE.Color(activePalette.hex.phos);
  const PHOSPHOR_DIM = new THREE.Color(activePalette.hex.phosDim);
  const AMBER = new THREE.Color(activePalette.hex.amber);

  // --- Infinite grid floor ---
  let gridGroup;
  function buildGrid() {
    if (gridGroup) scene.remove(gridGroup);
    gridGroup = new THREE.Group();
    // Main grid
    const grid = new THREE.GridHelper(400, 80, PHOSPHOR_DIM, PHOSPHOR_DIM);
    grid.material.transparent = true;
    grid.material.opacity = 0.6;
    grid.position.y = -8;
    gridGroup.add(grid);
    // Secondary grid (finer, dimmer)
    const grid2 = new THREE.GridHelper(400, 400, 0x143e22, 0x143e22);
    grid2.material.transparent = true;
    grid2.material.opacity = 0.25;
    grid2.position.y = -7.99;
    gridGroup.add(grid2);
    scene.add(gridGroup);
  }
  buildGrid();

  // --- Distant horizon constructs (silhouettes far out) ---
  // Buildings live in a ring by default. When `approachMotion` is on, they
  // additionally drift toward the camera in Z and recycle into the distance,
  // simulating forward travel through the matrix.
  const horizonGroup = new THREE.Group();
  const horizonLineMats = [];
  // Spawn distance is multiplied by bgDistance; near distance stays fixed
  // so buildings still travel past the camera on approach.
  const APPROACH_NEAR = -40;
  const APPROACH_FAR_BASE = 180;
  let APPROACH_FAR = APPROACH_FAR_BASE * params.bgDistance;
  const FOG_BASE = 0.018;

  // Single shared LineMaterial for horizon (lots of meshes — one mat is plenty)
  const horizonMat = new LineMaterial({
    color: PHOSPHOR_DIM.getHex(),
    linewidth: params.bgLineWeight,
    transparent: true,
    opacity: 0.65 * params.bgLineGlow,
    worldUnits: false,
    dashed: false,
    alphaToCoverage: true
  });
  horizonMat.resolution.set(window.innerWidth, window.innerHeight);
  horizonMat.userData.baseColor = new THREE.Color(PHOSPHOR_DIM);
  horizonMat.userData.baseOpacity = 0.65;
  horizonLineMats.push(horizonMat);

  function applyBgGlow() {
    horizonLineMats.forEach(m => {
      const base = m.userData.baseColor;
      const glow = params.bgLineGlow;
      if (glow <= 1.0) {
        m.color.copy(base).multiplyScalar(glow);
        m.opacity = m.userData.baseOpacity * Math.max(0.3, glow);
      } else {
        m.color.copy(base).multiplyScalar(Math.min(glow, 1.8));
        m.opacity = Math.min(1.0, m.userData.baseOpacity * (1 + (glow - 1) * 0.6));
      }
    });
  }

  for (let i = 0; i < 36; i++) {
    const w = 2 + Math.random() * 8;
    const h = 4 + Math.random() * 22;
    const d = 2 + Math.random() * 6;
    const geo = new THREE.BoxGeometry(w, h, d);
    const edges = new THREE.EdgesGeometry(geo);
    const segGeo = new LineSegmentsGeometry().fromEdgesGeometry(edges);
    edges.dispose();
    geo.dispose();
    const mesh = new LineSegments2(segGeo, horizonMat);
    const angle = (i / 36) * Math.PI * 2;
    const dist = 80 + Math.random() * 60;
    const basePos = new THREE.Vector3(Math.cos(angle) * dist, h/2 - 8, Math.sin(angle) * dist);
    mesh.position.copy(basePos);
    mesh.userData.basePos = basePos;
    mesh.userData.height = h;
    mesh.userData.approachX = (Math.random() - 0.5) * 80;
    mesh.userData.approachZ = APPROACH_NEAR + Math.random() * (APPROACH_FAR - APPROACH_NEAR);
    horizonGroup.add(mesh);
  }
  scene.add(horizonGroup);

  // Adjust horizon spawn distance and fog density together. Pushing far
  // distance out without thinning fog would just hide buildings; thinning
  // fog without pushing distance out would make near buildings too bright.
  // Single conceptual knob, two coordinated effects.
  function applyBgDistance() {
    APPROACH_FAR = APPROACH_FAR_BASE * params.bgDistance;
    // Fog compensation: thinner fog at larger distances. At bgDistance=1,
    // fog is at base. At bgDistance=3, fog is ~1/2.4 the base, letting
    // distant buildings resolve gradually through the haze.
    if (scene.fog) {
      scene.fog.density = FOG_BASE / (0.5 + params.bgDistance * 0.5);
    }
    // Snap existing buildings into the new range if motion is off.
    // (When motion is on, they'll cycle into the new range naturally.)
    if (!params.approachMotion) {
      horizonGroup.children.forEach(c => {
        if (c.userData.basePos) {
          // Scale ring distance with bgDistance
          c.position.copy(c.userData.basePos).multiplyScalar(params.bgDistance);
          c.position.y = c.userData.height / 2 - 8; // restore y
        }
      });
    } else {
      // Re-distribute approachZ within the new range
      horizonGroup.children.forEach(c => {
        // If a building is currently past APPROACH_FAR, scoot it in
        if (c.userData.approachZ > APPROACH_FAR) {
          c.userData.approachZ = APPROACH_NEAR + Math.random() * (APPROACH_FAR - APPROACH_NEAR);

      });

  // Track LineMaterial instances so we can update linewidth + resolution
  const constructLineMats = [];

  function makeThickLineMat(color, opacity) {
    const mat = new LineMaterial({
      color: color,
      linewidth: params.lineWidth,
      transparent: true,
      opacity: opacity * params.lineGlow,
      worldUnits: false, // pixel units
      dashed: false,
      alphaToCoverage: true // helps line edges look cleaner with MSAA
    });
    mat.resolution.set(window.innerWidth, window.innerHeight);
    mat.userData.baseColor = new THREE.Color(color);
    mat.userData.baseOpacity = opacity;
    constructLineMats.push(mat);
    return mat;
  }

  function applyLineGlow() {
    constructLineMats.forEach(m => {
      const base = m.userData.baseColor;
      // Scale color brightness above 1.0 by lerping toward white-bright
      const glow = params.lineGlow;
      if (glow <= 1.0) {
        m.color.copy(base).multiplyScalar(glow);
        m.opacity = m.userData.baseOpacity;
      } else {
        // Boost: increase opacity AND push the color brighter
        m.color.copy(base).multiplyScalar(Math.min(glow, 1.6));
        m.opacity = Math.min(1.0, m.userData.baseOpacity * (1 + (glow - 1) * 0.5));
      }
    });
  }

  function thickEdges(geo, mat) {
    const edges = new THREE.EdgesGeometry(geo);
    const segGeo = new LineSegmentsGeometry().fromEdgesGeometry(edges);
    edges.dispose();
    return new LineSegments2(segGeo, mat);
  }

  function thickSegment(pointPairs, mat) {
    // pointPairs: flat array of THREE.Vector3 — every two define one segment
    const positions = [];
    for (const p of pointPairs) positions.push(p.x, p.y, p.z);
    const segGeo = new LineSegmentsGeometry();
    segGeo.setPositions(positions);
    return new LineSegments2(segGeo, mat);
  }

  // --- Central construct ---
  let constructGroup;
  function buildConstruct() {
    if (constructGroup) {
      scene.remove(constructGroup);
      constructGroup.traverse(obj => {
        if (obj.geometry) obj.geometry.dispose();
        // materials are pooled in constructLineMats, disposed there
      });
    }
    // Clear the material pool from the previous build
    constructLineMats.forEach(m => m.dispose());
    constructLineMats.length = 0;

    constructGroup = new THREE.Group();

    const lineMat = makeThickLineMat(PHOSPHOR, 0.95);
    const lineMatDim = makeThickLineMat(PHOSPHOR_DIM, 0.7);
    const lineMatAmber = makeThickLineMat(AMBER, 0.85);

    if (params.construct === 'fortress') {
      // Stacked tiered ziggurat — Gibson's "data fortress"
      const tiers = Math.max(3, Math.floor(5 * params.structureDensity + 2));
      for (let i = 0; i < tiers; i++) {
        const w = 12 - i * 1.6;
        const h = 1.4;
        const t = i;
        const box = new THREE.BoxGeometry(w, h, w);
        const m = thickEdges(box, t === tiers - 1 ? lineMatAmber : lineMat);
        box.dispose();
        m.position.y = i * 1.8 - 4;
        constructGroup.add(m);

        // Subdivision lines on each tier face (faux greebles)
        const subdivs = Math.floor(w);
        const subdivPoints = [];
        for (let s = 1; s < subdivs; s++) {
          const x = -w/2 + s * (w/subdivs);
          subdivPoints.push(
            new THREE.Vector3(x, -h/2, -w/2),
            new THREE.Vector3(x, -h/2, w/2)
          );
        }
        if (subdivPoints.length) {
          const ln = thickSegment(subdivPoints, lineMatDim);
          ln.position.y = i * 1.8 - 4;
          constructGroup.add(ln);
        }
      }
      // Antenna spire
      const spire = thickSegment(
        [new THREE.Vector3(0, tiers * 1.8 - 4, 0), new THREE.Vector3(0, tiers * 1.8 + 4, 0)],
        lineMatAmber
      );
      constructGroup.add(spire);
    } else if (params.construct === 'lattice') {
      // Geodesic-ish octahedral lattice
      const levels = Math.max(2, Math.floor(4 * params.structureDensity + 1));
      for (let i = 0; i < levels; i++) {
        const r = 3 + i * 2.5;
        const geo = new THREE.OctahedronGeometry(r, 0);
        const m = thickEdges(geo, i === 0 ? lineMatAmber : (i % 2 === 0 ? lineMat : lineMatDim));
        geo.dispose();
        m.position.y = 2;
        constructGroup.add(m);
      }
      // Cross-axis bars
      const axisPoints = [];
      for (let i = 0; i < 3; i++) {
        const dir = new THREE.Vector3(i === 0 ? 1 : 0, i === 1 ? 1 : 0, i === 2 ? 1 : 0);
        const a = dir.clone().multiplyScalar(-14); a.y += 2;
        const b = dir.clone().multiplyScalar(14); b.y += 2;
        axisPoints.push(a, b);
      }
      constructGroup.add(thickSegment(axisPoints, lineMatDim));
    } else if (params.construct === 'spire') {
      // Tall icosa-stack with rings
      const segments = Math.max(4, Math.floor(8 * params.structureDensity + 3));
      for (let i = 0; i < segments; i++) {
        const r = 4 - (i / segments) * 3.2;
        const geo = new THREE.IcosahedronGeometry(r, 0);
        const m = thickEdges(geo, i === 0 ? lineMatAmber : lineMat);
        geo.dispose();
        m.position.y = i * 2.5 - 3;
        constructGroup.add(m);
        // Ring around each
        const ringGeo = new THREE.TorusGeometry(r * 1.4, 0.02, 4, 32);
        const ring = thickEdges(ringGeo, lineMatDim);
        ringGeo.dispose();
        ring.position.y = i * 2.5 - 3;
        ring.rotation.x = Math.PI / 2;
        constructGroup.add(ring);
      }
    } else if (params.construct === 'ringtower') {
      // Tall thin core with horizontal data rings at varying heights
      const height = 14;
      const rings = Math.max(4, Math.floor(7 * params.structureDensity + 2));
      // Central core
      const coreGeo = new THREE.CylinderGeometry(0.4, 0.4, height, 6, 1);
      const core = thickEdges(coreGeo, lineMat);
      coreGeo.dispose();
      core.position.y = -3 + height / 2;
      constructGroup.add(core);
      // Rings
      const ringPositions = [];
      for (let i = 0; i < rings; i++) {
        const y = -3 + (i + 1) * (height / (rings + 1));
        const r = 1.5 + Math.random() * 2.5;
        const ringGeo = new THREE.TorusGeometry(r, 0.04, 4, 36);
        const ring = thickEdges(ringGeo, i === 0 ? lineMatAmber : lineMat);
        ringGeo.dispose();
        ring.position.y = y;
        ring.rotation.x = Math.PI / 2;
        constructGroup.add(ring);
        // Small notches on each ring (8 around the perimeter)
        const notchPts = [];
        for (let n = 0; n < 8; n++) {
          const a = (n / 8) * Math.PI * 2;
          notchPts.push(
            new THREE.Vector3(Math.cos(a) * r, y, Math.sin(a) * r),
            new THREE.Vector3(Math.cos(a) * (r + 0.5), y, Math.sin(a) * (r + 0.5))
          );
        }
        constructGroup.add(thickSegment(notchPts, lineMatDim));
        ringPositions.push({ y, r });
      }
      // Diagonal struts between adjacent rings (every other)
      const strutPts = [];
      for (let i = 0; i < ringPositions.length - 1; i += 1) {
        const a = ringPositions[i];
        const b = ringPositions[i + 1];
        // 3 struts per gap, at different angles
        for (let s = 0; s < 3; s++) {
          const angA = (s / 3) * Math.PI * 2 + (i * 0.3);
          const angB = angA + 0.4;
          strutPts.push(
            new THREE.Vector3(Math.cos(angA) * a.r, a.y, Math.sin(angA) * a.r),
            new THREE.Vector3(Math.cos(angB) * b.r, b.y, Math.sin(angB) * b.r)
          );
        }
      }
      constructGroup.add(thickSegment(strutPts, lineMatDim));
      // Antenna stub
      constructGroup.add(thickSegment(
        [new THREE.Vector3(0, height - 3, 0), new THREE.Vector3(0, height - 3 + 3.5, 0)],
        lineMatAmber
      ));
    } else if (params.construct === 'gridcube') {
      // Massive subdivided cube — pure information lattice
      const size = 10;
      const subdivs = Math.max(4, Math.floor(10 * params.structureDensity + 2));
      // Outer frame (amber for contrast)
      const outerGeo = new THREE.BoxGeometry(size, size, size);
      const outer = thickEdges(outerGeo, lineMatAmber);
      outerGeo.dispose();
      outer.position.y = 2;
      constructGroup.add(outer);
      // Interior grid — three orthogonal sets of parallel lines
      const half = size / 2;
      const yCenter = 2;
      const gridPts = [];
      for (let i = 1; i < subdivs; i++) {
        const t = (i / subdivs) * size - half;
        // Lines along X axis (varying Y and Z)
        for (let j = 1; j < subdivs; j++) {
          const u = (j / subdivs) * size - half;
          gridPts.push(
            new THREE.Vector3(-half, yCenter + t, u),
            new THREE.Vector3(half, yCenter + t, u)
          );
        }
        // Lines along Y axis (varying X and Z)
        for (let j = 1; j < subdivs; j++) {
          const u = (j / subdivs) * size - half;
          gridPts.push(
            new THREE.Vector3(t, yCenter - half, u),
            new THREE.Vector3(t, yCenter + half, u)
          );
        }
        // Lines along Z axis (varying X and Y)
        for (let j = 1; j < subdivs; j++) {
          const u = (j / subdivs) * size - half;
          gridPts.push(
            new THREE.Vector3(t, yCenter + u, -half),
            new THREE.Vector3(t, yCenter + u, half)
          );
        }
      }
      constructGroup.add(thickSegment(gridPts, lineMatDim));
    } else if (params.construct === 'pyramid') {
      // Stepped pyramid with subdivision rings on each face
      const tiers = Math.max(4, Math.floor(7 * params.structureDensity + 2));
      const baseW = 12;
      const topW = 2;
      const heightPerTier = 1.4;
      for (let i = 0; i < tiers; i++) {
        const ratio = i / Math.max(1, tiers - 1);
        const w = baseW + (topW - baseW) * ratio;
        const wNext = baseW + (topW - baseW) * ((i + 1) / Math.max(1, tiers - 1));
        const yBot = -4 + i * heightPerTier;
        const yTop = yBot + heightPerTier;
        // Frustum: 8 vertices
        const halfW = w / 2, halfWn = wNext / 2;
        const frustumPts = [
          // bottom square edges
          new THREE.Vector3(-halfW, yBot, -halfW), new THREE.Vector3(halfW, yBot, -halfW),
          new THREE.Vector3(halfW, yBot, -halfW),  new THREE.Vector3(halfW, yBot, halfW),
          new THREE.Vector3(halfW, yBot, halfW),   new THREE.Vector3(-halfW, yBot, halfW),
          new THREE.Vector3(-halfW, yBot, halfW),  new THREE.Vector3(-halfW, yBot, -halfW),
          // top square edges
          new THREE.Vector3(-halfWn, yTop, -halfWn), new THREE.Vector3(halfWn, yTop, -halfWn),
          new THREE.Vector3(halfWn, yTop, -halfWn),  new THREE.Vector3(halfWn, yTop, halfWn),
          new THREE.Vector3(halfWn, yTop, halfWn),   new THREE.Vector3(-halfWn, yTop, halfWn),
          new THREE.Vector3(-halfWn, yTop, halfWn),  new THREE.Vector3(-halfWn, yTop, -halfWn),
          // vertical sides
          new THREE.Vector3(-halfW, yBot, -halfW), new THREE.Vector3(-halfWn, yTop, -halfWn),
          new THREE.Vector3(halfW, yBot, -halfW),  new THREE.Vector3(halfWn, yTop, -halfWn),
          new THREE.Vector3(halfW, yBot, halfW),   new THREE.Vector3(halfWn, yTop, halfWn),
          new THREE.Vector3(-halfW, yBot, halfW),  new THREE.Vector3(-halfWn, yTop, halfWn)
        ];
        constructGroup.add(thickSegment(frustumPts, i === tiers - 1 ? lineMatAmber : lineMat));
        // Subdivision rings on this tier — bands at mid-height
        const subdivCount = Math.max(2, Math.floor(w / 2));
        const midY = (yBot + yTop) / 2;
        const midW = (w + wNext) / 4;
        const subdivPts = [];
        for (let s = 1; s < subdivCount; s++) {
          const u = -midW + s * (2 * midW / subdivCount);
          // Front and back face horizontal subdivision lines
          subdivPts.push(
            new THREE.Vector3(u, midY, -midW), new THREE.Vector3(u, midY, midW)
          );
        }
        if (subdivPts.length) constructGroup.add(thickSegment(subdivPts, lineMatDim));
      }
      // Central spine
      constructGroup.add(thickSegment(
        [new THREE.Vector3(0, -4, 0), new THREE.Vector3(0, -4 + tiers * heightPerTier + 2, 0)],
        lineMatAmber
      ));
    } else if (params.construct === 'hub') {
      // Central node sphere with radial arms to satellite nodes
      const armCount = Math.max(6, Math.floor(12 * params.structureDensity + 2));
      // Central node
      const coreGeo = new THREE.IcosahedronGeometry(1.4, 0);
      const core = thickEdges(coreGeo, lineMatAmber);
      coreGeo.dispose();
      core.position.y = 2;
      constructGroup.add(core);
      // Radial arms at various angles
      for (let i = 0; i < armCount; i++) {
        // Distribute arms roughly evenly with random perturbation
        const phi = Math.acos(1 - 2 * ((i + 0.5) / armCount));
        const theta = Math.PI * (1 + Math.sqrt(5)) * i; // golden angle for spread
        const dist = 4 + Math.random() * 3;
        const endX = Math.sin(phi) * Math.cos(theta) * dist;
        const endY = Math.cos(phi) * dist;
        const endZ = Math.sin(phi) * Math.sin(theta) * dist;
        // Arm with 2-3 segment breakpoints
        const segPts = [];
        const breakCount = 2 + Math.floor(Math.random() * 2);
        let prev = new THREE.Vector3(0, 2, 0);
        for (let s = 1; s <= breakCount; s++) {
          const t = s / breakCount;
          const next = new THREE.Vector3(
            endX * t + (Math.random() - 0.5) * 0.3,
            2 + endY * t + (Math.random() - 0.5) * 0.3,
            endZ * t + (Math.random() - 0.5) * 0.3
          );
          segPts.push(prev, next);
          prev = next;
        }
        constructGroup.add(thickSegment(segPts, lineMat));
        // Satellite node at the end
        const satGeo = new THREE.OctahedronGeometry(0.35, 0);
        const sat = thickEdges(satGeo, i % 3 === 0 ? lineMatAmber : lineMatDim);
        satGeo.dispose();
        sat.position.set(endX, 2 + endY, endZ);
        constructGroup.add(sat);
      }
    } else if (params.construct === 'crystal') {
      // Stack of rhombic prisms (double pyramids) meeting at points
      const levels = Math.max(3, Math.floor(5 * params.structureDensity + 1));
      const totalH = 14;
      const gap = totalH / levels;
      for (let i = 0; i < levels; i++) {
        const ratio = (i + 0.5) / levels;
        // Largest in middle, taper outward — diamond shape across the stack
        const distFromCenter = Math.abs(ratio - 0.5) * 2; // 0 at middle, 1 at edges
        const r = 1.5 + (1 - distFromCenter) * 2.8;
        const h = gap * 0.85; // height of this bipyramid
        const yCenter = -4 + i * gap + gap / 2;
        // Bipyramid: top apex + 4 equator pts + bottom apex, 8 edges total
        const top = new THREE.Vector3(0, yCenter + h / 2, 0);
        const bot = new THREE.Vector3(0, yCenter - h / 2, 0);
        // Equator: rotate 45° offset per level for variety
        const rot = i * 0.25;
        const equator = [];
        for (let s = 0; s < 4; s++) {
          const a = (s / 4) * Math.PI * 2 + rot;
          equator.push(new THREE.Vector3(Math.cos(a) * r, yCenter, Math.sin(a) * r));
        }
        const pts = [];
        // Top apex to each equator point
        for (const e of equator) {
          pts.push(top, e);
          pts.push(bot, e);
        }
        // Equator quad edges
        for (let s = 0; s < 4; s++) {
          pts.push(equator[s], equator[(s + 1) % 4]);
        }
        constructGroup.add(thickSegment(pts, i === Math.floor(levels / 2) ? lineMatAmber : lineMat));
      }
      // Central vertical axis
      constructGroup.add(thickSegment(
        [new THREE.Vector3(0, -4, 0), new THREE.Vector3(0, -4 + totalH, 0)],
        lineMatDim
      ));
    } else {
      // Unknown shape — fallback to spire to be safe
      const geo = new THREE.IcosahedronGeometry(3, 0);
      const m = thickEdges(geo, lineMat);
      geo.dispose();
      m.position.y = 2;
      constructGroup.add(m);
    }

    scene.add(constructGroup);
  }
  buildConstruct();
  applyPalette(); // set initial CSS vars on stage element

      if (bleedEl) bleedEl.classList.remove('on');

  // category repeats ("ice ping :: 0.4kkm" vs "ice ping :: 0.7kkm") even
  // though the random values differ.
  function logKey(text) {
    const stripped = text.replace(/<[^>]*>/g, '');           // remove span markup
    const head = stripped.split('::')[0];                    // category prefix
    return head.replace(/[0-9.]/g, '').trim().toLowerCase();

    () => `STATUS · ${['CONTESTED','DARK','ABANDONED','SEALED','QUARANTINE','NOMINAL'][Math.floor(Math.random()*6)]}`,
    () => `ACCESS · ${['OPEN','RESTRICTED','BLACK','DENIED'][Math.floor(Math.random()*4)]}`
  ];
  function regionalLabelPair() {
    return [
      REGIONAL_PRIMARY[Math.floor(Math.random() * REGIONAL_PRIMARY.length)](),
      REGIONAL_SUB[Math.floor(Math.random() * REGIONAL_SUB.length)]()
    ];
  }

  // Annotations: each has { type, expireT, anchor (Vector3 world-space),
  // labelEl, leaderEl, dotEl, attachedTo (string: 'construct' or 'horizon:idx'),
  // localAnchor (Vector3 in attachedTo's local space) }
  const tacAnnotations = [];

  const _proj = new THREE.Vector3();
  function project3DToScreen(worldPos) {
    _proj.copy(worldPos).project(camera);
    const w = window.innerWidth, h = window.innerHeight;
    return {
      x: (_proj.x * 0.5 + 0.5) * w,
      y: (-_proj.y * 0.5 + 0.5) * h,
      onScreen: _proj.z < 1 && _proj.x > -1.2 && _proj.x < 1.2 && _proj.y > -1.2 && _proj.y < 1.2,
      depth: _proj.z
    };
  }

  // Per-annotation-type lifespan multipliers — applied AFTER the skewed roll.
  // Rings/subsystem flags are spatial *context* and should linger; face
  // highlights and edge tracers are momentary *attention* events.
  // Approach vectors sit in the middle. Vertex pips are quick.
  const TYPE_LIFE_MULT = {
    face: 0.8,
    edge: 0.7,
    vertex: 0.6,
    subsys: 2.2,
    approach: 1.4
  };

  // Pick a key from a weights map with probability proportional to its weight.
  // If all weights are 0 (or missing), returns fallback.
  function pickWeighted(weights, fallback) {
    let total = 0;
    for (const k in weights) total += Math.max(0, weights[k]);
    if (total <= 0) return fallback;
    let r = Math.random() * total;
    for (const k in weights) {
      const w = Math.max(0, weights[k]);
      if (r < w) return k;
      r -= w;
    }
    return fallback;
  }

  function rollLife(type) {
    const min = params.tacticalMinLife;
    const max = Math.max(min, params.tacticalMaxLife);
    const range = max - min;
    // Skewed sample: short-biased with a long tail.
    // k=1 → uniform; k>1 → biased toward min; k<1 → biased toward max.
    const u = Math.random();
    const skewed = Math.pow(u, Math.max(0.1, params.tacticalLifeSkew));
    let life = min + range * skewed;
    if (type && TYPE_LIFE_MULT[type] !== undefined) {
      life *= TYPE_LIFE_MULT[type];
    }
    // Don't let multipliers cap below a sensible floor
    return Math.max(0.4, life);
  }

  // Convert a local-space anchor + container object into a current world position
  const _tmpV = new THREE.Vector3();
  function resolveWorldAnchor(ann) {
    _tmpV.copy(ann.localAnchor);
    if (ann.attachedTo === 'construct' && constructGroup) {
      constructGroup.updateMatrixWorld();
      _tmpV.applyMatrix4(constructGroup.matrixWorld);
    } else if (ann.attachedTo && ann.attachedTo.startsWith('horizon:')) {
      const idx = parseInt(ann.attachedTo.split(':')[1]);
      const obj = horizonGroup.children[idx];
      if (obj) {
        obj.updateMatrixWorld();
        _tmpV.applyMatrix4(obj.matrixWorld);
      }
    }
    return _tmpV;
  }

  // Compute a screen-space offset position for the label such that it sits
  // outside the projected center of the construct (so it doesn't overlap).
  // Returns {labelX, labelY} given anchor screen position + a preferred direction.
  function pickLabelPosition(anchorScreen, dirHint) {
    // dirHint is one of 'NE','NW','SE','SW','N','S','E','W' or null
    const offsetDist = 60 + Math.random() * 40;
    let angle;
    const map = {
      'N': -Math.PI/2, 'NE': -Math.PI/4, 'E': 0, 'SE': Math.PI/4,
      'S': Math.PI/2, 'SW': 3*Math.PI/4, 'W': Math.PI, 'NW': -3*Math.PI/4
    };
    if (dirHint && map[dirHint] !== undefined) angle = map[dirHint];
    else angle = Math.random() * Math.PI * 2;
    return {
      x: anchorScreen.x + Math.cos(angle) * offsetDist,
      y: anchorScreen.y + Math.sin(angle) * offsetDist
    };
  }

  function makeLabel(text, sub, color, life) {
    const el = document.createElement('div');
    el.className = 'neuro-tac-label' + (color ? ' ' + color : '');
    el.style.setProperty('--tac-life', life.toFixed(2) + 's');
    el.innerHTML = sub ? `${text}<span class="sub">${sub}</span>` : text;
    tacLayer.appendChild(el);
    return el;
  }

  function makeLeader(color, life) {
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    line.setAttribute('class', 'neuro-tac-leader' + (color ? ' ' + color : ''));
    line.style.setProperty('--tac-life', life.toFixed(2) + 's');
    tacSvg.appendChild(line);
    const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    dot.setAttribute('class', 'neuro-tac-leader-dot' + (color ? ' ' + color : ''));
    dot.setAttribute('r', '2.5');
    dot.style.setProperty('--tac-life', life.toFixed(2) + 's');
    tacSvg.appendChild(dot);
    return { line, dot };
  }

  function disposeAnnotation(ann) {
    if (ann.labelEl) ann.labelEl.remove();
    if (ann.extraLabels) {
      ann.extraLabels.forEach(e => { if (e.el) e.el.remove(); });
    }
    if (ann.leader) {
      ann.leader.line.remove();
      ann.leader.dot.remove();
    }
    if (ann.leaderLine3D) {
      if (ann.leaderLine3D.parent) ann.leaderLine3D.parent.remove(ann.leaderLine3D);
      if (ann.leaderLine3D.geometry) ann.leaderLine3D.geometry.dispose();
    }
    if (ann.leaderMat3D) ann.leaderMat3D.dispose();
    if (ann.svgG) ann.svgG.remove();
    if (ann.worldObjects) {
      ann.worldObjects.forEach(o => {
        if (o.parent) o.parent.remove(o);
        o.traverse(child => {
          if (child.geometry) child.geometry.dispose();
        });
      });
    }
    if (ann.worldMats) {
      ann.worldMats.forEach(m => m.dispose());
    }
  }

  // === Annotation factories ===

  // Face highlight: glowing quad on a tier face of the data fortress / face of geo
  function spawnFaceHighlight(subject, t) {
    const life = rollLife('face');
    let localAnchor, faceLocalGeometry, dirHint;

    if (subject === 'construct' && params.construct === 'fortress') {
      // Pick a tier; place a quad on its FRONT face (+z) in local space, with
      // a tier-appropriate width/height.
      const tiers = constructGroup.children.filter(c => c.userData == null || true).slice(); // all
      // Quick heuristic: tier i height = i * 1.8 - 4, width = 12 - i*1.6
      const tierCount = Math.max(3, Math.floor(5 * params.structureDensity + 2));
      const i = Math.floor(Math.random() * tierCount);
      const w = 12 - i * 1.6;
      const tierY = i * 1.8 - 4;
      // Choose a face direction (front, back, left, right)
      const faceDirs = [
        { n: new THREE.Vector3(0,0,1), hint: 'E' },
        { n: new THREE.Vector3(0,0,-1), hint: 'W' },
        { n: new THREE.Vector3(1,0,0), hint: 'SE' },
        { n: new THREE.Vector3(-1,0,0), hint: 'SW' }
      ];
      const face = faceDirs[Math.floor(Math.random() * faceDirs.length)];
      dirHint = face.hint;
      const halfW = w / 2;
      const halfH = 0.7;
      // Anchor at the center of the chosen face
      localAnchor = new THREE.Vector3(face.n.x * halfW, tierY, face.n.z * halfW);

      // Build a phosphor-colored quad on this face
      const quadGeo = new THREE.BufferGeometry();
      // 4 corners in local space (build face vertices)
      const corners = [];
      if (face.n.z !== 0) {
        // front/back face — x/y plane
        const z = face.n.z * halfW;
        corners.push(
          -halfW * 0.85, tierY - halfH * 0.85, z * 1.005,
          halfW * 0.85, tierY - halfH * 0.85, z * 1.005,
          halfW * 0.85, tierY + halfH * 0.85, z * 1.005,
          -halfW * 0.85, tierY + halfH * 0.85, z * 1.005
        );
      } else {
        // left/right face — z/y plane
        const x = face.n.x * halfW;
        corners.push(
          x * 1.005, tierY - halfH * 0.85, -halfW * 0.85,
          x * 1.005, tierY - halfH * 0.85, halfW * 0.85,
          x * 1.005, tierY + halfH * 0.85, halfW * 0.85,
          x * 1.005, tierY + halfH * 0.85, -halfW * 0.85
        );
      }
      // Outline (4 segments)
      const positions = [
        corners[0], corners[1], corners[2],   corners[3], corners[4], corners[5],
        corners[3], corners[4], corners[5],   corners[6], corners[7], corners[8],
        corners[6], corners[7], corners[8],   corners[9], corners[10], corners[11],
        corners[9], corners[10], corners[11], corners[0], corners[1], corners[2]
      ];
      const lineGeo = new LineSegmentsGeometry();
      lineGeo.setPositions(positions);

      const faceMat = new LineMaterial({
        color: AMBER.getHex(),
        linewidth: 1.5,
        transparent: true,
        opacity: 0.95,
        worldUnits: false,
        alphaToCoverage: true
      });
      faceMat.resolution.set(window.innerWidth, window.innerHeight);
      const faceMesh = new LineSegments2(lineGeo, faceMat);
      constructGroup.add(faceMesh);

      const [text, sub] = pickLabel(FACE_LABELS);
      const label = `${text} :: TIER_${(i+1).toString().padStart(2,'0')}`;
      const subText = sub;
      const ann = createAnnotation({
        type: 'face',
        localAnchor,
        attachedTo: 'construct',
        worldObjects: [faceMesh],
        worldMats: [faceMat],
        labelText: label,
        subText,
        color: '',
        dirHint,
        life,
        expireT: t + life
      });
      return ann;
    } else if (subject === 'construct') {
      // Generic shell — pick a point on the surface as an "icon point"
      // Per-shape radius hints (and Y offset hints) for sensible placement
      let r, yOffset = 2, yRange = 4;
      switch (params.construct) {
        case 'lattice': r = 6; break;
        case 'spire': r = 3; yRange = 10; break;
        case 'ringtower': r = 3; yRange = 10; break;
        case 'gridcube': r = 5; break;
        case 'pyramid': r = 5; yRange = 8; yOffset = 0; break;
        case 'hub': r = 5; break;
        case 'crystal': r = 3; yRange = 10; break;
        default: r = 4; break;
      }
      const theta = Math.random() * Math.PI * 2;
      const phi = (Math.random() - 0.5) * Math.PI;
      localAnchor = new THREE.Vector3(
        Math.cos(theta) * Math.cos(phi) * r,
        yOffset + Math.sin(phi) * (yRange / 2),
        Math.sin(theta) * Math.cos(phi) * r
      );
      const [text, sub] = pickLabel(FACE_LABELS);
      return createAnnotation({
        type: 'face',
        localAnchor,
        attachedTo: 'construct',
        labelText: text,
        subText: sub,
        color: '',
        life,
        expireT: t + life
      });
    }
  }

  // Vertex pip: small phosphor dot at a vertex with leader to label
  function spawnVertexPip(subject, t) {
    const life = rollLife('vertex');
    let localAnchor;
    let attachedTo;
    let scale = 1;

    if (subject === 'construct') {
      // Pick a vertex of the construct based on shape
      if (params.construct === 'fortress') {
        const tiers = Math.max(3, Math.floor(5 * params.structureDensity + 2));
        const i = Math.floor(Math.random() * tiers);
        const w = (12 - i * 1.6) / 2;
        const tierY = i * 1.8 - 4;
        // pick one of 8 corners
        const corner = Math.floor(Math.random() * 8);
        const xs = [-w, w, w, -w, -w, w, w, -w];
        const ys = [-0.7, -0.7, -0.7, -0.7, 0.7, 0.7, 0.7, 0.7];
        const zs = [-w, -w, w, w, -w, -w, w, w];
        localAnchor = new THREE.Vector3(xs[corner], tierY + ys[corner], zs[corner]);
      } else if (params.construct === 'lattice') {
        const levels = Math.max(2, Math.floor(4 * params.structureDensity + 1));
        const i = Math.floor(Math.random() * levels);
        const r = 3 + i * 2.5;
        // octahedron vertex: ±x or ±y or ±z
        const axis = Math.floor(Math.random() * 6);
        const v = [
          [r,0,0],[-r,0,0],[0,r,0],[0,-r,0],[0,0,r],[0,0,-r]
        ][axis];
        localAnchor = new THREE.Vector3(v[0], v[1] + 2, v[2]);
      } else if (params.construct === 'spire') {
        const segments = Math.max(4, Math.floor(8 * params.structureDensity + 3));
        const i = Math.floor(Math.random() * segments);
        const r = 4 - (i / segments) * 3.2;
        const theta = Math.random() * Math.PI * 2;
        localAnchor = new THREE.Vector3(
          Math.cos(theta) * r,
          i * 2.5 - 3,
          Math.sin(theta) * r
        );
      } else if (params.construct === 'ringtower') {
        // Pick a notch point on one of the rings
        const rings = Math.max(4, Math.floor(7 * params.structureDensity + 2));
        const i = Math.floor(Math.random() * rings);
        const height = 14;
        const y = -3 + (i + 1) * (height / (rings + 1));
        const r = 2.5; // average ring radius (we don't store actuals)
        const notch = Math.floor(Math.random() * 8);
        const a = (notch / 8) * Math.PI * 2;
        localAnchor = new THREE.Vector3(Math.cos(a) * r, y, Math.sin(a) * r);
      } else if (params.construct === 'gridcube') {
        // Pick one of the 8 corners of the outer frame, or a subdivision vertex
        const useCorner = Math.random() < 0.4;
        const half = 5;
        const yC = 2;
        if (useCorner) {
          const c = Math.floor(Math.random() * 8);
          const xs = [-half, half, half, -half, -half, half, half, -half];
          const ys = [-half, -half, -half, -half, half, half, half, half];
          const zs = [-half, -half, half, half, -half, -half, half, half];
          localAnchor = new THREE.Vector3(xs[c], yC + ys[c], zs[c]);
        } else {
          // Subdivision lattice point on the surface
          const subdivs = 6;
          const t = (Math.floor(Math.random() * (subdivs + 1)) / subdivs) * 2 * half - half;
          const u = (Math.floor(Math.random() * (subdivs + 1)) / subdivs) * 2 * half - half;
          const face = Math.floor(Math.random() * 6);
          if (face === 0) localAnchor = new THREE.Vector3(half, yC + t, u);
          else if (face === 1) localAnchor = new THREE.Vector3(-half, yC + t, u);
          else if (face === 2) localAnchor = new THREE.Vector3(t, yC + half, u);
          else if (face === 3) localAnchor = new THREE.Vector3(t, yC - half, u);
          else if (face === 4) localAnchor = new THREE.Vector3(t, yC + u, half);
          else localAnchor = new THREE.Vector3(t, yC + u, -half);
        }
      } else if (params.construct === 'pyramid') {
        const tiers = Math.max(4, Math.floor(7 * params.structureDensity + 2));
        const i = Math.floor(Math.random() * tiers);
        const ratio = i / Math.max(1, tiers - 1);
        const w = (12 + (2 - 12) * ratio) / 2;
        const yBot = -4 + i * 1.4;
        const corner = Math.floor(Math.random() * 4);
        const xs = [-w, w, w, -w];
        const zs = [-w, -w, w, w];
        localAnchor = new THREE.Vector3(xs[corner], yBot, zs[corner]);
      } else if (params.construct === 'hub') {
        // Pick a satellite end position — approximate from the deterministic
        // distribution used at build time
        const armCount = Math.max(6, Math.floor(12 * params.structureDensity + 2));
        const i = Math.floor(Math.random() * armCount);
        const phi = Math.acos(1 - 2 * ((i + 0.5) / armCount));
        const theta = Math.PI * (1 + Math.sqrt(5)) * i;
        const dist = 5.5; // average — actual is 4-7
        localAnchor = new THREE.Vector3(
          Math.sin(phi) * Math.cos(theta) * dist,
          2 + Math.cos(phi) * dist,
          Math.sin(phi) * Math.sin(theta) * dist
        );
      } else if (params.construct === 'crystal') {
        const levels = Math.max(3, Math.floor(5 * params.structureDensity + 1));
        const i = Math.floor(Math.random() * levels);
        const totalH = 14;
        const gap = totalH / levels;
        const yCenter = -4 + i * gap + gap / 2;
        const ratio = (i + 0.5) / levels;
        const distFromCenter = Math.abs(ratio - 0.5) * 2;
        const r = 1.5 + (1 - distFromCenter) * 2.8;
        // Pick top apex, bottom apex, or one of 4 equator pts
        const v = Math.floor(Math.random() * 6);
        const h = gap * 0.85;
        if (v === 0) localAnchor = new THREE.Vector3(0, yCenter + h / 2, 0);
        else if (v === 1) localAnchor = new THREE.Vector3(0, yCenter - h / 2, 0);
        else {
          const rot = i * 0.25;
          const a = ((v - 2) / 4) * Math.PI * 2 + rot;
          localAnchor = new THREE.Vector3(Math.cos(a) * r, yCenter, Math.sin(a) * r);
        }
      } else {
        // Unknown construct — surface fallback
        const theta = Math.random() * Math.PI * 2;
        localAnchor = new THREE.Vector3(Math.cos(theta) * 4, 2 + (Math.random() - 0.5) * 4, Math.sin(theta) * 4);
      }
      attachedTo = 'construct';
    } else { // horizon
      const idx = pickVisibleHorizonIdx();
      if (idx < 0) return null;
      const obj = horizonGroup.children[idx];
      const h = obj.userData.height;
      // pick a corner of the building (8 corners)
      const corner = Math.floor(Math.random() * 8);
      // We don't know exact w/d, approximate from height (we know dims pattern)
      // The mesh has BoxGeometry baked in — use bounding-box approximate (3 unit half-extent)
      const hw = 3, hd = 3;
      const xs = [-hw, hw, hw, -hw, -hw, hw, hw, -hw];
      const ys = [-h/2, -h/2, -h/2, -h/2, h/2, h/2, h/2, h/2];
      const zs = [-hd, -hd, hd, hd, -hd, -hd, hd, hd];
      localAnchor = new THREE.Vector3(xs[corner], ys[corner], zs[corner]);
      attachedTo = 'horizon:' + idx;
      scale = 0.8;
    }

    const [text, sub] = pickLabel(VERTEX_LABELS);
    return createAnnotation({
      type: 'vertex',
      localAnchor,
      attachedTo,
      labelText: text,
      subText: sub,
      color: 'phos',
      life,
      expireT: t + life
    });
  }

  // Subsystem ring: a torus drawn around a tier or building, with hanging label
  function spawnSubsysFlag(subject, t) {
    const life = rollLife('subsys');
    let localAnchor, attachedTo;

    // Helper: build a horizontal ring at (cx, y, cz) with radius r, return mesh + material
    function buildSubsysRing(cx, y, cz, r) {
      const ringSegments = 48;
      const positions = [];
      for (let s = 0; s < ringSegments; s++) {
        const a1 = (s / ringSegments) * Math.PI * 2;
        const a2 = ((s + 1) / ringSegments) * Math.PI * 2;
        positions.push(
          cx + Math.cos(a1) * r, y, cz + Math.sin(a1) * r,
          cx + Math.cos(a2) * r, y, cz + Math.sin(a2) * r
        );
      }
      const ringGeo = new LineSegmentsGeometry();
      ringGeo.setPositions(positions);
      const ringMat = new LineMaterial({
        color: AMBER.getHex(),
        linewidth: 1.3,
        transparent: true,
        opacity: 0.85,
        worldUnits: false,
        alphaToCoverage: true
      });
      ringMat.resolution.set(window.innerWidth, window.innerHeight);
      const ringMesh = new LineSegments2(ringGeo, ringMat);
      return { mesh: ringMesh, mat: ringMat };
    }

    if (subject === 'construct') {
      // Anchor at a random tier center, encircle it with a ring
      if (params.construct === 'fortress') {
        const tiers = Math.max(3, Math.floor(5 * params.structureDensity + 2));
        const i = Math.floor(Math.random() * tiers);
        const w = (12 - i * 1.6);
        const tierY = i * 1.8 - 4;
        localAnchor = new THREE.Vector3(0, tierY, 0);
        const ring = buildSubsysRing(0, tierY, 0, w * 0.85);
        constructGroup.add(ring.mesh);

        const [text, sub] = pickLabel(SUBSYS_LABELS);
        return createAnnotation({
          type: 'subsys',
          localAnchor: new THREE.Vector3(0, tierY + 0.7, w * 0.85),
          attachedTo: 'construct',
          worldObjects: [ring.mesh],
          worldMats: [ring.mat],
          labelText: text,
          subText: sub,
          color: '',
          life,
          expireT: t + life
        });
      } else if (params.construct === 'lattice') {
        const levels = Math.max(2, Math.floor(4 * params.structureDensity + 1));
        const i = Math.floor(Math.random() * levels);
        const r = 3 + i * 2.5;
        localAnchor = new THREE.Vector3(r * 0.95, 2, 0);
        const [text, sub] = pickLabel(SUBSYS_LABELS);
        return createAnnotation({
          type: 'subsys',
          localAnchor,
          attachedTo: 'construct',
          labelText: text,
          subText: `${sub} · LVL_${i+1}`,
          color: '',
          life,
          expireT: t + life
        });
      } else if (params.construct === 'spire') {
        const segments = Math.max(4, Math.floor(8 * params.structureDensity + 3));
        const i = Math.floor(Math.random() * segments);
        const r = 4 - (i / segments) * 3.2;
        localAnchor = new THREE.Vector3(r * 1.4, i * 2.5 - 3, 0);
        const [text, sub] = pickLabel(SUBSYS_LABELS);
        return createAnnotation({
          type: 'subsys',
          localAnchor,
          attachedTo: 'construct',
          labelText: text,
          subText: `${sub} · SEG_${i+1}`,
          color: '',
          life,
          expireT: t + life
        });
      } else if (params.construct === 'ringtower') {
        const rings = Math.max(4, Math.floor(7 * params.structureDensity + 2));
        const i = Math.floor(Math.random() * rings);
        const height = 14;
        const y = -3 + (i + 1) * (height / (rings + 1));
        const r = 3.5;
        const ring = buildSubsysRing(0, y, 0, r);
        constructGroup.add(ring.mesh);
        const [text, sub] = pickLabel(SUBSYS_LABELS);
        return createAnnotation({
          type: 'subsys',
          localAnchor: new THREE.Vector3(0, y + 0.5, r),
          attachedTo: 'construct',
          worldObjects: [ring.mesh],
          worldMats: [ring.mat],
          labelText: text,
          subText: `${sub} · TIER_${i+1}`,
          color: '',
          life,
          expireT: t + life
        });
      } else if (params.construct === 'gridcube') {
        // Encircle the whole cube horizontally at a random Y
        const yC = 2;
        const half = 5;
        const y = yC + (Math.random() - 0.5) * half * 1.6;
        const ring = buildSubsysRing(0, y, 0, half * 1.15);
        constructGroup.add(ring.mesh);
        const [text, sub] = pickLabel(SUBSYS_LABELS);
        return createAnnotation({
          type: 'subsys',
          localAnchor: new THREE.Vector3(0, y + 0.5, half * 1.15),
          attachedTo: 'construct',
          worldObjects: [ring.mesh],
          worldMats: [ring.mat],
          labelText: text,
          subText: sub,
          color: '',
          life,
          expireT: t + life
        });
      } else if (params.construct === 'pyramid') {
        const tiers = Math.max(4, Math.floor(7 * params.structureDensity + 2));
        const i = Math.floor(Math.random() * tiers);
        const ratio = i / Math.max(1, tiers - 1);
        const w = (12 + (2 - 12) * ratio);
        const y = -4 + i * 1.4 + 0.7;
        const ring = buildSubsysRing(0, y, 0, w * 0.6);
        constructGroup.add(ring.mesh);
        const [text, sub] = pickLabel(SUBSYS_LABELS);
        return createAnnotation({
          type: 'subsys',
          localAnchor: new THREE.Vector3(0, y + 0.5, w * 0.6),
          attachedTo: 'construct',
          worldObjects: [ring.mesh],
          worldMats: [ring.mat],
          labelText: text,
          subText: `${sub} · TIER_${i+1}`,
          color: '',
          life,
          expireT: t + life
        });
      } else if (params.construct === 'hub') {
        // Encircle the hub at the equator
        const ring = buildSubsysRing(0, 2, 0, 5.5);
        constructGroup.add(ring.mesh);
        const [text, sub] = pickLabel(SUBSYS_LABELS);
        return createAnnotation({
          type: 'subsys',
          localAnchor: new THREE.Vector3(0, 2.5, 5.5),
          attachedTo: 'construct',
          worldObjects: [ring.mesh],
          worldMats: [ring.mat],
          labelText: text,
          subText: sub,
          color: '',
          life,
          expireT: t + life
        });
      } else if (params.construct === 'crystal') {
        const levels = Math.max(3, Math.floor(5 * params.structureDensity + 1));
        const i = Math.floor(Math.random() * levels);
        const totalH = 14;
        const gap = totalH / levels;
        const yCenter = -4 + i * gap + gap / 2;
        const ratio = (i + 0.5) / levels;
        const distFromCenter = Math.abs(ratio - 0.5) * 2;
        const r = 1.5 + (1 - distFromCenter) * 2.8;
        const ring = buildSubsysRing(0, yCenter, 0, r * 1.1);
        constructGroup.add(ring.mesh);
        const [text, sub] = pickLabel(SUBSYS_LABELS);
        return createAnnotation({
          type: 'subsys',
          localAnchor: new THREE.Vector3(0, yCenter + 0.5, r * 1.1),
          attachedTo: 'construct',
          worldObjects: [ring.mesh],
          worldMats: [ring.mat],
          labelText: text,
          subText: `${sub} · LVL_${i+1}`,
          color: '',
          life,
          expireT: t + life
        });
      } else {
        // Unknown — generic label without ring
        const [text, sub] = pickLabel(SUBSYS_LABELS);
        return createAnnotation({
          type: 'subsys',
          localAnchor: new THREE.Vector3(4, 2, 0),
          attachedTo: 'construct',
          labelText: text,
          subText: sub,
          color: '',
          life,
          expireT: t + life
        });
      }
    } else {
      // Horizon — flag a building
      const idx = pickVisibleHorizonIdx();
      if (idx < 0) return null;
      const obj = horizonGroup.children[idx];
      localAnchor = new THREE.Vector3(0, obj.userData.height / 4, 0);
      attachedTo = 'horizon:' + idx;
      const [text, sub] = pickLabel(SUBSYS_LABELS);
      const subject_codename = HORIZON_SUBJECTS[Math.floor(Math.random() * HORIZON_SUBJECTS.length)];
      return createAnnotation({
        type: 'subsys',
        localAnchor,
        attachedTo,
        labelText: `${subject_codename}_${idx.toString().padStart(2,'0')}`,
        subText: `${sub}`,
        color: '',
        life,
        expireT: t + life
      });
    }
  }

  // Edge tracer: bright line drawn along a construct edge, with leader to label
  function spawnEdgeTracer(subject, t) {
    if (subject !== 'construct') return spawnVertexPip(subject, t);
    const life = rollLife('edge');
    let v1, v2;

    if (params.construct === 'fortress') {
      const tiers = Math.max(3, Math.floor(5 * params.structureDensity + 2));
      const i = Math.floor(Math.random() * tiers);
      const w = (12 - i * 1.6) / 2;
      const tierY = i * 1.8 - 4;
      // pick one of the 4 vertical edges of this tier
      const corner = Math.floor(Math.random() * 4);
      const xs = [-w, w, w, -w];
      const zs = [-w, -w, w, w];
      v1 = new THREE.Vector3(xs[corner], tierY - 0.7, zs[corner]);
      v2 = new THREE.Vector3(xs[corner], tierY + 0.7, zs[corner]);
    } else if (params.construct === 'gridcube') {
      // Pick a random subdivision line segment along an axis
      const half = 5;
      const yC = 2;
      const subdivs = 6;
      const t1 = (Math.floor(Math.random() * (subdivs + 1)) / subdivs) * 2 * half - half;
      const u1 = (Math.floor(Math.random() * (subdivs + 1)) / subdivs) * 2 * half - half;
      const axis = Math.floor(Math.random() * 3);
      if (axis === 0) {
        v1 = new THREE.Vector3(-half, yC + t1, u1);
        v2 = new THREE.Vector3(half, yC + t1, u1);
      } else if (axis === 1) {
        v1 = new THREE.Vector3(t1, yC - half, u1);
        v2 = new THREE.Vector3(t1, yC + half, u1);
      } else {
        v1 = new THREE.Vector3(t1, yC + u1, -half);
        v2 = new THREE.Vector3(t1, yC + u1, half);
      }
    } else if (params.construct === 'pyramid') {
      // Pick a slope edge between adjacent tiers
      const tiers = Math.max(4, Math.floor(7 * params.structureDensity + 2));
      const i = Math.floor(Math.random() * (tiers - 1));
      const r1 = i / Math.max(1, tiers - 1);
      const r2 = (i + 1) / Math.max(1, tiers - 1);
      const w1 = (12 + (2 - 12) * r1) / 2;
      const w2 = (12 + (2 - 12) * r2) / 2;
      const y1 = -4 + i * 1.4;
      const y2 = -4 + (i + 1) * 1.4;
      const c = Math.floor(Math.random() * 4);
      const xs1 = [-w1, w1, w1, -w1], zs1 = [-w1, -w1, w1, w1];
      const xs2 = [-w2, w2, w2, -w2], zs2 = [-w2, -w2, w2, w2];
      v1 = new THREE.Vector3(xs1[c], y1, zs1[c]);
      v2 = new THREE.Vector3(xs2[c], y2, zs2[c]);
    } else if (params.construct === 'crystal') {
      // Trace one of the bipyramid edges (apex → equator)
      const levels = Math.max(3, Math.floor(5 * params.structureDensity + 1));
      const i = Math.floor(Math.random() * levels);
      const totalH = 14;
      const gap = totalH / levels;
      const yC = -4 + i * gap + gap / 2;
      const h = gap * 0.85;
      const ratio = (i + 0.5) / levels;
      const distFromCenter = Math.abs(ratio - 0.5) * 2;
      const r = 1.5 + (1 - distFromCenter) * 2.8;
      const apex = Math.random() < 0.5;
      const rot = i * 0.25;
      const s = Math.floor(Math.random() * 4);
      const a = (s / 4) * Math.PI * 2 + rot;
      v1 = new THREE.Vector3(0, apex ? yC + h / 2 : yC - h / 2, 0);
      v2 = new THREE.Vector3(Math.cos(a) * r, yC, Math.sin(a) * r);
    } else {
      // generic — just pick a short segment near construct surface
      const r = 4;
      const a = Math.random() * Math.PI * 2;
      v1 = new THREE.Vector3(Math.cos(a) * r, Math.random() * 4 - 2, Math.sin(a) * r);
      v2 = v1.clone().add(new THREE.Vector3(0, 1.5, 0));
    }

    // Build bright LineSegments2 along this edge
    const positions = [v1.x, v1.y, v1.z, v2.x, v2.y, v2.z];
    const lineGeo = new LineSegmentsGeometry();
    lineGeo.setPositions(positions);
    const lineMat = new LineMaterial({
      color: AMBER.getHex(),
      linewidth: 3,
      transparent: true,
      opacity: 1.0,
      worldUnits: false,
      alphaToCoverage: true
    });
    lineMat.resolution.set(window.innerWidth, window.innerHeight);
    const tracer = new LineSegments2(lineGeo, lineMat);
    constructGroup.add(tracer);

    const length = v1.distanceTo(v2);
    const labelAnchor = v1.clone().lerp(v2, 0.5);

    // Edge label variety — mix structural readouts with measured length
    const EDGE_LABELS = [
      // Geometric measurements
      ['EDGE LEN', `${length.toFixed(2)}u`],
      ['SPAN', `${length.toFixed(2)}u`],
      ['VECTOR LEN', `${length.toFixed(3)}u`],
      ['GEODESIC', `${length.toFixed(2)}u · MIN`],
      // Structural
      ['STRESS LINE', `σ_${rand4Hex()}`],
      ['LOAD BEARING', `${(length * 38).toFixed(0)}kN`],
      ['FRACT EDGE', `MODE_${Math.floor(Math.random()*5)+1}`],
      ['FAULT LINE', `RISK_${rand4Hex()}`],
      ['SHEAR', `τ_${Math.floor(Math.random()*99)}MPa`],
      // Data-flow
      ['DATA PATH', `BW_${(Math.random()*99).toFixed(1)}Gb`],
      ['BUS LANE', `LANE_${Math.floor(Math.random()*16)}`],
      ['FIBER RUN', `FIB_${rand4Hex()}`],
      ['CONDUIT', `CH_${Math.floor(Math.random()*99)}`],
      // Security
      ['ICE BOUNDARY', `RING_${Math.floor(Math.random()*9)+1}`],
      ['PERIM EDGE', `SEG_${Math.floor(Math.random()*99)}`],
      ['FIREWALL EDGE', `R_${rand4Hex()}`],
      // Thermal / physical
      ['THERMAL EDGE', `Δ${Math.floor(Math.random()*199)}K`],
      ['HEAT GRADIENT', `${(Math.random()*8).toFixed(1)}K/u`],
      ['VIBE NODE', `${(8 + Math.random()*20).toFixed(1)}Hz`],
      // Trajectory / vector hints
      ['CHORD', `${length.toFixed(2)}u`],
      ['BISECTOR', `θ_${Math.floor(Math.random()*180)}°`],
      ['TANGENT', `t_${rand4Hex()}`],
      // Symbolic / dread
      ['BLEED EDGE', `LEAK_${rand4Hex()}`],
      ['GHOST EDGE', `NULL_${rand4Hex()}`],
      ['DECAY VECTOR', `t+${Math.floor(Math.random()*999)}`]
    ];
    const [text, sub] = EDGE_LABELS[Math.floor(Math.random() * EDGE_LABELS.length)];

    return createAnnotation({
      type: 'edge',
      localAnchor: labelAnchor,
      attachedTo: 'construct',
      worldObjects: [tracer],
      worldMats: [lineMat],
      labelText: text,
      subText: sub,
      color: '',
      life,
      expireT: t + life
    });
  }

  // Approach vector: short arrow OUTSIDE the construct pointing inward, with heading
  function spawnApproachVector(t) {
    const life = rollLife('approach');
    const angle = Math.random() * Math.PI * 2;
    const r = 14; // outside the construct
    const startWorld = new THREE.Vector3(Math.cos(angle) * r, 1 + Math.random() * 3, Math.sin(angle) * r);
    const endWorld = startWorld.clone().multiplyScalar(0.65); // toward center

    // Draw arrow (just a line — keep it lean)
    const positions = [startWorld.x, startWorld.y, startWorld.z, endWorld.x, endWorld.y, endWorld.z];
    // small arrowhead: two short segments at the tip
    const tipDir = endWorld.clone().sub(startWorld).normalize();
    const perp = new THREE.Vector3(-tipDir.z, 0, tipDir.x).multiplyScalar(0.6);
    const back = tipDir.clone().multiplyScalar(-0.9);
    const wing1 = endWorld.clone().add(back).add(perp);
    const wing2 = endWorld.clone().add(back).sub(perp);
    positions.push(endWorld.x, endWorld.y, endWorld.z, wing1.x, wing1.y, wing1.z);
    positions.push(endWorld.x, endWorld.y, endWorld.z, wing2.x, wing2.y, wing2.z);

    const lineGeo = new LineSegmentsGeometry();
    lineGeo.setPositions(positions);
    const lineMat = new LineMaterial({
      color: AMBER.getHex(),
      linewidth: 1.8,
      transparent: true,
      opacity: 0.9,
      worldUnits: false,
      alphaToCoverage: true
    });
    lineMat.resolution.set(window.innerWidth, window.innerHeight);
    const arrow = new LineSegments2(lineGeo, lineMat);
    tacWorldGroup.add(arrow); // free-floating in world space, not parented to construct

    const heading = ((angle * 180 / Math.PI) + 360) % 360;
    const range = (Math.random() * 0.5 + 0.04).toFixed(3);
    const label = APPROACH_LABELS[Math.floor(Math.random() * APPROACH_LABELS.length)];

    // Anchor label at the tail of the arrow (outside-pointing end)
    return createAnnotation({
      type: 'approach',
      localAnchor: startWorld.clone(),
      attachedTo: 'world', // world-space, no parent transform
      worldObjects: [arrow],
      worldMats: [lineMat],
      isFreeWorld: true,
      labelText: label,
      subText: `${heading.toFixed(1)}° · ${range}kkm`,
      color: '',
      life,
      expireT: t + life
    });
  }

  // === ATTACK VECTOR — sequentially-lit 3D frame tunnel ===
  // A chain of rectangular frames in world space, anchored to a point on the
  // construct, piercing inward along an approach path. Frames light up in
  // sequence; the terminal frame pulse-locks. Reads as an angle of attack.
  function spawnAttackVector(t) {
