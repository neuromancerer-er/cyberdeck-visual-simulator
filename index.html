  function genTerrainContent() {
    return {
      primary: TERRAIN_PRIMARY_TEMPLATES[Math.floor(Math.random() * TERRAIN_PRIMARY_TEMPLATES.length)](),
      sub: TERRAIN_SUB_TEMPLATES[Math.floor(Math.random() * TERRAIN_SUB_TEMPLATES.length)](),
      tertiary: TERRAIN_STATUS_TEMPLATES[Math.floor(Math.random() * TERRAIN_STATUS_TEMPLATES.length)]()
    };
  }

  function spawnTerrainLabel(t) {
    if (!constructGroup) return null;
    const lifeMin = params.terrainMinLife;
    const lifeMax = Math.max(lifeMin, params.terrainMaxLife);
    const life = lifeMin + Math.random() * (lifeMax - lifeMin);

    // Anchor on construct geometry
    const localAnchor = pickConstructLocalPoint();

    // Build the label DOM manually (3 lines, typewriter)
    const content = genTerrainContent();
    const el = document.createElement('div');
    el.className = 'neuro-tac-label neuro-terrain-label';
    // Use the longest life — don't apply the CSS auto-fade animation since
    // we manage opacity in JS for the slow ambient fade
    el.style.opacity = '0';
    const primaryEl = document.createElement('div');
    primaryEl.className = 'terrain-primary';
    const subEl = document.createElement('div');
    subEl.className = 'sub terrain-sub';
    const tertEl = document.createElement('div');
    tertEl.className = 'sub terrain-tert';
    el.appendChild(primaryEl);
    el.appendChild(subEl);
    el.appendChild(tertEl);
    tacLayer.appendChild(el);

    const ann = {
      type: 'terrain',
      isTerrainLabel: true,
      localAnchor,
      labelEl: el,
      primaryEl, subEl, tertEl,
      content,
      // Each typed line tracks its current revealed character count
      primaryTyped: 0, subTyped: 0, tertTyped: 0,
      lineStartT: { primary: clock.elapsedTime, sub: null, tert: null },
      labelOffset: null,
      bornT: clock.elapsedTime,
      life,
      expireT: t + life
    };
    tacAnnotations.push(ann);
    return ann;
  }

  // Per-frame updater for terrain labels
  function updateTerrainLabel(ann, t) {
    const age = t - ann.bornT;
    const remaining = ann.expireT - t;

    // Slow ambient envelope: 2.5s fade in, 4s fade out
    const fadeIn = 2.5;
    const fadeOut = 4.0;
    const inP = Math.min(1, age / fadeIn);
    const outP = Math.min(1, remaining / fadeOut);
    const envOp = Math.max(0, Math.min(inP, outP)) * params.terrainOpacity;

    // Typewriter logic: type each line in sequence
    const msPerChar = params.terrainTypeMs;
    // Primary
    const pTarget = ann.content.primary.length;
    if (ann.primaryTyped < pTarget) {
      const dt = (t - ann.lineStartT.primary) * 1000;
      const target = Math.min(pTarget, Math.floor(dt / msPerChar));
      if (target > ann.primaryTyped) {
        ann.primaryTyped = target;
        ann.primaryEl.textContent = ann.content.primary.substring(0, target);
      }
      if (ann.primaryTyped >= pTarget && !ann.lineStartT.sub) {
        ann.lineStartT.sub = t + 0.2; // small pause before next line
      }
    }
    // Sub
    if (ann.lineStartT.sub && t >= ann.lineStartT.sub) {
      const sTarget = ann.content.sub.length;
      if (ann.subTyped < sTarget) {
        const dt = (t - ann.lineStartT.sub) * 1000;
        const target = Math.min(sTarget, Math.floor(dt / msPerChar));
        if (target > ann.subTyped) {
          ann.subTyped = target;
          ann.subEl.textContent = ann.content.sub.substring(0, target);
        }
        if (ann.subTyped >= sTarget && !ann.lineStartT.tert) {
          ann.lineStartT.tert = t + 0.2;
        }
      }
    }
    // Tertiary
    if (ann.lineStartT.tert && t >= ann.lineStartT.tert) {
      const tTarget = ann.content.tertiary.length;
      if (ann.tertTyped < tTarget) {
        const dt = (t - ann.lineStartT.tert) * 1000;
        const target = Math.min(tTarget, Math.floor(dt / msPerChar));
        if (target > ann.tertTyped) {
          ann.tertTyped = target;
          ann.tertEl.textContent = ann.content.tertiary.substring(0, target);
        }
      }
    }

    // Project anchor and position the label
    constructGroup.updateMatrixWorld();
    const worldAnchor = ann.localAnchor.clone().applyMatrix4(constructGroup.matrixWorld);
    const proj = project3DToScreen(worldAnchor);
    if (!proj.onScreen) {
      ann.labelEl.style.display = 'none';
      return;
    }
    ann.labelEl.style.display = '';
    ann.labelEl.style.opacity = envOp;

    if (!ann.labelOffset) {
      const w = window.innerWidth, h = window.innerHeight;
      const dxc = proj.x - w / 2, dyc = proj.y - h / 2;
      const ang = Math.atan2(dyc, dxc);
      // Push terrain labels further out than tactical labels so they sit in
      // the ambient periphery rather than crowding the construct
      ann.labelOffset = {
        dx: Math.cos(ang) * 140,
        dy: Math.sin(ang) * 110
      };
    }
    ann.labelEl.style.left = (proj.x + ann.labelOffset.dx) + 'px';
    ann.labelEl.style.top = (proj.y + ann.labelOffset.dy) + 'px';
  }

  // === COMPOSITE ANNOTATIONS — SVG-based, screen-space ===

  // Compute the screen-space bounding rect of an object by projecting a
  // sampling of its world-space test points. Returns { cx, cy, halfW, halfH }
  // where halfW/halfH are half the screen-space extent.
  function computeProjectedBounds(samplePoints) {
    // samplePoints: array of THREE.Vector3 (already in world space)
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    let anyOnScreen = false;
    let avgX = 0, avgY = 0, n = 0;
    for (const p of samplePoints) {
      const proj = project3DToScreen(p);
      if (proj.onScreen) anyOnScreen = true;
      minX = Math.min(minX, proj.x);
      maxX = Math.max(maxX, proj.x);
      minY = Math.min(minY, proj.y);
      maxY = Math.max(maxY, proj.y);
      avgX += proj.x; avgY += proj.y; n++;
    }
    if (n === 0 || !isFinite(minX)) return null;
    return {
      cx: (minX + maxX) / 2,
      cy: (minY + maxY) / 2,
      halfW: (maxX - minX) / 2,
      halfH: (maxY - minY) / 2,
      onScreen: anyOnScreen
    };
  }

  // Sample world-space points that roughly bound the construct based on its
  // current shape. Returns an array of Vector3 in world space (post-rotation).
  function sampleConstructBounds() {
    const pts = [];
    if (!constructGroup) return pts;
    constructGroup.updateMatrixWorld();
    // Generate canonical local-space corner-ish points based on construct type
    const local = [];
    if (params.construct === 'fortress') {
      const tiers = Math.max(3, Math.floor(5 * params.structureDensity + 2));
      // Bottom tier
      const w0 = 12 / 2;
      const yBot = -4 - 0.7;
      local.push(
        new THREE.Vector3(-w0, yBot, -w0),
        new THREE.Vector3(w0, yBot, -w0),
        new THREE.Vector3(w0, yBot, w0),
        new THREE.Vector3(-w0, yBot, w0)
      );
      // Top tier
      const w1 = (12 - (tiers - 1) * 1.6) / 2;
      const yTop = (tiers - 1) * 1.8 - 4 + 0.7;
      local.push(
        new THREE.Vector3(-w1, yTop, -w1),
        new THREE.Vector3(w1, yTop, -w1),
        new THREE.Vector3(w1, yTop, w1),
        new THREE.Vector3(-w1, yTop, w1)
      );
      // Antenna spire tip
      local.push(new THREE.Vector3(0, tiers * 1.8 - 4 + 4, 0));
    } else if (params.construct === 'lattice') {
      const levels = Math.max(2, Math.floor(4 * params.structureDensity + 1));
      const rMax = 3 + (levels - 1) * 2.5;
      const r = rMax * 1.05;
      // Octahedron-ish bound — 6 axis vertices
      local.push(
        new THREE.Vector3(r, 2, 0), new THREE.Vector3(-r, 2, 0),
        new THREE.Vector3(0, r + 2, 0), new THREE.Vector3(0, -r + 2, 0),
        new THREE.Vector3(0, 2, r), new THREE.Vector3(0, 2, -r)
      );
    } else if (params.construct === 'spire') {
      const segments = Math.max(4, Math.floor(8 * params.structureDensity + 3));
      const rMax = 4;
      local.push(
        new THREE.Vector3(rMax, -3, 0), new THREE.Vector3(-rMax, -3, 0),
        new THREE.Vector3(0, -3, rMax), new THREE.Vector3(0, -3, -rMax),
        new THREE.Vector3(0, segments * 2.5 - 3, 0)
      );
    } else if (params.construct === 'ringtower') {
      const height = 14;
      const r = 4;
      local.push(
        new THREE.Vector3(r, -3, 0), new THREE.Vector3(-r, -3, 0),
        new THREE.Vector3(0, -3, r), new THREE.Vector3(0, -3, -r),
        new THREE.Vector3(r, -3 + height, 0), new THREE.Vector3(-r, -3 + height, 0),
        new THREE.Vector3(0, -3 + height + 3.5, 0) // antenna tip
      );
    } else if (params.construct === 'gridcube') {
      const half = 5;
      const yC = 2;
      // All 8 corners of the cube
      [-half, half].forEach(x => {
        [-half, half].forEach(y => {
          [-half, half].forEach(z => {
            local.push(new THREE.Vector3(x, yC + y, z));
          });
        });
      });
    } else if (params.construct === 'pyramid') {
      const tiers = Math.max(4, Math.floor(7 * params.structureDensity + 2));
      const baseW = 12 / 2;
      const topW = 2 / 2;
      const yTopTotal = -4 + tiers * 1.4;
      // Base corners
      local.push(
        new THREE.Vector3(-baseW, -4, -baseW), new THREE.Vector3(baseW, -4, -baseW),
        new THREE.Vector3(baseW, -4, baseW), new THREE.Vector3(-baseW, -4, baseW)
      );
      // Top corners
      local.push(
        new THREE.Vector3(-topW, yTopTotal, -topW), new THREE.Vector3(topW, yTopTotal, -topW),
        new THREE.Vector3(topW, yTopTotal, topW), new THREE.Vector3(-topW, yTopTotal, topW)
      );
      // Spine tip
      local.push(new THREE.Vector3(0, yTopTotal + 2, 0));
    } else if (params.construct === 'hub') {
      // Sample at the average satellite distance — 6 cardinal extents
      const r = 6;
      local.push(
        new THREE.Vector3(r, 2, 0), new THREE.Vector3(-r, 2, 0),
        new THREE.Vector3(0, 2 + r, 0), new THREE.Vector3(0, 2 - r, 0),
        new THREE.Vector3(0, 2, r), new THREE.Vector3(0, 2, -r)
      );
    } else if (params.construct === 'crystal') {
      const levels = Math.max(3, Math.floor(5 * params.structureDensity + 1));
      const totalH = 14;
      const rMax = 1.5 + 2.8; // largest crystal width (middle level)
      local.push(
        new THREE.Vector3(rMax, -4 + totalH / 2, 0),
        new THREE.Vector3(-rMax, -4 + totalH / 2, 0),
        new THREE.Vector3(0, -4 + totalH / 2, rMax),
        new THREE.Vector3(0, -4 + totalH / 2, -rMax),
        new THREE.Vector3(0, -4, 0),
        new THREE.Vector3(0, -4 + totalH, 0)
      );
    } else {
      // Unknown — generic sphere
      local.push(
        new THREE.Vector3(4, 2, 0), new THREE.Vector3(-4, 2, 0),
        new THREE.Vector3(0, 6, 0), new THREE.Vector3(0, -2, 0),
        new THREE.Vector3(0, 2, 4), new THREE.Vector3(0, 2, -4)
      );
    }
    // Transform local → world
    for (const p of local) {
      const w = p.clone().applyMatrix4(constructGroup.matrixWorld);
      pts.push(w);
    }
    return pts;
  }

  // Sample bounds for a single horizon building (8 corners of its bounding box)
  function sampleHorizonBuildingBounds(buildingMesh) {
    const pts = [];
    buildingMesh.updateMatrixWorld();
    const h = buildingMesh.userData.height;
    // Buildings are 2..10 wide & deep in the original BoxGeometry — approximate with 4
    const hw = 4, hd = 4;
    const corners = [
      [-hw, -h/2, -hd],[hw,-h/2,-hd],[hw,-h/2,hd],[-hw,-h/2,hd],
      [-hw,h/2,-hd],[hw,h/2,-hd],[hw,h/2,hd],[-hw,h/2,hd]
    ];
    for (const c of corners) {
      pts.push(new THREE.Vector3(c[0], c[1], c[2]).applyMatrix4(buildingMesh.matrixWorld));
    }
    return pts;
  }

  // Builds an SVG group with classes/attrs ready for tac fade animation.
  // Returns the <g> element. The caller is responsible for sizing/positioning.
  function makeSvgGroup(life, color) {
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', 'neuro-tac-svg-group' + (color ? ' ' + color : ''));
    g.style.setProperty('--tac-life', life.toFixed(2) + 's');
    tacSvg.appendChild(g);
    return g;
  }

  // Death-Star-style reticle: outer ring + tick marks + crosshair fingers
  // + corner brackets + numeric readout. Mode-dispatching entry point.
  function spawnReticle(t) {
    if (params.reticleMode === 'screen-billboard') return spawnReticleBillboard(t);
    return spawnReticle3D(t);
  }

  // === RETICLE: screen-space billboard (legacy SVG implementation) ===
  function spawnReticleBillboard(t) {
    if (!constructGroup) return null;
    const life = rollLife('approach') * 1.2;
    const color = '';

    const svgG = makeSvgGroup(life, color);
    const RETICLE_LABELS = [
      ['CONSTRUCT LOCK', `TARGET_${rand4Hex()}`],
      ['PRIMARY TARGET', `DESIGNATE_${rand4Hex()}`],
      ['ACQUISITION', `LOCK_${rand4Hex()}`],
      ['HOSTILE LOCK', `BOGEY_${rand4Hex()}`],
      ['CORE NODE', `NEXUS_${rand4Hex()}`],
      ['MASTER NODE', `ROOT_${rand4Hex()}`],
      ['DESIGNATE TARGET', `T-1_${rand4Hex()}`],
      ['ENGAGEMENT', `ENG_${rand4Hex()}`],
      ['HIGH VALUE', `HVT_${rand4Hex()}`],
      ['BLACK ICE LOCK', `LETHAL_${rand4Hex()}`],
      ['PRIMARY CONSTRUCT', `OBJ_${rand4Hex()}`],
      ['KUANG TARGET', `K11_${rand4Hex()}`],
      ['SCAN COMPLETE', `MANIFEST_${rand4Hex()}`],
      ['ROOT ACCESS', `SU_${rand4Hex()}`]
    ];
    const [retText, retSub] = RETICLE_LABELS[Math.floor(Math.random() * RETICLE_LABELS.length)];
    const labelEl = makeLabel(retText, retSub, color, life);

    const ann = {
      type: 'reticle',
      isComposite: true,
      compositeKind: 'reticle_billboard',
      svgG,
      labelEl,
      bornT: clock.elapsedTime,
      appearMode: pickWeighted(params.tacticalAppearWeights, 'fade'),
      animateMode: pickWeighted(params.tacticalAnimateWeights, 'steady'),
      life,
      expireT: t + life,
      labelOffset: null,
      reticleState: {
        tickCount: 5 + Math.floor(Math.random() * 4),
        rotPhase: Math.random() * Math.PI * 2,
        innerRotPhase: Math.random() * Math.PI * 2,
        countdown: 9 + Math.floor(Math.random() * 90)
      }
    };
    tacAnnotations.push(ann);
    return ann;
  }

  function renderReticleBillboard(ann, envOpacity) {
    const samples = sampleConstructBounds();
    const b = computeProjectedBounds(samples);
    if (!b || !b.onScreen) {
      ann.svgG.style.display = 'none';
      ann.labelEl.style.display = 'none';
      return;
    }
    ann.svgG.style.display = '';
    ann.labelEl.style.display = '';
    ann.svgG.style.opacity = envOpacity;

    const padding = 28;
    const halfW = b.halfW + padding;
    const halfH = b.halfH + padding;
    const radius = Math.max(halfW, halfH);

    const age = clock.elapsedTime - ann.bornT;
    const outerRot = age * 0.35 + ann.reticleState.rotPhase;
    const innerRot = -age * 0.55 + ann.reticleState.innerRotPhase;
    const marchP = Math.min(1, age / (ann.life * 0.35));
    const easeMarch = 1 - Math.pow(1 - marchP, 2);
    const crosshairOuter = radius * 1.05;
    const crosshairInner = radius * (0.5 + 0.3 * (1 - easeMarch));

    while (ann.svgG.firstChild) ann.svgG.removeChild(ann.svgG.firstChild);

    const svgNS = 'http://www.w3.org/2000/svg';
    const colorVar = 'var(--amber)';
    const glowFilter = 'drop-shadow(0 0 calc(3px * var(--hud-glow)) var(--amber))';

    // Outer ring + ticks
    const ringG = document.createElementNS(svgNS, 'g');
    ringG.setAttribute('transform', `translate(${b.cx} ${b.cy}) rotate(${(outerRot * 180 / Math.PI).toFixed(2)})`);
    ringG.style.filter = glowFilter;
    const ring = document.createElementNS(svgNS, 'circle');
    ring.setAttribute('cx', 0); ring.setAttribute('cy', 0);
    ring.setAttribute('r', radius);
    ring.setAttribute('fill', 'none');
    ring.setAttribute('stroke', colorVar);
    ring.setAttribute('stroke-width', 1);
    ringG.appendChild(ring);
    const tickCount = ann.reticleState.tickCount;
    for (let i = 0; i < tickCount; i++) {
      const a = (i / tickCount) * Math.PI * 2;
      const tx1 = Math.cos(a) * radius, ty1 = Math.sin(a) * radius;
      const tx2 = Math.cos(a) * (radius + 10), ty2 = Math.sin(a) * (radius + 10);
      const tk = document.createElementNS(svgNS, 'line');
      tk.setAttribute('x1', tx1.toFixed(2)); tk.setAttribute('y1', ty1.toFixed(2));
      tk.setAttribute('x2', tx2.toFixed(2)); tk.setAttribute('y2', ty2.toFixed(2));
      tk.setAttribute('stroke', colorVar);
      tk.setAttribute('stroke-width', 1.2);
      ringG.appendChild(tk);
    }
    ann.svgG.appendChild(ringG);

    // Inner ring
    const innerR = radius * 0.18;
    const innerG = document.createElementNS(svgNS, 'g');
    innerG.setAttribute('transform', `translate(${b.cx} ${b.cy}) rotate(${(innerRot * 180 / Math.PI).toFixed(2)})`);
    innerG.style.filter = glowFilter;
    const innerCircle = document.createElementNS(svgNS, 'circle');
    innerCircle.setAttribute('cx', 0); innerCircle.setAttribute('cy', 0);
    innerCircle.setAttribute('r', innerR);
    innerCircle.setAttribute('fill', 'none');
    innerCircle.setAttribute('stroke', colorVar);
    innerCircle.setAttribute('stroke-width', 1);
    innerG.appendChild(innerCircle);
    const dot = document.createElementNS(svgNS, 'circle');
    dot.setAttribute('cx', 0); dot.setAttribute('cy', 0);
    dot.setAttribute('r', 1.5);
    dot.setAttribute('fill', colorVar);
    innerG.appendChild(dot);
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      const x1 = Math.cos(a) * innerR, y1 = Math.sin(a) * innerR;
      const x2 = Math.cos(a) * (innerR + 4), y2 = Math.sin(a) * (innerR + 4);
      const tk = document.createElementNS(svgNS, 'line');
      tk.setAttribute('x1', x1.toFixed(2)); tk.setAttribute('y1', y1.toFixed(2));
      tk.setAttribute('x2', x2.toFixed(2)); tk.setAttribute('y2', y2.toFixed(2));
      tk.setAttribute('stroke', colorVar);
      tk.setAttribute('stroke-width', 0.8);
      innerG.appendChild(tk);
    }
    ann.svgG.appendChild(innerG);

    // Crosshair fingers
    const crossG = document.createElementNS(svgNS, 'g');
    crossG.style.filter = glowFilter;
    const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
    for (const [dx, dy] of dirs) {
      const x1 = b.cx + dx * crosshairOuter, y1 = b.cy + dy * crosshairOuter;
      const x2 = b.cx + dx * crosshairInner, y2 = b.cy + dy * crosshairInner;
      const line = document.createElementNS(svgNS, 'line');
      line.setAttribute('x1', x1.toFixed(2)); line.setAttribute('y1', y1.toFixed(2));
      line.setAttribute('x2', x2.toFixed(2)); line.setAttribute('y2', y2.toFixed(2));
      line.setAttribute('stroke', colorVar);
      line.setAttribute('stroke-width', 1.5);
      crossG.appendChild(line);
      const capPerp = [-dy, dx];
      const c1 = document.createElementNS(svgNS, 'line');
      c1.setAttribute('x1', (x1 + capPerp[0] * 6).toFixed(2));
      c1.setAttribute('y1', (y1 + capPerp[1] * 6).toFixed(2));
      c1.setAttribute('x2', (x1 - capPerp[0] * 6).toFixed(2));
      c1.setAttribute('y2', (y1 - capPerp[1] * 6).toFixed(2));
      c1.setAttribute('stroke', colorVar);
      c1.setAttribute('stroke-width', 1);
      crossG.appendChild(c1);
    }
    ann.svgG.appendChild(crossG);

    // Corner brackets
    const cornerSize = 14;
    const corners = [
      { x: b.cx - halfW, y: b.cy - halfH, dx: 1, dy: 1 },
      { x: b.cx + halfW, y: b.cy - halfH, dx: -1, dy: 1 },
      { x: b.cx - halfW, y: b.cy + halfH, dx: 1, dy: -1 },
      { x: b.cx + halfW, y: b.cy + halfH, dx: -1, dy: -1 }
    ];
    const cornerG = document.createElementNS(svgNS, 'g');
    cornerG.style.filter = glowFilter;
    for (const c of corners) {
      const p = document.createElementNS(svgNS, 'path');
      const d = `M ${c.x + c.dx * cornerSize} ${c.y} L ${c.x} ${c.y} L ${c.x} ${c.y + c.dy * cornerSize}`;
      p.setAttribute('d', d);
      p.setAttribute('fill', 'none');
      p.setAttribute('stroke', colorVar);
      p.setAttribute('stroke-width', 1.4);
      cornerG.appendChild(p);
    }
    ann.svgG.appendChild(cornerG);

    // Countdown
    const tagX = b.cx + radius * 0.7;
    const tagY = b.cy - radius * 0.95;
    const tag = document.createElementNS(svgNS, 'text');
    tag.setAttribute('x', tagX.toFixed(2));
    tag.setAttribute('y', tagY.toFixed(2));
    tag.setAttribute('fill', colorVar);
    tag.setAttribute('font-family', 'ui-monospace, monospace');
    tag.setAttribute('font-size', '11');
    tag.setAttribute('letter-spacing', '2');
    tag.style.filter = glowFilter;
    const remP = 1 - (clock.elapsedTime - ann.bornT) / ann.life;
    const cd = Math.max(0, Math.floor(ann.reticleState.countdown * remP));
    tag.textContent = `T-${cd.toString().padStart(3, '0')}`;
    ann.svgG.appendChild(tag);

    // Label below the reticle
    ann.labelEl.style.opacity = envOpacity;
    ann.labelEl.style.left = b.cx + 'px';
    ann.labelEl.style.top = (b.cy + halfH + 30) + 'px';
  }

  // === RETICLE: 3D world-anchored implementation ===
  function spawnReticle3D(t) {
    if (!constructGroup) return null;
    const life = rollLife('approach') * 1.2;
    const color = ''; // amber by default

    // === Pick a 3D anchor + radius that wraps the construct ===
    // The reticle is parented to constructGroup so it inherits rotation.
    // To replicate the original screen-billboard appearance when the construct
    // faces the camera, we anchor at the construct's center and size the radius
    // to wrap the entire construct silhouette with padding. The reticle lies
    // in the XY plane (normal = local Z), so when the construct faces camera,
    // the reticle is face-on; as it rotates, we see edge-on / back-of views.
    const { yMin, yMax } = constructYExtents();
    const yCenter = (yMin + yMax) / 2;
    const xzRadius = constructXZRadius();
    const yHalfHeight = (yMax - yMin) / 2;
    // Wrap the maximum extent + comfortable padding (matches old billboard's
    // padding of ~28 pixels at typical projection)
    const localAnchor = new THREE.Vector3(0, yCenter, 0);
    const radius = Math.max(xzRadius, yHalfHeight) * 1.18 + 0.6;

    // === Build the reticle as a 3D LineSegments2 assembly ===
    // The reticle lives in a Group, parented to constructGroup at localAnchor.
    // The reticle's local "plane" is the XY plane (Z is the "facing" axis).
    // We orient that plane to face outward — but since we want the user to
    // be able to see it from any side as the construct rotates, we just lay
    // it on the XY plane and let the construct's Y-rotation animate around it.
    const reticleGroup = new THREE.Group();
    reticleGroup.position.copy(localAnchor);

    // We'll need to build sub-groups so the inner ring can counter-rotate
    // around the reticle's local Z axis.
    const outerGroup = new THREE.Group();
    const innerGroup = new THREE.Group();
    const crossGroup = new THREE.Group(); // crosshair fingers — animated each frame
    const cornerGroup = new THREE.Group(); // corner brackets
    reticleGroup.add(outerGroup);
    reticleGroup.add(innerGroup);
    reticleGroup.add(crossGroup);
    reticleGroup.add(cornerGroup);

    // Shared materials for tracking
    const reticleLineMats = [];

    function makeReticleMat(weight, opacity) {
      const m = new LineMaterial({
        color: AMBER.getHex(),
        linewidth: weight,
        transparent: true,
        opacity: opacity,
        worldUnits: false,
        alphaToCoverage: true
      });
      m.resolution.set(window.innerWidth, window.innerHeight);
      m.userData.baseOpacity = opacity;
      reticleLineMats.push(m);
      return m;
    }

    function buildCircle(radius, segments, mat) {
      const pts = [];
      for (let i = 0; i < segments; i++) {
        const a1 = (i / segments) * Math.PI * 2;
        const a2 = ((i + 1) / segments) * Math.PI * 2;
        pts.push(
          Math.cos(a1) * radius, Math.sin(a1) * radius, 0,
          Math.cos(a2) * radius, Math.sin(a2) * radius, 0
        );
      }
      const geo = new LineSegmentsGeometry();
      geo.setPositions(pts);
      return new LineSegments2(geo, mat);
    }

    // Outer ring + tick marks
    const outerMat = makeReticleMat(1.6, 1.0);
    const outerRing = buildCircle(radius, 64, outerMat);
    outerGroup.add(outerRing);
    // Tick marks around outer ring
    const tickCount = 5 + Math.floor(Math.random() * 4);
    const tickPts = [];
    const tickLen = radius * 0.10;
    for (let i = 0; i < tickCount; i++) {
      const a = (i / tickCount) * Math.PI * 2;
      tickPts.push(
        Math.cos(a) * radius, Math.sin(a) * radius, 0,
        Math.cos(a) * (radius + tickLen), Math.sin(a) * (radius + tickLen), 0
      );
    }
    const tickGeo = new LineSegmentsGeometry();
    tickGeo.setPositions(tickPts);
    const tickMat = makeReticleMat(1.4, 1.0);
    const ticks = new LineSegments2(tickGeo, tickMat);
    outerGroup.add(ticks);

    // Inner counter-rotating ring
    const innerR = radius * 0.18;
    const innerMat = makeReticleMat(1.2, 1.0);
    const innerRing = buildCircle(innerR, 24, innerMat);
    innerGroup.add(innerRing);
    // Inner ticks
    const innerTickPts = [];
    const innerTickLen = innerR * 0.4;
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      innerTickPts.push(
        Math.cos(a) * innerR, Math.sin(a) * innerR, 0,
        Math.cos(a) * (innerR + innerTickLen), Math.sin(a) * (innerR + innerTickLen), 0
      );
    }
    const innerTickGeo = new LineSegmentsGeometry();
    innerTickGeo.setPositions(innerTickPts);
    const innerTickMat = makeReticleMat(0.9, 1.0);
    const innerTicks = new LineSegments2(innerTickGeo, innerTickMat);
    innerGroup.add(innerTicks);
    // Center dot — small cross instead of dot for visibility
    const centerSize = radius * 0.025;
    const centerPts = [
      -centerSize, 0, 0, centerSize, 0, 0,
      0, -centerSize, 0, 0, centerSize, 0
    ];
    const centerGeo = new LineSegmentsGeometry();
    centerGeo.setPositions(centerPts);
    const centerMat = makeReticleMat(1.8, 1.0);
    innerGroup.add(new LineSegments2(centerGeo, centerMat));

    // Crosshair fingers — these get rebuilt each frame to march inward.
    // We store the materials for re-use; geometry is rebuilt.
    const crossMat = makeReticleMat(1.5, 1.0);
    // crossLine — placeholder mesh, will be replaced each frame
    let crossLineMesh = null;

    // Corner brackets at the bounding square of the ring
    const cornerSize = radius * 0.13;
    const halfRect = radius * 1.0;
    const cornerPts = [];
    const cornerOffsets = [
      [-halfRect, -halfRect, 1, 1],
      [halfRect, -halfRect, -1, 1],
      [-halfRect, halfRect, 1, -1],
      [halfRect, halfRect, -1, -1]
    ];
    for (const [cx, cy, dx, dy] of cornerOffsets) {
      cornerPts.push(
        cx + dx * cornerSize, cy, 0, cx, cy, 0,
        cx, cy, 0, cx, cy + dy * cornerSize, 0
      );
    }
    const cornerGeo = new LineSegmentsGeometry();
    cornerGeo.setPositions(cornerPts);
    const cornerMat = makeReticleMat(1.5, 1.0);
    cornerGroup.add(new LineSegments2(cornerGeo, cornerMat));

    constructGroup.add(reticleGroup);

    // === Label (still screen-space, projected from world point) ===
    const RETICLE_LABELS = [
      ['CONSTRUCT LOCK', `TARGET_${rand4Hex()}`],
      ['PRIMARY TARGET', `DESIGNATE_${rand4Hex()}`],
      ['ACQUISITION', `LOCK_${rand4Hex()}`],
      ['HOSTILE LOCK', `BOGEY_${rand4Hex()}`],
      ['CORE NODE', `NEXUS_${rand4Hex()}`],
      ['MASTER NODE', `ROOT_${rand4Hex()}`],
      ['DESIGNATE TARGET', `T-1_${rand4Hex()}`],
      ['ENGAGEMENT', `ENG_${rand4Hex()}`],
      ['HIGH VALUE', `HVT_${rand4Hex()}`],
      ['BLACK ICE LOCK', `LETHAL_${rand4Hex()}`],
      ['PRIMARY CONSTRUCT', `OBJ_${rand4Hex()}`],
      ['KUANG TARGET', `K11_${rand4Hex()}`],
      ['SCAN COMPLETE', `MANIFEST_${rand4Hex()}`],
      ['ROOT ACCESS', `SU_${rand4Hex()}`]
    ];
    const [retText, retSub] = RETICLE_LABELS[Math.floor(Math.random() * RETICLE_LABELS.length)];
    const labelEl = makeLabel(retText, retSub, color, life);

    const ann = {
      type: 'reticle',
      isReticle3D: true,
      reticleGroup,
      reticleLineMats,
      outerGroup,
      innerGroup,
      crossGroup,
      crossMat,
      cornerGroup,
      localAnchor,
      radius,
      tickCount,
      rotPhase: Math.random() * Math.PI * 2,
      innerRotPhase: Math.random() * Math.PI * 2,
      countdown: 9 + Math.floor(Math.random() * 90),
      labelEl,
      labelOffset: null,
      bornT: clock.elapsedTime,
      appearMode: pickWeighted(params.tacticalAppearWeights, 'fade'),
      animateMode: pickWeighted(params.tacticalAnimateWeights, 'steady'),
      life,
      expireT: t + life,
      // For dispose: world objects + materials
      worldObjects: [reticleGroup],
      worldMats: reticleLineMats,
      // crossLineMesh slot — replaced each frame
      crossLineMesh: null
    };
    tacAnnotations.push(ann);
    return ann;
  }

  // Stacked rectangles around a subject (construct or horizon building)
  function spawnStack(subject, t) {
    if (params.stackMode === 'screen-billboard') return spawnStackBillboard(subject, t);
    // 3D worldspace stack only supports the construct target (horizon buildings
    // stay billboard since they're tiny and distant)
    if (subject === 'construct') return spawnStack3D(t);
    return spawnStackBillboard(subject, t);
  }

  function spawnStackBillboard(subject, t) {
    const life = rollLife('subsys'); // long-lived like other subsystem markers

    let targetRef;
    if (subject === 'construct') {
      targetRef = { kind: 'construct' };
    } else {
      const idx = pickVisibleHorizonIdx();
      if (idx < 0) return null;
      targetRef = { kind: 'horizon', idx };
    }

    const svgG = makeSvgGroup(life, '');
    const [text, sub] = pickLabel(SUBSYS_LABELS);
    const labelEl = makeLabel(text, sub, '', life);

    const ann = {
      type: 'stack',
      isComposite: true,
      svgG,
      labelEl,
      compositeKind: 'stack',
      targetRef,
      bornT: clock.elapsedTime,
      appearMode: pickWeighted(params.tacticalAppearWeights, 'fade'),
      animateMode: pickWeighted(params.tacticalAnimateWeights, 'steady'),
      life,
      expireT: t + life,
      labelOffset: null,
      stackState: {
        layers: 2 + Math.floor(Math.random() * 3), // 2-4 nested rects
        // Random outset spacing in pixels per layer
        outsets: [10, 20, 32, 48].slice(0, 2 + Math.floor(Math.random() * 3)),
        // Outer dashed or solid?
        outerDashed: Math.random() < 0.5
      }
    };
    tacAnnotations.push(ann);
    return ann;
  }

  // 3D worldspace stack: nested rectangles parented to the construct, lying on
  // the local XY plane, centered at the construct center and sized to wrap the
  // whole silhouette — mirrors the reticle's world-anchored approach. Face-on
  // it reads like the screen-space version; as the construct rotates we see it
  // edge-on and from behind.
  function spawnStack3D(t) {
    if (!constructGroup) return null;
    const life = rollLife('subsys');

    // Center + base half-extents that wrap the construct (same basis as reticle)
    const { yMin, yMax } = constructYExtents();
    const yCenter = (yMin + yMax) / 2;
    const xzRadius = constructXZRadius();
    const yHalfHeight = (yMax - yMin) / 2;
    // The construct is taller than wide (it spins around Y), so the bounding
    // rectangle uses xzRadius for width and yHalfHeight for height, plus padding.
    const baseHalfW = xzRadius * 1.12 + 0.5;
    const baseHalfH = yHalfHeight * 1.06 + 0.5;

    const layerCount = 2 + Math.floor(Math.random() * 3); // 2-4
    // Per-layer outward padding in world units
    const outsets = [0, 0.9, 1.9, 3.0].slice(0, layerCount);
    const outerDashed = Math.random() < 0.5;

    const group = new THREE.Group();
    group.position.set(0, yCenter, 0);

    const stackMats = [];
    function makeStackMat(weight, opacity, dim) {
      const m = new LineMaterial({
        color: dim ? PHOSPHOR_DIM.getHex() : PHOSPHOR.getHex(),
        linewidth: weight,
        transparent: true,
        opacity,
        worldUnits: false,
        alphaToCoverage: true
      });
      m.resolution.set(window.innerWidth, window.innerHeight);
      m.userData.baseOpacity = opacity;
      stackMats.push(m);
      return m;
    }

    // Build a rectangle outline on the XY plane (optionally dashed by skipping segments)
    function buildRect(halfW, halfH, dashed) {
      const corners = [
        [-halfW, -halfH], [halfW, -halfH], [halfW, halfH], [-halfW, halfH]
      ];
      const pts = [];
      for (let e = 0; e < 4; e++) {
        const [ax, ay] = corners[e];
        const [bx, by] = corners[(e + 1) % 4];
        if (dashed) {
          // Subdivide each edge into dashes
          const segs = 14;
          for (let s = 0; s < segs; s += 2) {
            const t0 = s / segs, t1 = (s + 1) / segs;
            pts.push(ax + (bx - ax) * t0, ay + (by - ay) * t0, 0,
                     ax + (bx - ax) * t1, ay + (by - ay) * t1, 0);
          }
        } else {
          pts.push(ax, ay, 0, bx, by, 0);
        }
      }
      return pts;
    }

    for (let i = 0; i < layerCount; i++) {
      const halfW = baseHalfW + outsets[i];
      const halfH = baseHalfH + outsets[i];
      const isOuter = i === layerCount - 1;
      const isInner = i === 0;
      const dashed = isOuter && outerDashed;
      const mat = makeStackMat(isInner ? 1.4 : 1.0, 1.0, !isInner);
      group.add(makeLineSegsFromPositions(buildRect(halfW, halfH, dashed), mat));

      // Corner ticks on the outermost layer
      if (isOuter) {
        const tickLen = Math.max(halfW, halfH) * 0.10;
        const tickMat = makeStackMat(1.4, 1.0, false);
        const tickPts = [];
        const cs = [
          [-halfW, -halfH, 1, 1], [halfW, -halfH, -1, 1],
          [-halfW, halfH, 1, -1], [halfW, halfH, -1, -1]
        ];
        for (const [cx, cy, dx, dy] of cs) {
          tickPts.push(cx + dx * tickLen, cy, 0, cx, cy, 0);
          tickPts.push(cx, cy, 0, cx, cy + dy * tickLen, 0);
        }
        group.add(makeLineSegsFromPositions(tickPts, tickMat));
      }
    }

    constructGroup.add(group);

    const [text, sub] = pickLabel(SUBSYS_LABELS);
    const labelEl = makeLabel(text, sub, '', life);

    // Label anchor — upper-right corner of the outer rect, in local space
    const outerHalfW = baseHalfW + outsets[layerCount - 1];
    const outerHalfH = baseHalfH + outsets[layerCount - 1];
    const labelAnchorLocal = new THREE.Vector3(outerHalfW, yCenter + outerHalfH, 0);

    const ann = {
      type: 'stack',
      isStack3D: true,
      group,
      worldObjects: [group],
      worldMats: stackMats,
      labelEl,
      labelAnchorLocal,
      labelOffset: null,
      bornT: clock.elapsedTime,
      appearMode: pickWeighted(params.tacticalAppearWeights, 'fade'),
      animateMode: pickWeighted(params.tacticalAnimateWeights, 'steady'),
      life,
      expireT: t + life
    };
    tacAnnotations.push(ann);
    return ann;
  }

  // Per-frame updater for the 3D worldspace stack
  function updateStack3D(ann, envOpacity) {
    ann.worldMats.forEach(m => {
      m.opacity = (m.userData.baseOpacity || 1.0) * envOpacity;
    });
    ann.group.visible = envOpacity > 0.01;

    constructGroup.updateMatrixWorld();
    const worldAnchor = ann.labelAnchorLocal.clone().applyMatrix4(constructGroup.matrixWorld);
    const proj = project3DToScreen(worldAnchor);
    if (!proj.onScreen) {
      ann.labelEl.style.display = 'none';
      return;
    }
    ann.labelEl.style.display = '';
    ann.labelEl.style.opacity = envOpacity;
    if (!ann.labelOffset) {
      ann.labelOffset = { dx: 18, dy: -6 };
    }
    ann.labelEl.style.left = (proj.x + ann.labelOffset.dx) + 'px';
    ann.labelEl.style.top = (proj.y + ann.labelOffset.dy) + 'px';
  }

  // Renders the SVG content of a composite annotation each frame.
  function renderComposite(ann, envOpacity) {
    if (ann.compositeKind === 'reticle_billboard') return renderReticleBillboard(ann, envOpacity);
    if (ann.compositeKind === 'stack') return renderStack(ann, envOpacity);
  }

  function update3DReticle(ann, envOpacity) {
    const age = clock.elapsedTime - ann.bornT;
    // Outer ring slow rotation around its local Z axis
    ann.outerGroup.rotation.z = age * 0.35 + ann.rotPhase;
    // Inner ring counter-rotates
    ann.innerGroup.rotation.z = -age * 0.55 + ann.innerRotPhase;

    // Crosshair "march" — rebuild geometry each frame
    const marchP = Math.min(1, age / (ann.life * 0.35));
    const easeMarch = 1 - Math.pow(1 - marchP, 2);
    const crosshairOuter = ann.radius * 1.10;
    const crosshairInner = ann.radius * (0.5 + 0.3 * (1 - easeMarch));
    // Remove old crosshair mesh
    if (ann.crossLineMesh) {
      ann.crossGroup.remove(ann.crossLineMesh);
      if (ann.crossLineMesh.geometry) ann.crossLineMesh.geometry.dispose();
    }
    // Rebuild
    const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
    const crossPts = [];
    const capSize = ann.radius * 0.06;
    for (const [dx, dy] of dirs) {
      const x1 = dx * crosshairOuter, y1 = dy * crosshairOuter;
      const x2 = dx * crosshairInner, y2 = dy * crosshairInner;
      // Main finger line
      crossPts.push(x1, y1, 0, x2, y2, 0);
      // Outer cap (perpendicular cross at the outer end)
      const capPerp = [-dy, dx];
      crossPts.push(
        x1 + capPerp[0] * capSize, y1 + capPerp[1] * capSize, 0,
        x1 - capPerp[0] * capSize, y1 - capPerp[1] * capSize, 0
      );
    }
    const crossGeo = new LineSegmentsGeometry();
    crossGeo.setPositions(crossPts);
    ann.crossLineMesh = new LineSegments2(crossGeo, ann.crossMat);
    ann.crossGroup.add(ann.crossLineMesh);

    // Apply envelope opacity to all reticle materials
    ann.reticleLineMats.forEach(m => {
      m.opacity = (m.userData.baseOpacity || 1.0) * envOpacity;
    });
    ann.reticleGroup.visible = envOpacity > 0.01;

    // Project the world anchor to screen-space for the label
    const worldAnchor = ann.localAnchor.clone();
    constructGroup.updateMatrixWorld();
    worldAnchor.applyMatrix4(constructGroup.matrixWorld);
    const proj = project3DToScreen(worldAnchor);
    if (!proj.onScreen) {
      ann.labelEl.style.display = 'none';
      return;
    }
    ann.labelEl.style.display = '';
    ann.labelEl.style.opacity = envOpacity;

    if (!ann.labelOffset) {
      // Bias outward from screen center
      const w = window.innerWidth, h = window.innerHeight;
      const centerDx = proj.x - w / 2;
      const centerDy = proj.y - h / 2;
      const ang = Math.atan2(centerDy, centerDx);
      ann.labelOffset = {
        dx: Math.cos(ang) * 120,
        dy: Math.sin(ang) * 80
      };
    }
    ann.labelEl.style.left = (proj.x + ann.labelOffset.dx) + 'px';
    ann.labelEl.style.top = (proj.y + ann.labelOffset.dy) + 'px';

    // Live countdown in subtext
    const sub = ann.labelEl.querySelector('.sub');
    if (sub) {
      if (!ann.subBase) ann.subBase = sub.textContent;
      const remP = 1 - age / ann.life;
      const cd = Math.max(0, Math.floor(ann.countdown * remP));
      sub.textContent = `${ann.subBase} · T-${cd.toString().padStart(3, '0')}`;
    }
  }

  function renderStack(ann, envOpacity) {
    let samples;
    if (ann.targetRef.kind === 'construct') {
      samples = sampleConstructBounds();
    } else {
      const obj = horizonGroup.children[ann.targetRef.idx];
      if (!obj) {
        ann.svgG.style.display = 'none';
        ann.labelEl.style.display = 'none';
        return;
      }
      samples = sampleHorizonBuildingBounds(obj);
    }
    const b = computeProjectedBounds(samples);
    if (!b || !b.onScreen) {
      ann.svgG.style.display = 'none';
      ann.labelEl.style.display = 'none';
      return;
    }
    ann.svgG.style.display = '';
    ann.labelEl.style.display = '';
    ann.svgG.style.opacity = envOpacity;

    while (ann.svgG.firstChild) ann.svgG.removeChild(ann.svgG.firstChild);
    const svgNS = 'http://www.w3.org/2000/svg';
    const colorVar = 'var(--phosphor)';
    const colorVarDim = 'var(--phosphor-dim)';
    const glowFilter = 'drop-shadow(0 0 calc(3px * var(--hud-glow)) var(--phosphor))';

    // Stack nested rects
    const layers = ann.stackState.outsets;
    for (let i = 0; i < layers.length; i++) {
      const out = layers[i];
      const rectX = b.cx - b.halfW - out;
      const rectY = b.cy - b.halfH - out;
      const rectW = (b.halfW + out) * 2;
      const rectH = (b.halfH + out) * 2;
      const rect = document.createElementNS(svgNS, 'rect');
      rect.setAttribute('x', rectX.toFixed(2));
      rect.setAttribute('y', rectY.toFixed(2));
      rect.setAttribute('width', rectW.toFixed(2));
      rect.setAttribute('height', rectH.toFixed(2));
      rect.setAttribute('fill', 'none');
      rect.setAttribute('stroke', i === 0 ? colorVar : colorVarDim);
      rect.setAttribute('stroke-width', i === 0 ? 1.4 : 1.0);
      if (i === layers.length - 1 && ann.stackState.outerDashed) {
        rect.setAttribute('stroke-dasharray', '6 4');
      }
      rect.style.filter = glowFilter;
      ann.svgG.appendChild(rect);

      // Corner ticks on the outermost
      if (i === layers.length - 1) {
        const tickLen = 6;
        const corners = [
          { x: rectX, y: rectY, dx: 1, dy: 1 },
          { x: rectX + rectW, y: rectY, dx: -1, dy: 1 },
          { x: rectX, y: rectY + rectH, dx: 1, dy: -1 },
          { x: rectX + rectW, y: rectY + rectH, dx: -1, dy: -1 }
        ];
        for (const c of corners) {
          const p = document.createElementNS(svgNS, 'path');
          p.setAttribute('d', `M ${c.x + c.dx * tickLen} ${c.y} L ${c.x} ${c.y} L ${c.x} ${c.y + c.dy * tickLen}`);
          p.setAttribute('fill', 'none');
          p.setAttribute('stroke', colorVar);
          p.setAttribute('stroke-width', 1.4);
          p.style.filter = glowFilter;
          ann.svgG.appendChild(p);
        }
      }
    }

    // Label hangs to the upper-right of the outermost rect
    const outermost = layers[layers.length - 1];
    ann.labelEl.style.opacity = envOpacity;
    ann.labelEl.style.left = (b.cx + b.halfW + outermost + 20) + 'px';
    ann.labelEl.style.top = (b.cy - b.halfH - outermost) + 'px';
  }

  function pickVisibleHorizonIdx() {
    const candidates = [];
    horizonGroup.children.forEach((c, i) => {
      c.updateMatrixWorld();
      const worldPos = new THREE.Vector3().setFromMatrixPosition(c.matrixWorld);
      const p = project3DToScreen(worldPos);
      if (p.onScreen && p.depth < 0.998) candidates.push(i);
    });
    if (!candidates.length) return -1;
    return candidates[Math.floor(Math.random() * candidates.length)];
  }

  // Master annotation factory
  function createAnnotation(spec) {
    const labelEl = makeLabel(spec.labelText, spec.subText, spec.color, spec.life);
    const leader = makeLeader(spec.color, spec.life);

    // For construct-anchored annotations with a localAnchor, build a 3D world-space
    // leader line that runs from the anchor point outward to a "tip" point, with
    // the label projecting from the tip. The line lives in constructGroup so it
    // rotates with the construct.
    let leaderLine3D = null;
    let leaderMat3D = null;
    let leaderTip = null; // THREE.Vector3 in local construct space

    if (spec.attachedTo === 'construct' && spec.localAnchor && constructGroup) {
      // Push the tip outward from the construct center, biased by anchor direction
      const anchor = spec.localAnchor;
      const outDir = new THREE.Vector3(anchor.x, 0, anchor.z);
      if (outDir.lengthSq() < 0.01) outDir.set(1, 0, 0);
      outDir.normalize();
      // Tip is anchor + a short outward step + slight upward nudge
      const tipDist = 2.5 + Math.random() * 2.0;
      leaderTip = anchor.clone()
        .addScaledVector(outDir, tipDist)
        .add(new THREE.Vector3(0, 0.6 + Math.random() * 1.0, 0));

      // Build the line as two segments: anchor → midpoint (dimmer), midpoint → tip (brighter)
      const mid = anchor.clone().lerp(leaderTip, 0.5);
      const pts = [
        anchor.x, anchor.y, anchor.z,
        mid.x, mid.y, mid.z,
        mid.x, mid.y, mid.z,
        leaderTip.x, leaderTip.y, leaderTip.z
      ];
      const geo = new LineSegmentsGeometry();
      geo.setPositions(pts);
      const colorHex = spec.color === 'red' ? parseInt(activePalette.red.replace('#',''), 16)
                     : spec.color === 'phos' ? PHOSPHOR.getHex()
                     : AMBER.getHex();
      leaderMat3D = new LineMaterial({
        color: colorHex,
        linewidth: 1.0,
        transparent: true,
        opacity: 0.75,
        worldUnits: false,
        alphaToCoverage: true
      });
      leaderMat3D.resolution.set(window.innerWidth, window.innerHeight);
      leaderMat3D.userData.baseOpacity = 0.75;
      leaderLine3D = new LineSegments2(geo, leaderMat3D);
      constructGroup.add(leaderLine3D);
    }

    const ann = {
      ...spec,
      labelEl,
      leader,
      leaderLine3D,
      leaderMat3D,
      leaderTip,
      labelOffset: null,
      bornT: clock.elapsedTime,
      appearMode: pickWeighted(params.tacticalAppearWeights, 'fade'),
      animateMode: pickWeighted(params.tacticalAnimateWeights, 'steady'),
      worldMatBaseOpacities: spec.worldMats ? spec.worldMats.map(m => m.opacity) : null,
      worldObjScalePivots: null
    };
    tacAnnotations.push(ann);
    return ann;
  }

  // Compute envelope multiplier (0..1) for world-space mesh visibility,
  // and a scale factor for shrink mode. Returns { opacity, scale, visible }.
  function computeWorldEnvelope(ann, t) {
    const life = ann.life || 2.0;
    const age = t - ann.bornT;
    const remaining = ann.expireT - t;
    const APPEAR = Math.min(0.18, life * 0.15);
    const VANISH = Math.min(0.28, life * 0.2);
    let opacity = 1, scale = 1;

    switch (ann.appearMode) {
      case 'pop': {
        // Instant on, instant off
        opacity = 1; scale = 1;
        break;
      }
      case 'fade': {
        const inP = Math.min(1, age / APPEAR);
        const outP = Math.min(1, remaining / VANISH);
        opacity = inP * outP;
        scale = 1;
        break;
      }
      case 'blink': {
        // 3-4 rapid blinks before solid, then 3-4 blinks before disappear
        const BLINK_HZ = 18; // blinks/sec during the blink window
        const BLINK_WINDOW = Math.min(0.35, life * 0.25);
        if (age < BLINK_WINDOW) {
          // Settling in: square wave with bias toward 'on' as age progresses
          const phase = Math.sin(age * BLINK_HZ * Math.PI * 2);
          const bias = age / BLINK_WINDOW; // 0 → 1
          opacity = phase > (0.5 - bias) ? 1 : 0;
        } else if (remaining < BLINK_WINDOW) {
          // Dying: same as appear but reversed bias
          const phase = Math.sin((life - remaining) * BLINK_HZ * Math.PI * 2);
          const bias = remaining / BLINK_WINDOW;
          opacity = phase > (0.5 - bias) ? 1 : 0;
        } else {
          opacity = 1;
        }
        scale = 1;
        break;
      }
      case 'shrink': {
        // Scale in from 0.4 → 1.0, hold, then expand 1.0 → 1.4 while fading
        const inP = Math.min(1, age / APPEAR);
        const outP = Math.min(1, remaining / VANISH);
        // Ease in/out
        const easeIn = 1 - Math.pow(1 - inP, 3);
        const easeOut = 1 - Math.pow(1 - outP, 2);
        scale = 0.4 + 0.6 * easeIn; // grows to 1.0 during appear
        if (remaining < VANISH) {
          // While dying, scale past 1.0 toward 1.4
          const dyingP = 1 - outP; // 0 → 1
          scale = 1.0 + 0.4 * dyingP;
          opacity = easeOut;
        } else {
          opacity = easeIn;
        }
        break;
      }
    }

    // === ANIMATE MODE — modulates opacity during "hold" phase ===
    // Only apply when we're past appear and before vanish (so we don't
    // double-modulate transitions).
    const inHold = age > APPEAR && remaining > VANISH;
    if (inHold && ann.animateMode && ann.animateMode !== 'steady') {
      switch (ann.animateMode) {
        case 'pulse': {
          // Slow sine, ~0.8 Hz, oscillating 0.5 → 1.0
          const pulseT = (age - APPEAR) * 0.8;
          const wave = Math.sin(pulseT * Math.PI * 2) * 0.5 + 0.5;
          opacity *= 0.55 + wave * 0.45;
          break;
        }
        case 'flicker': {
          // Per-annotation deterministic flicker — use bornT as seed for randomness
          // Brief drops to ~0.3 about 8-12% of the time
          const seed = (ann.bornT * 17.3 + Math.floor(t * 8.0)) | 0;
          const r = Math.abs(Math.sin(seed * 12.9898) * 43758.5453);
          const v = r - Math.floor(r); // [0,1) pseudo-random per ~125ms slice
          if (v > 0.9) opacity *= 0.25;
          else if (v > 0.86) opacity *= 0.6;
          break;
        }
        case 'tick': {
          // For composite types (reticle, stack) this drives sub-state ticks
          // via ann.tickState (updated elsewhere). Here we just dim subtly on
          // each tick edge to give a 'click' feel.
          const tickHz = 1.4;
          const phase = (age - APPEAR) * tickHz;
          const inEdge = Math.abs(phase - Math.round(phase)) < 0.04;
          if (inEdge) opacity *= 0.7;
          break;
        }
      }
    }

    return { opacity: Math.max(0, opacity), scale, visible: opacity > 0.01 };
  }

  function applyWorldEnvelope(ann, env) {
    if (!ann.worldObjects || !ann.worldObjects.length) return;
    // Opacity: multiply against snapshot base opacity per material
    if (ann.worldMats && ann.worldMatBaseOpacities) {
      ann.worldMats.forEach((m, i) => {
        m.opacity = ann.worldMatBaseOpacities[i] * env.opacity;
        m.visible = env.visible;
      });
    }
    // Scale: scale around local pivot. For meshes parented to constructGroup the
    // localAnchor is the right pivot. For free world arrows, use the midpoint of
    // the line we drew. We don't have great pivot info, so we approximate by
    // scaling the object around its position (which is .position = origin in local)
    // → we just set scale uniformly; meshes are already centered roughly on their
    // anchor since they were built relative to a tier or vertex.
    if (ann.appearMode === 'shrink') {
      ann.worldObjects.forEach(o => o.scale.setScalar(env.scale));
    } else {
      ann.worldObjects.forEach(o => o.scale.setScalar(1));
    }
  }

  function updateAnnotations(t) {
    const w = window.innerWidth, h = window.innerHeight;
    for (let i = tacAnnotations.length - 1; i >= 0; i--) {
      const ann = tacAnnotations[i];
      if (t > ann.expireT) {
        disposeAnnotation(ann);
        tacAnnotations.splice(i, 1);
        continue;
      }

      // Drive envelope (opacity + scale)
      const env = computeWorldEnvelope(ann, t);

      // Attack vectors have their own sequencer — bypass normal envelope
      if (ann.isAttackVector) {
        updateAttackVector(ann, t);
        continue;
      }

      // Terrain labels — ambient slow layer with typewriter
      if (ann.isTerrainLabel) {
        updateTerrainLabel(ann, t);
        continue;
      }

      // Extended animation effects (scan slices, frag, unwrap, etc.)
      if (ann.isAnimEffect) {
        updateAnimEffect(ann, t);
        continue;
      }

      // 3D reticle has its own world-space updater
      if (ann.isReticle3D) {
        update3DReticle(ann, env.opacity);
        continue;
      }

      // 3D worldspace stack
      if (ann.isStack3D) {
        updateStack3D(ann, env.opacity);
        continue;
      }

      // Composite annotations (stack) render SVG content each frame
      if (ann.isComposite) {
        renderComposite(ann, env.opacity);
        continue;
      }

      // Standard annotations: drive world objects + DOM label/leader
      applyWorldEnvelope(ann, env);

      // Drive 3D leader line opacity (if present)
      if (ann.leaderLine3D && ann.leaderMat3D) {
        ann.leaderMat3D.opacity = ann.leaderMat3D.userData.baseOpacity * env.opacity;
        ann.leaderLine3D.visible = env.visible;
      }

      // Resolve current world position of the anchor.
      // If this annotation has a 3D leader line, project from the tip instead
      // of the anchor — the label should hang at the tip of the pointer, not
      // at the surface point (which is already indicated by the 3D line).
      let worldAnchor;
      if (ann.isFreeWorld) {
        worldAnchor = ann.localAnchor;
      } else if (ann.leaderTip && ann.attachedTo === 'construct' && constructGroup) {
        constructGroup.updateMatrixWorld();
        worldAnchor = ann.leaderTip.clone().applyMatrix4(constructGroup.matrixWorld);
      } else {
        worldAnchor = resolveWorldAnchor(ann);
      }
      const anchorScreen = project3DToScreen(worldAnchor);

      // Hide label if anchor is behind the camera or way offscreen
      if (!anchorScreen.onScreen) {
        ann.labelEl.style.display = 'none';
        ann.leader.line.style.display = 'none';
        ann.leader.dot.style.display = 'none';
        continue;
      }
      ann.labelEl.style.display = '';

      // Suppress the legacy SVG leader for annotations that have a 3D world leader
      if (ann.leaderLine3D) {
        ann.leader.line.style.display = 'none';
        ann.leader.dot.style.display = 'none';
      } else {
        ann.leader.line.style.display = '';
        ann.leader.dot.style.display = '';
      }

      // Lock the label offset on first frame (so it doesn't slide around)
      if (!ann.labelOffset) {
        // Bias label direction outward from screen center
        const centerDx = anchorScreen.x - w/2;
        const centerDy = anchorScreen.y - h/2;
        const outwardAngle = Math.atan2(centerDy, centerDx);
        const variation = (Math.random() - 0.5) * 0.8;
        const angle = outwardAngle + variation;
        const dist = 60 + Math.random() * 50;
        ann.labelOffset = { dx: Math.cos(angle) * dist, dy: Math.sin(angle) * dist };
      }

      const labelX = anchorScreen.x + ann.labelOffset.dx;
      const labelY = anchorScreen.y + ann.labelOffset.dy;

      ann.labelEl.style.left = labelX + 'px';
      ann.labelEl.style.top = labelY + 'px';

      // Update SVG leader for annotations that still use it (no 3D leader)
      if (!ann.leaderLine3D) {
        const dx = anchorScreen.x - labelX;
        const dy = anchorScreen.y - labelY;
        const elbowX = labelX + dx * 0.35;
        const elbowY = labelY;
        ann.leader.line.setAttribute('d', `M ${labelX} ${labelY} L ${elbowX} ${elbowY} L ${anchorScreen.x} ${anchorScreen.y}`);
        ann.leader.dot.setAttribute('cx', anchorScreen.x);
        ann.leader.dot.setAttribute('cy', anchorScreen.y);
      }
    }
  }

  function fireConstructEvent(t) {
    const r = Math.random();
    let primary;
    // Rarer dramatic composites at the top of the roll, then base primitives
    if (r < 0.05) primary = spawnReticle(t);                       // 5% — full lock-on
    else if (r < 0.17) primary = spawnStack('construct', t);       // 12% — stacked rect analysis
    else if (r < 0.40) primary = spawnFaceHighlight('construct', t);
    else if (r < 0.60) primary = spawnEdgeTracer('construct', t);
    else if (r < 0.77) primary = spawnVertexPip('construct', t);
    else if (r < 0.92) primary = spawnSubsysFlag('construct', t);
    else primary = spawnApproachVector(t); // the simple 2D arrow stays here

    // Burst — fire follow-ups that share the subject so it reads as
    // "the system is analyzing this thing"
    if (Math.random() < params.tacticalBurstChance) {
      const burstCount = 1 + Math.floor(Math.random() * 3); // 1-3 follow-ups
      for (let b = 0; b < burstCount; b++) {
        const delay = 120 + Math.random() * 400 + b * 180;
        setTimeout(() => {
          if (!params.tacticalEnabled) return;
          const tNow = clock.elapsedTime;
          const br = Math.random();
          if (br < 0.4) spawnVertexPip('construct', tNow);
          else if (br < 0.7) spawnEdgeTracer('construct', tNow);
          else spawnFaceHighlight('construct', tNow);
        }, delay);
      }
    }
  }

  function fireHorizonEvent(t) {
    const r = Math.random();
    let primary;
    if (r < 0.08) primary = spawnStack('horizon', t);              // 8% — stacked rect on a building
    else if (r < 0.52) primary = spawnSubsysFlag('horizon', t);
    else if (r < 0.85) primary = spawnVertexPip('horizon', t);
    else { /* warning instead */ spawnWarning(); return; }

    if (Math.random() < params.tacticalBurstChance) {
      const burstCount = 1 + Math.floor(Math.random() * 2);
      for (let b = 0; b < burstCount; b++) {
        const delay = 150 + Math.random() * 500 + b * 200;
        setTimeout(() => {
          if (!params.tacticalEnabled) return;
          const tNow = clock.elapsedTime;
          spawnSubsysFlag('horizon', tNow);
        }, delay);
      }
    }
  }

  function spawnWarning() {
    const warn = document.createElement('div');
    warn.className = 'neuro-tac-warn';
    warn.textContent = TAC_WARNINGS[Math.floor(Math.random() * TAC_WARNINGS.length)];
    const margin = 80;
    const corners = [
      { top: margin, left: '50%', transform: 'translateX(-50%)' },
      { bottom: margin, left: '50%', transform: 'translateX(-50%)' },
      { top: '40%', left: margin },
      { top: '40%', right: margin }
    ];
    const c = corners[Math.floor(Math.random() * corners.length)];
    Object.assign(warn.style, c);
    if (c.transform) warn.style.transform = c.transform;
    tacLayer.appendChild(warn);
    setTimeout(() => warn.remove(), 4400);
  }

  function spawnScanSweep() {
    const scan = document.createElement('div');
    scan.className = 'neuro-tac-scan';
    scan.style.top = '0px';
    tacLayer.appendChild(scan);
    const h = window.innerHeight;
    const duration = 1400 + Math.random() * 800;
    const start = performance.now();
    function tick() {
      const elapsed = performance.now() - start;
      const p = elapsed / duration;
      if (p >= 1) { scan.remove(); return; }
      scan.style.top = (p * h) + 'px';
      scan.style.opacity = (Math.sin(p * Math.PI) * 0.7).toFixed(2);
      requestAnimationFrame(tick);
    }
    tick();
  }

  function tacticalTick(t) {
    if (!params.tacticalEnabled) {
      // Drain any pending annotations if the toggle gets flipped off
      while (tacAnnotations.length) {
        disposeAnnotation(tacAnnotations.pop());
      }
      // Also update SVG viewBox in case window resized
      return;
    }
    // Update viewBox of SVG layer to current size in case of resize
    tacSvg.setAttribute('viewBox', `0 0 ${window.innerWidth} ${window.innerHeight}`);

    // Construct event — gated by max simultaneous label cap
    if (t > nextConstructT) {
      const activeConstructAnns = tacAnnotations.filter(
        a => a.attachedTo === 'construct' || a.isReticle3D || a.isStack3D || a.isAnimEffect
      ).length;
      if (activeConstructAnns < params.maxConstructLabels) {
        if (Math.random() < 0.08) spawnScanSweep();
        else fireConstructEvent(t);
        logEvent('construct', 0.5);
      }
      const mean = 60 / Math.max(0.05, params.tacticalConstructFreq);
      nextConstructT = t + mean * (0.4 + Math.random() * 1.4);
    }

    // Horizon event
    if (t > nextHorizonT) {
      fireHorizonEvent(t);
      const mean = 60 / Math.max(0.05, params.tacticalHorizonFreq);
      nextHorizonT = t + mean * (0.4 + Math.random() * 1.4);
    }

    // Attack vector — independent scheduler
    if (params.attackVectorEnabled && t > nextAttackVectorT) {
      spawnAttackVector(t);
      logEvent('attack', 0.85);
      const mean = 60 / Math.max(0.05, params.attackVectorFreq);
      nextAttackVectorT = t + mean * (0.4 + Math.random() * 1.4);
    }

    // Extended animation events — independent scheduler
    if (params.tacticalAnimationsEnabled && t > nextAnimationT) {
      fireAnimationEvent(t);
      logEvent('anim', 0.45);
      const mean = 60 / Math.max(0.05, params.tacticalAnimationsFreq);
      nextAnimationT = t + mean * (0.4 + Math.random() * 1.4);
    }

    // Terrain labels — maintain target count (top-up scheduler), gated by freq
    if (params.terrainEnabled) {
      const activeCount = tacAnnotations.filter(a => a.isTerrainLabel).length;
      if (activeCount < params.terrainTargetCount && t > nextTerrainT) {
        spawnTerrainLabel(t);
        const mean = 60 / Math.max(0.05, params.terrainFreq);
        nextTerrainT = t + mean * (0.5 + Math.random());
      }
    }

    // Re-project all live annotations
    updateAnnotations(t);
  }

  // --- Mycotoxin bleed: subtle wrongness ---
  const bleedEl = document.createElement('div');
  bleedEl.className = 'neuro-bleed';
  overlay.appendChild(bleedEl);

  // Tactical overlay layer (DOM labels)
  const tacLayer = document.createElement('div');
  tacLayer.className = 'neuro-tac-layer';
  overlay.appendChild(tacLayer);

  // Tactical SVG layer (leader lines that connect anchors to labels)
  const tacSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  tacSvg.setAttribute('class', 'neuro-tac-svg');
  tacSvg.setAttribute('preserveAspectRatio', 'none');
  tacSvg.setAttribute('viewBox', `0 0 ${window.innerWidth} ${window.innerHeight}`);
  overlay.appendChild(tacSvg);

  // Tactical world-space group — face highlights, edge tracers, vertex pips live here
  const tacWorldGroup = new THREE.Group();
  scene.add(tacWorldGroup);

  let nextBleedT = 8 + Math.random() * 30;
  let bleedActive = false;
  let bleedEndT = 0;

  function corrupt(text) {
    const combiners = ['\u0336', '\u0337', '\u0338', '\u0489', '\u0334'];
    return text.split('').map(c => {
      if (Math.random() < 0.4) return c + combiners[Math.floor(Math.random()*combiners.length)];
      return c;
    }).join('');
  }

  const BLEED_SUBS = [
    ['signal lock :: nominal', 'signal lock :: necrotic'],
    ['wetware buffer', 'fungal buffer'],
    ['ice ping', 'capillary ping'],
    ['handshake', 'hemorrhage'],
    ['NOMINAL', 'INVADED'],
    ['CASE.H', 'CASE.H?'],
    ['data shard', 'tissue shard']
  ];

  function triggerBleed(t) {
    bleedActive = true;
    bleedEndT = t + 0.6 + Math.random() * 0.6;
    bleedEl.classList.add('on');
    bleedEl.style.opacity = params.bleedIntensity * 0.7;
    // wetware readout flips
    const wetEl = hudTR.querySelector('[data-bind="wetware"]');
    if (wetEl) {
      wetEl.classList.remove('val');
      wetEl.classList.add('red');
      wetEl.textContent = ['BREACHED','INVADED','NECROTIC','BLOOMING','M̷Y̷C̷O̷'][Math.floor(Math.random()*5)];
    }
    // signal bar flickers red
    const sigBar = hudTL.querySelector('[data-bar="signal"]');
    if (sigBar) sigBar.classList.add('crit');
    // corrupt a log line
    const corrupted = BLEED_SUBS[Math.floor(Math.random() * BLEED_SUBS.length)];
    pushLog(corrupt(corrupted[1]), 'red');
    logEvent('bleed', 0.5);

    // === HOOK: bleed × tactical interaction (next rev) ===
    // When bleed is active, live tactical annotations could be visually
    // corrupted: labels go red, subtext glitches to null/decay, leader
    // lines flicker, etc. The infrastructure exists via tacAnnotations
    // and ann.labelEl / ann.leader; this hook is intentionally empty.
    // ====================================================

    // schedule next
    nextBleedT = t + (60 / Math.max(0.1, params.bleedFrequency)) * (0.5 + Math.random());
  }

  function endBleed() {
    bleedActive = false;
    bleedEl.classList.remove('on');
    bleedEl.style.opacity = 0;
    const wetEl = hudTR.querySelector('[data-bind="wetware"]');
    if (wetEl) {
      wetEl.classList.remove('red');
      wetEl.classList.add('val');
      wetEl.textContent = 'NOMINAL';
    }
    const sigBar = hudTL.querySelector('[data-bar="signal"]');
    if (sigBar) sigBar.classList.remove('crit');
  }

  // --- Post-process: scanlines + CRT curvature + bloom ---
  const postScene = new THREE.Scene();
  const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const renderTarget = new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight, {
    minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
    format: THREE.RGBAFormat, type: THREE.HalfFloatType,
    samples: 4 // MSAA for line anti-aliasing
  });
  const postMat = new THREE.ShaderMaterial({
    uniforms: {
      tDiffuse: { value: renderTarget.texture },
      uTime: { value: 0 },
      uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
      uScanline: { value: params.scanlineIntensity },
      uBloom: { value: params.bloomStrength },
      uCurvature: { value: params.curvature },
      uBleed: { value: 0 },
      uBleedDisplace: { value: params.bleedDisplacement }
    },
    vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position, 1.0); }`,
    fragmentShader: `
      precision highp float;
      varying vec2 vUv;
      uniform sampler2D tDiffuse;
      uniform float uTime;
      uniform vec2 uResolution;
      uniform float uScanline;
      uniform float uBloom;
      uniform float uCurvature;
      uniform float uBleed;
      uniform float uBleedDisplace;

      // CRT barrel distortion
      vec2 curve(vec2 uv) {
        uv = uv * 2.0 - 1.0;
        vec2 offset = abs(uv.yx) / vec2(6.0, 4.5) * uCurvature;
        uv = uv + uv * offset * offset;
        uv = uv * 0.5 + 0.5;
        return uv;
      }

      vec3 sampleBlur(vec2 uv, float radius) {
        vec3 acc = vec3(0.0);
        for (int i = 0; i < 8; i++) {
          float a = float(i) * 0.7853981633974483;
          vec2 off = vec2(cos(a), sin(a)) * radius;
          acc += texture2D(tDiffuse, uv + off).rgb;
        }
        return acc / 8.0;
      }

      float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
      float hash1(float n) { return fract(sin(n) * 43758.5453); }

      void main() {
        vec2 uv = curve(vUv);

        // Outside curved area -> black bezel
        if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) {
          gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
          return;
        }

        // === ANTENNA-KNOCKED DISPLACEMENT (active only during bleed) ===
        float displaceStrength = uBleed * uBleedDisplace;
        if (displaceStrength > 0.0) {
          // Horizontal tearing: pick a few slices, offset their x
          // Each slice is a band of y, with random x shift
          float sliceY = floor(uv.y * 60.0);
          float sliceShift = hash1(sliceY + floor(uTime * 18.0)) - 0.5;
          // Only some slices tear, controlled by a threshold
          float tearMask = step(0.62, hash1(sliceY * 1.31 + floor(uTime * 12.0)));
          uv.x += sliceShift * 0.12 * displaceStrength * tearMask;

          // Vertical sync roll: a band of vertical offset that rolls down the screen
          float rollPos = mod(uTime * 0.4, 1.5) - 0.25; // off-screen most of the time
          float rollBand = smoothstep(0.0, 0.04, rollPos - uv.y) * smoothstep(0.0, 0.04, uv.y - rollPos + 0.18);
          uv.y += rollBand * 0.05 * displaceStrength;

          // Wider chromatic split during bleed
          // (sample r/g/b at different offsets later)
        }

        // Slight chromatic shift on the green channel for phosphor feel,
        // amplified during bleed displacement
        float chromShift = 0.0005 + displaceStrength * 0.006;
        vec3 col;
        col.r = texture2D(tDiffuse, uv + vec2(chromShift, 0.0)).r;
        col.g = texture2D(tDiffuse, uv).g;
        col.b = texture2D(tDiffuse, uv - vec2(chromShift, 0.0)).b;

        // === STATIC NOISE INJECTION during bleed ===
        if (displaceStrength > 0.0) {
          float noiseSlice = step(0.85, hash1(floor(uv.y * 90.0) + floor(uTime * 28.0)));
          float noiseAmt = hash(uv * uResolution + uTime * 200.0);
          // Strong band-restricted noise
          col = mix(col, vec3(noiseAmt) * 1.2, noiseSlice * displaceStrength * 0.55);
          // Global static-y wash
          col += (vec3(noiseAmt) - 0.5) * displaceStrength * 0.18;
        }

        // Phosphor bloom
        vec3 blurred = sampleBlur(uv, 0.004);
        vec3 bright = max(blurred - 0.4, 0.0);
        col += bright * uBloom * 1.4;

        // Scanlines
        float scan = sin(uv.y * uResolution.y * 1.5) * 0.5 + 0.5;
        col *= mix(1.0, scan, uScanline * 0.5);

        // Subtle horizontal CRT mask (RGB triads)
        float mask = sin(uv.x * uResolution.x * 3.14159 * 0.5) * 0.5 + 0.5;
        col *= mix(1.0, mask, uScanline * 0.15);

        // Vignette
        float vig = smoothstep(1.2, 0.3, length(vUv - 0.5));
        col *= mix(0.5, 1.0, vig);

        // Phosphor grain
        float g = hash(uv * uResolution + uTime * 60.0);
        col += (g - 0.5) * 0.04;

        // Faint horizontal roll bar
        float roll = sin((uv.y - uTime * 0.08) * 6.283185) * 0.5 + 0.5;
        roll = pow(roll, 30.0);
        col += vec3(0.05, 0.08, 0.05) * roll * 0.6;

        // Bleed tint — pushes red on the borders during a bleed event
        if (uBleed > 0.0) {
          float edge = pow(length(vUv - 0.5) * 1.4, 2.0);
          col.r += uBleed * edge * 0.6;
          col.g -= uBleed * edge * 0.15;
        }

        gl_FragColor = vec4(col, 1.0);
      }
    `,
    depthWrite: false, depthTest: false
